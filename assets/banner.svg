<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">AIスライド制作スキル集 日本語版</title>
  <desc id="desc">209件のツールを、用途と編集のしやすさから選べる日本語ガイド。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#142844"/><stop offset="1" stop-color="#071524"/></linearGradient></defs>
  <rect width="1200" height="260" rx="22" fill="url(#bg)"/>
  <g fill="none" stroke="#284760"><rect x="916" y="36" width="170" height="116" rx="10"/><rect x="953" y="64" width="170" height="116" rx="10"/><rect x="990" y="92" width="170" height="116" rx="10"/></g>
  <g font-family="system-ui, -apple-system, 'Noto Sans JP', 'Yu Gothic', sans-serif">
    <text x="56" y="58" fill="#9ebdd7" font-size="17" letter-spacing="2">用途と編集のしやすさから選ぶ</text>
    <text x="56" y="120" fill="#ffffff" font-size="44" font-weight="700">AIスライド制作スキル集</text>
    <text x="56" y="162" fill="#c6d7e8" font-size="22">209件のツールを、日本語で。</text>
    <rect x="56" y="190" width="192" height="34" rx="17" fill="#26405e"/><text x="74" y="213" fill="#eaf2fb" font-size="15">編集可能なPowerPoint</text>
    <rect x="262" y="190" width="118" height="34" rx="17" fill="#26405e"/><text x="284" y="213" fill="#eaf2fb" font-size="15">Webスライド</text>
    <rect x="394" y="190" width="154" height="34" rx="17" fill="#e9ad58"/><text x="414" y="213" fill="#142238" font-size="15" font-weight="700">非公式・日本語版</text>
  </g>
</svg>
