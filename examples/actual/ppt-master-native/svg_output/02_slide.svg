<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" lang="ja" font-family="Noto Sans JP" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F3F5EF" /><g id="title" data-pptx-bounds="64 72 1140 98"><text x="64" y="135" font-size="48" font-weight="700" fill="#143F47">用途に合わせて、出力を選ぶ。</text></g><g id="output-1" data-pptx-bounds="64 235 358 320"><rect x="64" y="235" width="358" height="6" fill="#143F47" /><text x="64" y="308" font-size="27" font-weight="700" fill="#143F47">PowerPoint</text><text x="64" y="398" font-size="21" font-weight="400" fill="#143F47">会議や提案に。</text><text x="64" y="445" font-size="19" font-weight="400" fill="#52656A">文字と図形を、後から編集。</text><text x="64" y="525" font-size="54" font-weight="700" fill="#52656A">01</text></g><g id="output-2" data-pptx-bounds="458 235 358 320"><rect x="458" y="235" width="358" height="6" fill="#143F47" /><text x="458" y="308" font-size="27" font-weight="700" fill="#143F47">ウェブスライド</text><text x="458" y="398" font-size="21" font-weight="400" fill="#143F47">動きのある発表に。</text><text x="458" y="445" font-size="19" font-weight="400" fill="#52656A">ブラウザーで、そのまま再生。</text><text x="458" y="525" font-size="54" font-weight="700" fill="#52656A">02</text></g><g id="output-3" data-pptx-bounds="852 235 358 320"><rect x="852" y="235" width="358" height="6" fill="#143F47" /><text x="852" y="308" font-size="27" font-weight="700" fill="#143F47">画像スライド</text><text x="852" y="398" font-size="21" font-weight="400" fill="#143F47">見た目を固定したいときに。</text><text x="852" y="445" font-size="19" font-weight="400" fill="#52656A">出力後の文字編集には制約。</text><text x="852" y="525" font-size="54" font-weight="700" fill="#52656A">03</text></g><g id="footer" data-pptx-bounds="64 655 1150 28" fill="#52656A" font-size="14" font-weight="400"><text x="64" y="677">PPT MASTER / JAPANESE VECTOR EXAMPLE</text><text x="1150" y="677">02 / 04</text></g></svg>
