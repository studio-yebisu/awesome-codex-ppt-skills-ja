<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" lang="ja" font-family="Noto Sans JP" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F3F5EF" /><g id="title" data-pptx-bounds="64 72 1150 98"><text x="64" y="135" font-size="48" font-weight="700" fill="#143F47">日本語の読みやすさを、整える。</text></g><g id="sample" data-pptx-bounds="64 238 572 282"><rect x="64" y="238" width="572" height="282" fill="#143F47" /><text x="98" y="332" font-size="42" font-weight="700" fill="#F3F5EF">自然な改行は、</text><text x="98" y="398" font-size="42" font-weight="700" fill="#F3F5EF">理解の手助け。</text></g><g id="explanation" data-pptx-bounds="702 253 512 250" fill="#143F47"><text x="702" y="296" font-size="29" font-weight="700">Noto Sans JP</text><text x="702" y="365" font-size="22" font-weight="400">見出しと本文の大きさを分ける。</text><text x="702" y="415" font-size="22" font-weight="400">意味のまとまりで改行する。</text><text x="702" y="465" font-size="22" font-weight="400">文字を詰めすぎず、余白を残す。</text></g><g id="footer" data-pptx-bounds="64 655 1150 28" fill="#52656A" font-size="14" font-weight="400"><text x="64" y="677">PPT MASTER / JAPANESE VECTOR EXAMPLE</text><text x="1150" y="677">03 / 04</text></g></svg>
