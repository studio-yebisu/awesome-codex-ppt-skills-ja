<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>遠くの席へ、伝わる資料。 / PNGプレビュー</title><style>html,body{margin:0;background:#1a1a1a;height:100%;overflow:hidden}main{height:100%;display:grid;place-items:center}img{width:100%;height:100%;object-fit:contain}nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;display:flex;align-items:center;gap:15px;border-radius:5px;font:14px sans-serif}button{background:none;border:0;color:#fff;font-size:20px;cursor:pointer}a{color:#fff}</style></head><body><main><img id="page" src="render/slide-01.png" alt="遠くの席へ、伝わる資料。"></main><nav><button id="prev" aria-label="前のページ">←</button><span id="counter">1 / 6</span><button id="next" aria-label="次のページ">→</button><a href="deck.pptx">編集PPTX</a><a href="deck.pdf">PDF</a></nav><script>let current=0;function show(n){current=Math.max(0,Math.min(5,n));document.querySelector('#page').src='render/slide-'+String(current+1).padStart(2,'0')+'.png';document.querySelector('#counter').textContent=(current+1)+' / 6';if(parent!==window&&location.origin!=='null')parent.postMessage({type:'yebisu-page',index:current},location.origin)}document.querySelector('#prev').onclick=()=>show(current-1);document.querySelector('#next').onclick=()=>show(current+1);addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')show(current+1);if(e.key==='ArrowLeft')show(current-1)});addEventListener('message',e=>{if(e.source===parent&&e.origin===location.origin&&e.data?.type==='yebisu-slide'&&Number.isInteger(e.data.index))show(e.data.index)});</script></body></html>
