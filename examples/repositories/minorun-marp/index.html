<h1 id="git%E3%81%AE%E5%A4%89%E6%9B%B4%E3%81%A9%E3%81%93%E3%81%AB%E4%BF%9D%E5%AD%98%E3%81%95%E3%82%8C%E3%81%9F">Gitの変更、どこに保存された？</h1>
<p>はじめてのGit勉強会</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-class="crosshead" data-theme="lpxuhj5qvkp2ujhll9hazcvtc0g8pmkv0eu09up0m69" lang="ja" class="crosshead" data-marpit-pagination="2" style="--paginate:true;--class:crosshead;--theme:lpxuhj5qvkp2ujhll9hazcvtc0g8pmkv0eu09up0m69;" data-marpit-pagination-total="9">
<h1 id="%E4%BF%9D%E5%AD%98%E3%81%97%E3%81%9F%E5%A4%89%E6%9B%B4%E3%81%AF%E3%81%A9%E3%81%93%E3%81%AB%E3%81%82%E3%82%8B">保存した変更はどこにある？</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-theme="lpxuhj5qvkp2ujhll9hazcvtc0g8pmkv0eu09up0m69" lang="ja" data-marpit-pagination="3" style="--paginate:true;--theme:lpxuhj5qvkp2ujhll9hazcvtc0g8pmkv0eu09up0m69;" data-marpit-pagination-total="9">
<h1 id="%E3%81%BE%E3%81%9A%E5%A4%89%E6%9B%B4%E3%81%AE%E7%8F%BE%E5%9C%A8%E5%9C%B0%E3%82%92%E8%A6%8B%E3%82%8B">まず、変更の現在地を見る</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-console"><span class="hljs-meta prompt_">$ </span><span class="language-bash">git status</span>
modified: README.md
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="lpxuhj5qvkp2ujhll9hazcvtc0g8pmkv0eu09up0m69" lang="ja" data-marpit-pagination="4" style="--paginate:true;--theme:lpxuhj5qvkp2ujhll9hazcvtc0g8pmkv0eu09up0m69;" data-marpit-pagination-total="9">
<h1 id="%E5%A4%89%E6%9B%B4%E3%81%AF%E4%BD%9C%E6%A5%AD%E3%83%95%E3%82%A9%E3%83%AB%E3%83%80%E3%81%AB%E3%81%82%E3%82%8B">変更は作業フォルダにある</h1>
<p><img src="images/location-1.svg" alt="" style="width:1100px;" /></p>
<p>エディターで保存すると、ファイルが変わる。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="lpxuhj5qvkp2ujhll9hazcvtc0g8pmkv0eu09up0m69" lang="ja" data-marpit-pagination="5" style="--paginate:true;--theme:lpxuhj5qvkp2ujhll9hazcvtc0g8pmkv0eu09up0m69;" data-marpit-pagination-total="9">
<h1 id="%E8%A8%98%E9%8C%B2%E3%81%97%E3%81%9F%E3%81%84%E5%A4%89%E6%9B%B4%E3%82%92%E9%81%B8%E3%81%B6">記録したい変更を選ぶ</h1>
<p><img src="images/location-2.svg" alt="" style="width:1100px;" /></p>
<p><code>git add README.md</code></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="lpxuhj5qvkp2ujhll9hazcvtc0g8pmkv0eu09up0m69" lang="ja" data-marpit-pagination="6" style="--paginate:true;--theme:lpxuhj5qvkp2ujhll9hazcvtc0g8pmkv0eu09up0m69;" data-marpit-pagination-total="9">
<h1 id="%E9%81%B8%E3%82%93%E3%81%A0%E5%A4%89%E6%9B%B4%E3%82%92%E5%B1%A5%E6%AD%B4%E3%81%B8%E6%AE%8B%E3%81%99">選んだ変更を履歴へ残す</h1>
<p><img src="images/location-3.svg" alt="" style="width:1100px;" /></p>
<p><code>git commit -m &quot;手順を追加&quot;</code></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="lpxuhj5qvkp2ujhll9hazcvtc0g8pmkv0eu09up0m69" lang="ja" data-marpit-pagination="7" style="--paginate:true;--theme:lpxuhj5qvkp2ujhll9hazcvtc0g8pmkv0eu09up0m69;" data-marpit-pagination-total="9">
<h1 id="%E5%B1%A5%E6%AD%B4%E3%82%92%E3%83%81%E3%83%BC%E3%83%A0%E3%81%B8%E5%B1%8A%E3%81%91%E3%82%8B">履歴をチームへ届ける</h1>
<p><img src="images/location-4.svg" alt="" style="width:1100px;" /></p>
<p><code>git push</code> の前に、送り先とブランチを確認。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="lpxuhj5qvkp2ujhll9hazcvtc0g8pmkv0eu09up0m69" lang="ja" data-marpit-pagination="8" style="--paginate:true;--theme:lpxuhj5qvkp2ujhll9hazcvtc0g8pmkv0eu09up0m69;" data-marpit-pagination-total="9">
<h1 id="%E8%BF%B7%E3%81%A3%E3%81%9F%E3%82%89%E3%81%BE%E3%81%9A%E7%8A%B6%E6%85%8B%E3%81%A8%E5%B7%AE%E5%88%86%E3%82%92%E8%AA%AD%E3%82%80">迷ったら、まず状態と差分を読む</h1>
<p><code>git status</code> で変更の位置を見る。</p>
<p><code>git diff</code> で変更の中身を読む。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-class="crosshead" data-theme="lpxuhj5qvkp2ujhll9hazcvtc0g8pmkv0eu09up0m69" lang="ja" class="crosshead" data-marpit-pagination="9" style="--paginate:true;--class:crosshead;--theme:lpxuhj5qvkp2ujhll9hazcvtc0g8pmkv0eu09up0m69;" data-marpit-pagination-total="9">
