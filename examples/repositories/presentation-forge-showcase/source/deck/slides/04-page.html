<section class="slide"><h2 class="title" data-anim="rise">進捗が分からないときは、状態を伝える。</h2><div class="two-col" data-stagger="rise"><div><p class="eyebrow">STATE</p><h3 class="subtitle">画像を読み込んでいます。</h3><p class="lead">完了すると、<br>資料が開きます。</p></div><div class="card"><i data-icon="image" class="icon-tile"></i><h3>次の表示も、ひとこと。</h3><p>実際の進捗が取れる工程では、<br>その量に合わせて表示する。</p><p class="muted">数字は処理から。時間から推測しない。</p></div></div><aside class="notes"><p>処理割合が取れない場合でも、現在の作業名と完了後の行先は伝えられる。この例では画像を読み込んだあと資料が開く。</p><p>進行：現在の文と次の文を順に指す。読み手が途中で失敗した場合の行動へ進む。</p></aside></section>
