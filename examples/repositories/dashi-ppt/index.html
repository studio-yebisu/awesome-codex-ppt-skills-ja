  }

  const DEFAULT_PREVIEW_COUNT_BUTTON_LIMIT = 8;
  const STORE = 'dashi-ppt-preview';
  const viewModel = window.__deckViewModel;
  let deckSlides = readPreviewDeckSlides();
  const propsField = document.getElementById('preview-props-field');
  const propsPanel = document.getElementById('preview-props');
  const themePackField = document.getElementById('preview-theme-field');
  const themePackSelect = document.getElementById('preview-theme-pack');
  const layoutVariantsField = document.getElementById('preview-layout-variants-field');
  const layoutVariantsControl = document.getElementById('preview-layout-variants');
  const layoutVariantReadonly = document.getElementById('preview-layout-variant-readonly');
  const transitionSelect = document.getElementById('preview-transition');
  const transitionColorField = document.getElementById('preview-transition-color-field');
  const transitionColorOptions = document.getElementById('preview-transition-color-options');
  let renderingPropControls = false;
  let pendingPropControlsRender = false;
  var ENGLISH_PROP_OPTION_LABELS;

  const urlThemePack = new URLSearchParams(location.search).get(VIEW_PARAM_PACK) || '';
  const saved = readSaved();
  const transitionModes = window.__pageTransitionModes || ['none', 'liquidMorph'];
  const themePacks = options.themePacks || {};
  const defaultThemePack = Object.keys(themePacks).find(key => /^theme\d{2}$/.test(key)) || '';
  const previewCountButtonLimit = normalizePreviewCountButtonLimit(
    options.previewControls?.countButtonMaxValue ?? options.previewCountButtonLimit,
  );
  const initialThemePack = normalizeThemePack(urlThemePack)
    || normalizeThemePack(saved.themePack)
    || normalizeThemePack(options.current?.themePack)
    || normalizeThemePack(document.documentElement.dataset.themePack)
    || defaultThemePack;
  const state = {
    themePack: initialThemePack,
    pageTransition: transitionModes.includes(saved.pageTransition)
      ? saved.pageTransition
      : (transitionModes.includes(options.current?.pageTransition) ? options.current.pageTransition : 'none'),
    pageTransitionColors: sanitizeTransitionColors(saved.pageTransitionColors || options.current?.pageTransitionColors || {}),
  };
  window.__getPreviewState = () => ({...state});
  makePreviewControlKeyboardNeutral(themePackSelect, {blurOnPointer:false});
  makePreviewControlKeyboardNeutral(transitionSelect, {blurOnPointer:false});

  const count = document.getElementById('preview-slide-count');
  renderThemePackControl();
  refreshDeckSlides();
  window.__setActiveThemePack?.(state.themePack || defaultThemePack || '', {navigate:false});
  refreshDeckSlides();
  const TX_COLOR_STOPS = [
    [0, [0,0,0]],
    [0.10, [255,0,0]],
    [0.25, [255,255,0]],
    [0.40, [0,255,0]],
    [0.55, [0,255,255]],
    [0.70, [0,0,255]],
    [0.85, [255,0,255]],
    [1, [255,255,255]],
  ];
  const TX_SLIDER_MAX = 1000;
  function txHex2(n){ return Math.max(0, Math.min(255, Math.round(n))).toString(16).padStart(2,'0'); }
  function txColorAt(t){
    t = Math.max(0, Math.min(1, t));
    for(let i=1;i<TX_COLOR_STOPS.length;i++){
      const [p1,c1] = TX_COLOR_STOPS[i-1];
      const [p2,c2] = TX_COLOR_STOPS[i];
      if(t <= p2){
        const f = p2 === p1 ? 0 : (t - p1) / (p2 - p1);
        return '#' + txHex2(c1[0]+(c2[0]-c1[0])*f) + txHex2(c1[1]+(c2[1]-c1[1])*f) + txHex2(c1[2]+(c2[2]-c1[2])*f);
      }
    }
    return '#ffffff';
  }
  function txHexToRgb(hex){
    const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
    if(!m) return null;
    const n = parseInt(m[1], 16);
    return [(n>>16)&255, (n>>8)&255, n&255];
  }
  function txColorToPos(hex){
    const target = txHexToRgb(hex);
    if(!target) return 0;
    let bestPos = 0, bestD = Infinity;
    for(let i=0;i<=TX_SLIDER_MAX;i++){
      const c = txHexToRgb(txColorAt(i / TX_SLIDER_MAX));
      const d = (c[0]-target[0])**2 + (c[1]-target[1])**2 + (c[2]-target[2])**2;
      if(d < bestD){ bestD = d; bestPos = i; if(d === 0) break; }
    }
    return bestPos;
  }

  function readSaved(){
    try {
      return JSON.parse(localStorage.getItem(window.__previewStoreKey?.() || STORE) || '{}');
    } catch {
      return {};
    }
  }

  function writeSaved(){
    localStorage.setItem(window.__previewStoreKey?.() || STORE, JSON.stringify(state));
    scheduleViewParamsWrite();
  }

  function releasePreviewControlFocus(control){
    requestAnimationFrame(() => control?.blur?.());
  }

  function makePreviewControlKeyboardNeutral(control, opts={}){
    if(!control) return control;
    control.tabIndex = -1;
    if(opts.blurOnPointer !== false){
      control.addEventListener('pointerup', () => releasePreviewControlFocus(control));
      control.addEventListener('touchend', () => releasePreviewControlFocus(control), {passive:true});
    }
    return control;
  }

  function refreshDeckSlides(){
    deckSlides = readPreviewDeckSlides();
    if(count) count.textContent = window.__deckI18n.ui('{current}/{total}页', {current: Math.min(deckSlides.length, Math.max(1, (window.__currentSlideIndex || 0) + 1)), total: deckSlides.length});
  }

  function readPreviewDeckSlides(){
    const runtimeSlides = window.__getVisibleSlides?.();
    const deckRuntimeSlides = Array.isArray(runtimeSlides)
      ? runtimeSlides.filter(slide => slide?.parentElement?.id === 'deck')
      : [];
    if(deckRuntimeSlides.length) return deckRuntimeSlides;
    return [...document.querySelectorAll('#deck > .slide:not([hidden])')];
  }

  function getPreviewLogicalSlideModel(slide){
    const sourceId = slide?.dataset.vmSourceSlideId || slide?.dataset.vmSlideId;
    if(!sourceId) return null;
    return viewModel?.model?.slides?.find(item => item.id === sourceId) || null;
  }

  function getPreviewSlideStateId(slide){
    return window.__getSlideStateId?.(slide) || slide?.dataset.vmVariantStateId || slide?.dataset.vmSlideId || '';
  }

  function getPreviewActiveSlideModel(slide){
    const logical = getPreviewLogicalSlideModel(slide);
    if(!logical) return null;
    if(!Array.isArray(logical.variants)) return logical;
    const stateId = getPreviewSlideStateId(slide);
    return logical.variants.find(variant => variant.stateId === stateId)
      || logical.variants.find(variant => variant.stateId === viewModel?.peek?.('variantSelection')?.[logical.id])
      || logical.variants[0]
      || logical;
  }

  function renderLayoutVariantControl(){
    if(!layoutVariantsField || !layoutVariantsControl) return;
    const slide = getCurrentSlide();
    const logical = getPreviewLogicalSlideModel(slide);
    const variants = Array.isArray(logical?.variants) ? logical.variants : [];
    if(variants.length !== 3 && variants.length !== 4){
      layoutVariantsField.classList.add('is-hidden');
      layoutVariantsControl.replaceChildren();
      layoutVariantReadonly?.classList.add('is-hidden');
      return;
    }
    const activeStateId = getPreviewSlideStateId(slide);
    const activeIndex = Math.max(0, variants.findIndex(variant => variant.stateId === activeStateId));
    const selectedToken = viewModel?.peek?.('variantSelection')?.[logical.id] || logical.selectedVariant;
    const selectedVariant = variants.find(variant => variant.stateId === selectedToken)
      || variants.find(variant => variant.id === selectedToken)
      || variants[0];
    const selectedStateId = selectedVariant?.stateId || '';
    const activeVariant = variants[activeIndex];
    const fragment = document.createDocumentFragment();
    const indicator = document.createElement('span');
    indicator.className = 'pp-seg-indicator';
    indicator.setAttribute('aria-hidden', 'true');
    fragment.appendChild(indicator);
    variants.forEach((variant, index) => {
      const button = document.createElement('button');
      const bespoke = variant.kind === 'bespoke';
      const label = bespoke
        ? window.__deckI18n.ui('Agent 定制方案')
        : window.__deckI18n.ui('版式 {n}', {n:index + 1});
      const active = index === activeIndex;
      const selected = variant.stateId === selectedStateId;
      button.type = 'button';
      button.className = 'preview-prop-choice';
      button.textContent = bespoke ? 'AI' : String(index + 1);
      button.dataset.variantStateId = variant.stateId;
      button.dataset.variantKind = variant.kind || 'template';
      button.classList.toggle('is-active', active);
      button.classList.toggle('is-selected', selected);
      button.setAttribute('aria-current', active ? 'page' : 'false');
      button.setAttribute('aria-pressed', selected ? 'true' : 'false');
      button.setAttribute('aria-label', variant.label
        ? `${label}: ${window.__deckI18n.meta(variant.label)}`
        : label);
      button.title = button.getAttribute('aria-label');
      makePreviewControlKeyboardNeutral(button);
      button.addEventListener('click', () => {
        if(!canEditDeck() || !logical.id || !variant.stateId) return;
        window.__setSlideVariant?.(logical.id, variant.stateId);
      });
      fragment.appendChild(button);
    });
    layoutVariantsControl.replaceChildren(fragment);
    layoutVariantsControl.style.setProperty('--pp-choice-count', String(variants.length));
    layoutVariantsControl.style.setProperty('--pp-choice-index', String(activeIndex));
    layoutVariantsField.classList.remove('is-hidden');
    if(layoutVariantReadonly){
      layoutVariantReadonly.textContent = window.__deckI18n.ui('Agent 定制方案：Agent 根据当前内容和主题风格定制，布局固定');
      layoutVariantReadonly.classList.toggle('is-hidden', activeVariant?.kind !== 'bespoke');
    }
  }

  function renderThemePackControl(){
    if(!themePackField || !themePackSelect) return;
    const entries = Object.entries(themePacks);
    if(!entries.length){
      themePackField.classList.add('is-hidden');
      return;
    }
    const counts = countSlidesByThemePack();
    themePackSelect.innerHTML = '';
    entries.forEach(([key, option]) => {
      const optionEl = document.createElement('option');
      const slideCount = counts[key] || 0;
      optionEl.value = key;
      optionEl.textContent = window.__deckI18n?.meta(option.label || option.displayName || key) ?? (option.label || option.displayName || key);
      optionEl.title = [option.scenario, option.audience].filter(Boolean).join('\n');
      optionEl.disabled = slideCount === 0;
      themePackSelect.appendChild(optionEl);
    });
    const nextThemePack = counts[state.themePack] ? state.themePack : entries.find(([key]) => counts[key])?.[0] || state.themePack;
    if(nextThemePack) state.themePack = nextThemePack;
    themePackSelect.value = state.themePack;
    themePackField.classList.remove('is-hidden');
  }

  function countSlidesByThemePack(){
    return [...document.querySelectorAll('#deck > .slide')].reduce((acc, slide) => {
      const key = slide.dataset.themePack || '';
      if(key) acc[key] = (acc[key] || 0) + 1;
      return acc;
    }, {});
  }

  function normalizeThemePack(value){
    if(!value || !themePacks[value]) return '';
    return value;
  }

  function normalizeTransitionColor(value){
    return /^#[0-9a-f]{6}$/i.test(value || '') ? value.toLowerCase() : '';
  }

  function sanitizeTransitionColors(source){
    const colors = {};
    const defaults = window.__pageTransitionColorDefaults || {};
    Object.entries(source || {}).forEach(([mode, value]) => {
      const color = normalizeTransitionColor(value);
      if(defaults[mode] && color) colors[mode] = color;
    });
    return colors;
  }

  transitionSelect?.addEventListener('change', () => {
    setPageTransition(transitionSelect.value || 'none', {blur:true});
  });

  function setPageTransition(value, opts={}){
    state.pageTransition = transitionModes.includes(value) ? value : 'none';
    window.__setPageTransition?.(state.pageTransition);
    syncTransitionColorControl();
    if(transitionSelect) transitionSelect.value = state.pageTransition;
    if(opts.blur) transitionSelect?.blur();
    writeSaved();
  }

  themePackSelect?.addEventListener('change', () => {
    if(!themePackSelect.value || themePackSelect.selectedOptions[0]?.disabled) return;
    state.themePack = themePackSelect.value;
    window.__setActiveThemePack?.(state.themePack);
    refreshDeckSlides();
    renderLayoutVariantControl();
    applyStoredSlideControls();
    renderPropControls();
    writeSaved();
    releasePreviewControlFocus(themePackSelect);
  });

  addEventListener('swiss-slide-change', refreshSlideControls);
  addEventListener('swiss-slide-variant-change', refreshSlideControls);
  addEventListener('swiss-slide-reorder', refreshSlideControls);
  addEventListener('rd-themechange', refreshSlideControls);
  addEventListener('rd-accentchange', refreshSlideControls);

  function refreshSlideControls(){
    refreshDeckSlides();
    renderLayoutVariantControl();
    renderPropControls();
  }

  function syncTransitionControl(){
    if(transitionSelect) transitionSelect.value = state.pageTransition || 'none';
    window.__setPageTransition?.(state.pageTransition || 'none');
    Object.entries(state.pageTransitionColors || {}).forEach(([mode, color]) => window.__setPageTransitionColor?.(mode, color));
    syncTransitionColorControl();
  }

  function renderTransitionColorOptions(){
    if(!transitionColorOptions) return;
    transitionColorOptions.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.className = 'preview-transition-color-slider';
    const range = document.createElement('input');
    range.type = 'range';
    range.min = '0';
    range.max = String(TX_SLIDER_MAX);
    range.step = '1';
    range.id = 'preview-transition-color-range';
    range.setAttribute('data-transition-color-range', 'true');
    range.setAttribute('aria-label', window.__deckI18n.ui('切换色块颜色'));
    makePreviewControlKeyboardNeutral(range);
    const readout = document.createElement('span');
    readout.className = 'preview-transition-color-readout';
    readout.setAttribute('data-transition-color-readout', 'true');
    const apply = persist => {
      const color = txColorAt(Number(range.value) / TX_SLIDER_MAX);
      range.style.setProperty('--tx-thumb', color);
      readout.textContent = color.toUpperCase();
      updateTransitionColor(color, {persist, syncControl:false});
    };
    range.addEventListener('input', () => apply(false));
    range.addEventListener('change', () => { apply(true); releasePreviewControlFocus(range); });
    wrap.appendChild(range);
    transitionColorOptions.appendChild(wrap);
    transitionColorOptions.appendChild(readout);
  }

  function syncTransitionColorControl(){
    if(!transitionColorField || !transitionColorOptions) return;
    const mode = state.pageTransition || 'none';
    const canColor = !!window.__isPageTransitionColorMode?.(mode);
    transitionColorField.classList.toggle('is-hidden', !canColor);
    if(!canColor) return;
    const color = normalizeTransitionColor(state.pageTransitionColors?.[mode])
      || normalizeTransitionColor(window.__getPageTransitionColor?.(mode))
      || normalizeTransitionColor(window.__pageTransitionColorDefaults?.[mode])
      || '#000000';
    window.__setPageTransitionColor?.(mode, color);
    syncTransitionColorButtons(window.__getPageTransitionColor?.(mode) || color);
  }

  function updateTransitionColor(value, opts={}){
    const mode = state.pageTransition || 'none';
    if(!window.__isPageTransitionColorMode?.(mode)) return;
    const color = normalizeTransitionColor(value);
    if(!color) return;
    state.pageTransitionColors = {...(state.pageTransitionColors || {}), [mode]: color};
    window.__setPageTransitionColor?.(mode, color);
    if(opts.syncControl !== false) syncTransitionColorButtons(color);
    if(opts.persist) writeSaved();
  }

  function syncTransitionColorButtons(color){
    if(!transitionColorOptions) return;
    const current = normalizeTransitionColor(color) || '#000000';
    const range = transitionColorOptions.querySelector('[data-transition-color-range]');
    const readout = transitionColorOptions.querySelector('[data-transition-color-readout]');
    if(range){
      range.value = String(txColorToPos(current));
      range.style.setProperty('--tx-thumb', current);
    }
    if(readout) readout.textContent = current.toUpperCase();
  }

  function applyStoredSlideControls(){
    const vmState = viewModel?.getState?.() || {};
    const slide = getCurrentSlide();
    if(slide) applyPropValues(slide, getSlidePropValues(slide, vmState), {persist:false});
  }

  function getCurrentPropRoot(){
    return getCurrentSlide()?.querySelector('[data-prop-controls]') || null;
  }

  function parsePropControls(root){
    try {
      const controls = JSON.parse(root?.dataset.propControls || '[]') || [];
      return controls.map(translatePropControlForDisplay);
    } catch {
      return [];
    }
  }

  // 显示层翻译(en 下查 metadata 词典,miss 回退中文);只影响面板展示,
  // 不触碰 key/value/options 的取值逻辑。
  function translatePropControlForDisplay(control){
    const i18n = window.__deckI18n;
    if(!i18n?.isEn || !control || typeof control !== 'object') return control;
    const next = { ...control };
    if(typeof next.label === 'string') next.label = i18n.meta(next.label);
    if(typeof next.desc === 'string') next.desc = i18n.meta(next.desc);
    if(typeof next.description === 'string') next.description = i18n.meta(next.description);
    if(typeof next.unit === 'string') next.unit = i18n.meta(next.unit);
    return next;
  }

  function orderPropControlsForPanel(controls, root){
    if(root?.dataset.themeKey !== 'theme12') return controls || [];
    const toneControls = [];
    const rest = [];
    (controls || []).forEach(control => {
      (isToneThemeControl(control) ? toneControls : rest).push(control);
    });
    return [...toneControls, ...rest];
  }

  function isToneThemeControl(control){
    if(control?.key !== 'theme') return false;
    const values = propOptions(control).map(item => String(item.value));
    return values.includes('light') && values.includes('dark');
  }

  function parsePropDefaults(root){
    try {
      return JSON.parse(root?.dataset.propDefaults || '{}') || {};
    } catch {
      return {};
    }
  }

  function getSlidePropValues(slide, vmState = viewModel?.getState?.() || {}){
    const root = slide?.querySelector('[data-prop-controls]');
    if(!root) return {};
    const controls = parsePropControls(root).filter(control => !isHiddenPropControl(control));
    const defaults = parsePropDefaults(root);
    const sourceProps = getSlideSourceProps(slide);
    const savedProps = vmState.props?.[getPreviewSlideStateId(slide)] || {};
    const values = {...defaults, ...sourceProps, ...savedProps};
    controls.forEach(control => {
      values[control.key] = coercePropValue(control, values[control.key]);
    });
    return values;
  }

  function getSlideSourceProps(slide){
    const model = getPreviewActiveSlideModel(slide);
    if(model?.kind !== 'template') return model?.props || {};
    return model.materializedProps
      || window.__resolveRuntimeTemplateVariantProps?.(slide, model)
      || model.props
      || {};
  }

  function renderPropControls(opts = {}){
    if(!propsField || !propsPanel) return;
    if(renderingPropControls){
      pendingPropControlsRender = true;
      return;
    }
    renderingPropControls = true;
    try {
    const slide = getCurrentSlide();
    if(getPreviewActiveSlideModel(slide)?.kind === 'bespoke' || slide?.dataset.vmVariantKind === 'bespoke'){
      propsField.classList.add('is-hidden');
      propsPanel.replaceChildren();
      return;
    }
    const root = getCurrentPropRoot();
    const controls = orderPropControlsForPanel(parsePropControls(root), root);
    if(!root || !controls.length){
      propsField.classList.add('is-hidden');
      propsPanel.replaceChildren();
      return;
    }
    const values = getSlidePropValues(slide);
    const imageListCountKeys = new Set(
      controls.map(control => getImageListCountProxyControl(control, controls)?.key).filter(Boolean),
    );
    propsField.classList.remove('is-hidden');
    const nextPanel = document.createDocumentFragment();
    controls.forEach(control => {
      const proxyControl = getImageListCountProxyControl(control, controls);
      if(!proxyControl && (imageListCountKeys.has(control.key) || isHiddenPropControl(control))) return;
      const renderControl = proxyControl || control;
      if(!shouldRenderPropControl(renderControl, values)) return;
      const row = document.createElement('div');
      row.className = 'preview-prop-row';
      const controlType = proxyControl ? 'range' : normalizePropControlType(renderControl.type, renderControl);
      const isColor = renderControl.display === 'color';
      const label = document.createElement('span');
      label.title = control.label || control.key;
      label.textContent = control.label || control.key;
      row.appendChild(label);
      if(controlType === 'toggle'){
        const sw = document.createElement('label');
        sw.className = 'pp-switch';
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.checked = !!values[renderControl.key];
        makePreviewControlKeyboardNeutral(input);
        input.addEventListener('change', () => {
          updateCurrentProp(renderControl, input.checked);
          releasePreviewControlFocus(input);
        });
        const track = document.createElement('span'); track.className = 'pp-track';
        const knob = document.createElement('span'); knob.className = 'pp-knob';
        sw.appendChild(input); sw.appendChild(track); sw.appendChild(knob);
        row.appendChild(sw);
      } else if(isColor || controlType === 'segment'){
        row.classList.add('is-choice');
        const group = document.createElement('div');
        group.className = 'preview-prop-choice-group' + (isColor ? ' is-color' : '');
        group.setAttribute('role', 'group');
        group.setAttribute('aria-label', control.label || control.key);
        const options = propOptions(renderControl);
        if(isColor){
          group.style.setProperty('--pp-color-cols', '3');
        }else{
          group.style.gridTemplateColumns = `repeat(${Math.max(1, options.length)}, minmax(0, 1fr))`;
          group.style.setProperty('--pp-choice-count', String(Math.max(1, options.length)));
          const indicator = document.createElement('span');
          indicator.className = 'pp-seg-indicator';
          indicator.setAttribute('aria-hidden', 'true');
          group.appendChild(indicator);
        }
        options.forEach(item => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'preview-prop-choice';
          button.dataset.propValue = propOptionDomValue(item.value);
          button.textContent = item.label;
          makePreviewControlKeyboardNeutral(button);
          if(isColor){
            button.textContent = '';
            button.style.background = propSwatchColor(renderControl, item);
            button.title = item.label;
            button.dataset.colorLabel = item.label;
            button.setAttribute('aria-label', item.label);
          }
          button.addEventListener('click', () => {
            updateCurrentProp(renderControl, item.value, {render:false});
            syncSelectionButtons(group, item.value);
            if(!isColor) window.setTimeout(renderPropControls, 420, {skipApply:true});
            releasePreviewControlFocus(button);
          });
          group.appendChild(button);
        });
        syncSelectionButtons(group, values[renderControl.key]);
        row.appendChild(group);
      } else if(controlType === 'select'){
        const select = document.createElement('select');
        select.setAttribute('aria-label', control.label || control.key);
        makePreviewControlKeyboardNeutral(select, {blurOnPointer:false});
        propOptions(renderControl).forEach(item => {
          const option = document.createElement('option');
          option.value = propOptionDomValue(item.value);
          option.__propValue = item.value;
          option.textContent = item.label;
          select.appendChild(option);
        });
        select.value = propOptionDomValue(values[renderControl.key]);
        select.addEventListener('change', () => {
          updateCurrentProp(renderControl, select.selectedOptions[0]?.__propValue ?? select.value);
          releasePreviewControlFocus(select);
        });
        row.appendChild(select);
      } else if(controlType === 'icons'){
        row.classList.add('is-icons');
        const group = document.createElement('div');
        group.className = 'preview-prop-icon-grid';
        group.setAttribute('role', 'group');
        group.setAttribute('aria-label', control.label || control.key);
        [{value:'', label:window.__deckI18n.ui('无')}, ...propOptions(renderControl)].forEach(item => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'preview-prop-icon-choice';
          button.dataset.propValue = propOptionDomValue(item.value);
          button.title = item.label;
          button.setAttribute('aria-label', item.label);
          makePreviewControlKeyboardNeutral(button);
          if(item.image){
            const img = document.createElement('img');
            img.src = item.image;
            img.alt = '';
            button.appendChild(img);
          } else {
            const empty = document.createElement('span');
            empty.className = 'preview-prop-icon-empty';
            empty.textContent = window.__deckI18n.ui('无');
            button.appendChild(empty);
          }
          const text = document.createElement('span');
          text.textContent = item.label;
          button.appendChild(text);
          button.addEventListener('click', () => {
            const nextValue = item.value || null;
            updateCurrentProp(renderControl, nextValue, {
              extra: renderControl.key === 'decorSrc' && nextValue ? {showDecor: true} : {},
            });
            syncIconButtons(group, nextValue);
            releasePreviewControlFocus(button);
          });
          group.appendChild(button);
        });
        syncIconButtons(group, values[renderControl.key]);
        row.appendChild(group);
      } else {
        const { rawMin, displayOffset, min, max } = resolveRangeBounds(renderControl, values);
        const step = Number(renderControl.step ?? 1);
        const span = (max - min) / (step || 1);
        const numberPickerValues = getCountButtonValues(renderControl, min, max, step);
        if(numberPickerValues.length){
          row.classList.add('is-number-picker');
          const group = document.createElement('div');
          group.className = 'preview-prop-number-grid';
          group.style.setProperty('--pp-number-cols', String(Math.min(5, Math.max(1, numberPickerValues.length))));
          group.setAttribute('role', 'group');
          group.setAttribute('aria-label', control.label || control.key);
          numberPickerValues.forEach(displayValue => {
            const rawValue = displayValue - displayOffset;
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'preview-prop-number-choice';
            button.dataset.propValue = String(Number(rawValue));
            button.textContent = formatTickValue(displayValue);
            button.setAttribute('aria-label', `${control.label || control.key} ${formatTickValue(displayValue)}`);
            makePreviewControlKeyboardNeutral(button);
            button.addEventListener('click', () => {
              updateCurrentProp(renderControl, rawValue);
              syncNumberButtons(group, rawValue);
              releasePreviewControlFocus(button);
            });
            group.appendChild(button);
          });
          syncNumberButtons(group, values[renderControl.key]);
          row.appendChild(group);
        } else {
          row.classList.add('is-range');
          const stepped = Number.isInteger(step) && step >= 1 && Number.isInteger(min) && Number.isInteger(max) && span <= 12;
          const wrap = document.createElement('div');
          wrap.className = 'pp-slider ' + (stepped ? 'is-stepped' : 'is-smooth');
          const track = document.createElement('div');
          track.className = 'pp-slider-track';
          const input = document.createElement('input');
          input.type = 'range';
          input.min = min; input.max = max; input.step = step;
          input.value = clampNumber(Number(values[renderControl.key] ?? rawMin) + displayOffset, min, max);
          makePreviewControlKeyboardNeutral(input);
          track.appendChild(input);
          let ticks = null;
          if(stepped){
            ticks = document.createElement('div');
            ticks.className = 'pp-ticks';
            for(let i = 0; i <= span; i++){
              const tick = document.createElement('span');
              tick.dataset.label = formatTickValue(min + i * step);
              ticks.appendChild(tick);
            }
            track.appendChild(ticks);
          }
          const output = document.createElement('output');
          const unit = renderControl.unit || '';
          const sync = () => {
            const v = Number(input.value);
            track.style.setProperty('--pp-pct', (max > min ? (v - min) / (max - min) * 100 : 0) + '%');
            output.textContent = v + unit;
            if(ticks) ticks.querySelectorAll('span').forEach((t, i) => t.classList.toggle('on', i <= (v - min) / step));
          };
          sync();
          input.addEventListener('input', () => { sync(); updateCurrentProp(renderControl, Number(input.value) - displayOffset, {render:false}); });
          input.addEventListener('change', () => releasePreviewControlFocus(input));
          wrap.appendChild(track);
          wrap.appendChild(output);
          row.appendChild(wrap);
        }
      }
      nextPanel.appendChild(row);
    });
    propsPanel.replaceChildren(nextPanel);
    // 调用方如果刚调过 applyPropValues(比如 updateCurrentProp 里那次),这里就不用再渲染一遍
    // 同样的值——避免用户每次调参都看到两次刷新。
    if(!opts.skipApply) applyPropValues(slide, values, {persist:false});
    } finally {
      renderingPropControls = false;
      if(pendingPropControlsRender){
        pendingPropControlsRender = false;
        renderPropControls();
      }
    }
  }

  function resolveRangeMax(control, values, min){
    if(control.maxFromKey){
      const base = Number(values[control.maxFromKey]);
      if(Number.isFinite(base)) return base + Number(control.maxFromKeyOffset ?? 0);
    }
    if(control.maxByKey && control.maxByValue && Object.prototype.hasOwnProperty.call(control.maxByValue, values[control.maxByKey])){
      const mapped = Number(control.maxByValue[values[control.maxByKey]]);
      if(Number.isFinite(mapped)) return mapped;
    }
    const max = Number(control.max ?? 10);
    return Number.isFinite(max) ? max : min;
  }

  function clampNumber(value, min, max){
    if(!Number.isFinite(value)) return min;
    return Math.max(min, Math.min(value, max));
  }

  function normalizePropControlType(type, control = {}){
    if(control?.display === 'tab' || type === 'enum' || type === 'segment' || type === 'selection' || type === 'select' || type === 'color'){
      const optionCount = propOptions(control).length;
      if(control?.display !== 'color' && optionCount > 0 && optionCount <= 5) return 'segment';
      return 'select';
    }
    if(type === 'boolean' || type === 'checkbox') return 'toggle';
    if(type === 'slider' || type === 'number' || type === 'stepper') return 'range';
    if(type === 'icons') return 'icons';
    if(type === 'text' || type === 'string' || type === 'input' || type === 'url' || type === 'email') return 'text';
    if(type === 'textarea' || type === 'multiline') return 'textarea';
    if(type === 'images') return 'image-list';
    if(type === 'image' || type === 'media' || type === 'picture') return 'image';
    if(type === 'list' || type === 'array' || type === 'object') return 'list';
    return type || 'range';
  }

  function formatTickValue(value){
    return Number.isInteger(value) ? String(value) : String(Math.round(value * 100) / 100);
  }

  function normalizePreviewCountButtonLimit(value){
    const numeric = Number(value ?? DEFAULT_PREVIEW_COUNT_BUTTON_LIMIT);
    return Number.isInteger(numeric) && numeric >= 0 ? numeric : DEFAULT_PREVIEW_COUNT_BUTTON_LIMIT;
  }

  function getCountButtonValues(control, min, max, step){
    if(!isImageCountControl(control)) return [];

<script>
/* =============== Static HTML Export =============== */
(function(){
  const deck = document.getElementById('deck');
  if(!deck) return;
  window.__deckExportLocked = false;

  const vendorScriptPromises = new Map();
  function ensureVendorScript(src, readyCheck){
    if(readyCheck?.()) return Promise.resolve();
    if(vendorScriptPromises.has(src)) return vendorScriptPromises.get(src);
    const promise = new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = src;
      script.onload = () => resolve();
      script.onerror = () => { vendorScriptPromises.delete(src); reject(new Error(window.__deckI18n.ui('无法加载组件 {src}', {src: src}))); };
      document.head.appendChild(script);
    });
    vendorScriptPromises.set(src, promise);
    return promise;
  }
  function ensureHtmlToImageLoaded(){
    return ensureVendorScript('assets/vendor/html-to-image.js', () => window.htmlToImage);
  }

  async function waitForSlideMediaReadyForCapture(root){
    const images = [...root.querySelectorAll('img')].filter(img => { const r = img.getBoundingClientRect(); return r.width > 1 && r.height > 1 && !img.complete; });
    if(!images.length) return;
    await Promise.race([
      Promise.all(images.map(img => new Promise(resolve => { img.addEventListener('load', resolve, { once: true }); img.addEventListener('error', resolve, { once: true }); }))),
      new Promise(resolve => setTimeout(resolve, 4000)),
    ]);
  }

  function finishSlideAnimationsForCapture(root){
    (root.getAnimations?.({ subtree: true }) || []).forEach(animation => {
      try {
        const timing = animation.effect?.getComputedTiming?.();
        const endTime = Number(timing?.endTime);
        if(Number.isFinite(endTime) && endTime > 0) animation.finish();
        else animation.pause();
      } catch {}
    });
    try {
      (window.gsap?.globalTimeline?.getChildren?.(true, true, true) || []).forEach(tween => {
        const targets = typeof tween.targets === 'function' ? tween.targets() : [];
        if(!targets.some(target => target instanceof Node && root.contains(target))) return;
        const duration = Number(tween.totalDuration?.());
        if(Number.isFinite(duration) && duration > 0) tween.progress?.(1);
        tween.pause?.();
      });
    } catch {}
  }

  async function assemblePdfInBrowser(pages, title){
    await ensureVendorScript('assets/vendor/pdf-lib.min.js', () => window.PDFLib?.PDFDocument);
    const { PDFDocument } = window.PDFLib;
    const pdf = await PDFDocument.create();
    pdf.setTitle(title || 'Deck PDF Export');
    pdf.setAuthor('Dashi PPT');
    pdf.setSubject('Browser-captured PDF export');
    const PDF_W = 16 * 72, PDF_H = 9 * 72;
    for(const dataUrl of pages){
      const base64 = String(dataUrl || '').split(',')[1] || '';
      const bytes = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
      const image = /^data:image\/png/i.test(dataUrl) ? await pdf.embedPng(bytes) : await pdf.embedJpg(bytes);
      const page = pdf.addPage([PDF_W, PDF_H]);
      page.drawImage(image, { x: 0, y: 0, width: PDF_W, height: PDF_H });
    }
    const out = await pdf.save();
    return new Blob([out], { type: 'application/pdf' });
  }

  async function captureDeckPagesInBrowser(exportUi){
    await ensureHtmlToImageLoaded();
    const visibleSlides = window.__getVisibleSlides?.() || [...document.querySelectorAll('#deck > .slide:not([hidden])')];

      for(let index = 0; index < descriptors.length; index += 1){
        throwIfDeckExportCancelled(exportUi);
        updateDeckExport(exportUi, index, descriptors.length, window.__deckI18n.ui('浏览器内截取第 {current}/{total} 页...', {current: index + 1, total: descriptors.length}));
        const descriptor = descriptors[index];
        const token = window.__materializeExportSlide?.(descriptor);
        const logicalIndex = Math.max(0, Number(descriptor.logicalIndex) || 0);
        window.go?.(logicalIndex, { animate: false, force: true });
        await waitFrame(); await waitFrame();
        const slide = visibleSlides[logicalIndex];
        visibleSlides.forEach(item => {
          const active = item === slide;
          item.classList.toggle('active', active);
          if(active) item.setAttribute('data-deck-active', '');
          else item.removeAttribute('data-deck-active');
        });
        window.__ensureRuntimeSlideRendered?.(slide);
        window.__restoreEffectIframes?.(slide);
        window.__syncDeckPageNumbers?.(slide);
        window.__layoutDeck?.();
        window.__initUnicornScenes?.(slide, { force: true });
        if(document.fonts?.ready) await Promise.race([document.fonts.ready.catch(() => {}), new Promise(resolve => setTimeout(resolve, 2500))]);
        await waitForSlideMediaReadyForCapture(slide);
        finishSlideAnimationsForCapture(slide);
        await waitFrame(); await waitFrame();
        const capture = window.htmlToImage.toJpeg(slide, withSlideCaptureFilter({ quality: 0.92, pixelRatio: 1.5, backgroundColor: '#000000' }));
        const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error(window.__deckI18n.ui('第 {n} 页截图超时', {n: index + 1}))), 30000));
        pages.push(await Promise.race([capture, timeout]));
        window.__restoreExportSlide?.(token);
      }
    } finally {
      window.__applyDeckVariantSelections?.({force:true, context:'restore browser PDF variants'});
      window.go?.(originalIndex, { animate: false, force: true });
      window.__syncActiveEffects?.();
    }
    return pages;
  }

  // 浏览器内 PDF 导出:服务器在沙箱型宿主(如豆包)里无法启动导出浏览器时的兜底——
  // 截图发生在用户自己打开预览页的浏览器(正常桌面进程,不受宿主沙箱影响),
  // 服务器只用 pdf-lib 做纯 JS 合成。可手动调用,也由 __exportDeckPdf 自动降级触发。
  async function runBrowserPptxExportInFrame(options){
    const frame = document.createElement('iframe');
    frame.style.cssText = 'position:fixed;left:-20020px;top:0;width:1920px;height:1080px;border:0;visibility:hidden;pointer-events:none';
    frame.setAttribute('aria-hidden', 'true');
    frame.src = location.pathname + location.search;
    document.body.appendChild(frame);
    try {
      await new Promise((resolve, reject) => {
        const timer = setTimeout(() => reject(new Error(window.__deckI18n.ui('导出环境加载超时'))), 30000);
        frame.onload = () => { clearTimeout(timer); resolve(); };
        frame.onerror = () => { clearTimeout(timer); reject(new Error(window.__deckI18n.ui('导出环境加载失败'))); };
      });
      const win = frame.contentWindow;
      const doc = frame.contentDocument;
      // 等 iframe 内 deck 就绪
      await new Promise((resolve, reject) => {
        const deadline = Date.now() + 30000;
        (function poll(){
          if(doc.querySelector('#deck > .slide.active') && typeof win.go === 'function') return resolve();
          if(Date.now() > deadline) return reject(new Error(window.__deckI18n.ui('导出环境的页面未就绪')));
          setTimeout(poll, 120);
        })();
      });
      // 注入导出组件
      for(const [src, ready] of [
        ['assets/vendor/html-to-image.js', () => win.htmlToImage],
        ['assets/vendor/pptxgen.bundle.js', () => typeof win.PptxGenJS === 'function'],
        ['assets/vendor/editable-pptx-browser.js', () => win.__editablePptxBrowser?.exportEditablePptxInBrowser],
      ]){
        if(ready()) continue;
        await new Promise((resolve, reject) => {
          const script = doc.createElement('script');
          script.src = src;
          script.onload = () => resolve();
          script.onerror = () => reject(new Error(window.__deckI18n.ui('无法加载组件 {src}', {src: src})));
          doc.head.appendChild(script);
        });
      }
      return await win.__editablePptxBrowser.exportEditablePptxInBrowser(options);
    } finally {
      frame.remove();
    }
  }

  // 浏览器内可编辑 PPTX 导出:服务器在沙箱型宿主里起不了无头浏览器时的降级——
  // 采集/截图/组装全部在用户当前浏览器完成(assets/vendor/editable-pptx-browser.js),
  // 服务器只负责把成品二进制落盘(/api/export-pptx-store)。可手动调用,也由
  // __exportDeckPptx 自动降级触发。
  window.__exportDeckPptxInBrowser = async function(existingUi){
    if(window.__deckExportLocked && !existingUi) return;
    let exportUi = existingUi || null;
    const owns = !exportUi;
    try {
      if(owns) exportUi = beginDeckExport('PPTX');
      updateDeckExport(exportUi, 0, 1, window.__deckI18n.ui('准备浏览器内导出环境...'));
      window.__syncDeckPageNumbers?.();
      window.__flushEditableTextState?.();
      window.__syncDeckViewModelFromDom?.();
      throwIfDeckExportCancelled(exportUi);
      const slides = window.__getExportSlides?.() || window.__getVisibleSlides?.() || [...document.querySelectorAll('#deck > .slide:not([hidden])')];
      // 在屏外 1920×1080 iframe 里跑导出:视口与服务端无头浏览器完全一致(deck 缩放
      // 为 1:1,细元素不会被视口阈值过滤),同时不打断用户正在看的页面;当前的编辑
      // 状态经 snapshot 带入 iframe。
      const { blob, report } = await runBrowserPptxExportInFrame({
        snapshot: buildEditablePptxExportSnapshot(),
        title: document.title || 'Presentation',
        onProgress: update => {
          if(!update?.detail) return;
          const percent = Number(update.percent || 0);
          updateDeckExport(exportUi, Math.min(slides.length, Math.round((percent / 100) * slides.length)), slides.length, window.__deckI18n.ui('{detail}(浏览器内导出)', {detail: window.__deckI18n.exportDetail(update.detail)}));
        },
      });
      throwIfDeckExportCancelled(exportUi);
      updateDeckExport(exportUi, slides.length, slides.length, window.__deckI18n.ui('保存 PPTX...'));
      const downloadName = `${getDeckFileName()}.pptx`;
      // 优先经预览服务落盘(产物进 output/exports,可追溯);静态文件服务器(node/python
      // 静态托管)没有该端点——直接把 blob 交给浏览器下载,导出不依赖任何服务端能力。
      let result = null;
      try {
        const response = await fetch(`/api/export-pptx-store?fileName=${encodeURIComponent(getDeckFileName())}`, {
          method: 'POST',
          headers: {'content-type': 'application/octet-stream'},
          body: blob,
        });
        if(response.ok) result = await response.json();
      } catch {}
      if(result?.downloadUrl){
        window.__lastPptxExportResult = { ...result, ...report, downloadStarted: false };
        const downloadStarted = await startServerExportDownload(result.downloadUrl, 'PPTX');
        window.__lastPptxExportResult.downloadStarted = downloadStarted;
        updateDeckExport(exportUi, slides.length, slides.length, downloadStarted ? window.__deckI18n.ui('PPTX 已开始下载(浏览器内导出)') : window.__deckI18n.ui('PPTX 已生成：{name}', {name: result.relativePath || result.downloadName || 'download'}));
        if(!downloadStarted) alert(window.__deckI18n.ui('PPTX 已生成：\n{name}', {name: result.downloadName || result.relativePath || 'download'}));
        return result;
      }
      downloadBlob(blob, downloadName);
      result = { ok: true, browserCapture: true, blobDownload: true, downloadName, ...report, downloadStarted: true };
      window.__lastPptxExportResult = result;
      updateDeckExport(exportUi, slides.length, slides.length, window.__deckI18n.ui('PPTX 已开始下载(浏览器内导出)'));
      return result;
    } catch (error) {
      if(isDeckExportCancelledError(error)) return null;
      if(!owns) throw error;
      console.error('[export pptx][browser-capture]', error);
      alert(error?.message || window.__deckI18n.ui('PPTX 浏览器内导出失败,请在浏览器控制台查看错误。'));
      return null;
    } finally {
      if(owns) endDeckExport(exportUi);
      window.__syncActiveEffects?.();
    }
  };

  window.__exportDeckPdf = async function(){
    if(window.__deckExportLocked) return;
    // Export is HTTP-service only. Opened directly from disk (file://) there is no
    // export service, and a client-side export can't match server fidelity — so we
    // tell the user to use the preview server instead of producing a lesser file.
    if(!isExportServiceContext()) return showExportServiceRequired();
    let exportUi = null;
    let progressPoll = null;
    try {
      exportUi = beginDeckExport('PDF');
      const progressId = createPdfExportProgressId();
      progressPoll = beginPdfExportProgressPolling(exportUi, progressId);
      updateDeckExport(exportUi, 0, 1, window.__deckI18n.ui('提交截图 PDF 生成任务...'));
      window.__syncDeckPageNumbers?.();
      window.__flushEditableTextState?.();
      window.__syncDeckViewModelFromDom?.();
      throwIfDeckExportCancelled(exportUi);
      const slides = window.__getExportSlides?.() || window.__getVisibleSlides?.() || [...document.querySelectorAll('#deck > .slide:not([hidden])')];
      let response;
      try {
        response = await fetch('/api/export-pdf', {
          method: 'POST',
          headers: {'content-type': 'application/json'},
          body: JSON.stringify({
            title: document.title || 'Presentation',
            fileName: getDeckFileName(),
            sourcePath: getServerExportSourcePath(),
            progressId,
            snapshot: buildPdfExportSnapshot(),
          }),
        });
      } catch {
        response = null;
      }
      progressPoll.stop();
      progressPoll = null;
      throwIfDeckExportCancelled(exportUi);
      // 地址是 HTTP 但背后没有导出服务(通用静态服务器对 POST 返回 501/405,
      // 路径没被服务的返回 404,服务进程退出则 fetch 直接失败):自 blob 导出支持后,
      // 静态服务器同样可以完成全流程——直接切换浏览器内导出(截图+前端合成+blob 下载)。
      if(!response || [404, 405, 501].includes(response.status)){
        updateDeckExport(exportUi, 0, 1, window.__deckI18n.ui('当前服务无导出端点,切换浏览器内导出...'));
        const fallbackResult = await window.__exportDeckPdfInBrowser(exportUi);
        if(fallbackResult) return;
        showExportServiceRequired('no-service');
        return;
      }
      if(!response.ok){
        let detail = '';
        try { detail = (await response.json())?.error || ''; } catch {}
        // 沙箱型宿主(如豆包)里服务器无法启动导出浏览器(Mach/显示服务被拦):
        // 自动降级为「当前浏览器逐页截图 + 服务器纯 JS 合成」。
        if(response.status === 500 && /browser has been closed|browserType\.launch|Target page, context or browser|Chrome executable not found/i.test(detail)){
          updateDeckExport(exportUi, 0, 1, window.__deckI18n.ui('服务器无法启动导出浏览器,切换浏览器内导出...'));
          const fallbackResult = await window.__exportDeckPdfInBrowser(exportUi);
          if(fallbackResult) return;
        }
        throw new Error(detail || `PDF export endpoint failed (${response.status})`);
      }
      const result = await response.json();
      if(!result?.downloadUrl) throw new Error('PDF export did not return a download URL.');
      window.__lastPdfExportResult = result;
      const downloadStarted = await startServerExportDownload(result.downloadUrl, 'PDF');
      window.__lastPdfExportResult.downloadStarted = downloadStarted;
      updateDeckExport(exportUi, slides.length, slides.length, downloadStarted ? window.__deckI18n.ui('PDF 已开始下载') : window.__deckI18n.ui('PDF 已生成：{name}', {name: result.relativePath || result.downloadName || 'download'}));
      if(!downloadStarted) alert(window.__deckI18n.ui('PDF 已生成：\n{name}', {name: result.downloadName || result.relativePath || 'download'}));
    } catch (error) {
      if(isDeckExportCancelledError(error)) return;
      console.error('[export pdf]', error);
      alert(error?.message || window.__deckI18n.ui('PDF 导出失败，请在浏览器控制台查看错误。'));
    } finally {
      progressPoll?.stop?.();
      endDeckExport(exportUi);
      window.__syncActiveEffects?.();
    }
  };

  function createPdfExportProgressId(){
    const random = Math.random().toString(36).slice(2, 10);
    return `pdf-${Date.now().toString(36)}-${random}`;
  }

  function beginPdfExportProgressPolling(exportUi, progressId){
    let stopped = false;
    const read = async () => {
      if(stopped || !progressId) return;
      try {
        const response = await fetch(`/api/export-pdf-progress?id=${encodeURIComponent(progressId)}`, {
          cache: 'no-store',
          credentials: 'same-origin',
        });
        if(!response.ok) return;
        const progress = await response.json();
        const percent = Math.max(0, Math.min(100, Number(progress.percent || 0)));
        const detail = progress.detail ? window.__deckI18n.exportDetail(progress.detail) : window.__deckI18n.ui('正在生成截图 PDF');
        updateDeckExport(exportUi, percent, 100, `${detail} · ${Math.round(percent)}%`);
      } catch {}
      if(!stopped) setTimeout(read, 450);
    };
    read();
    return { stop(){ stopped = true; } };
  }

  function buildPdfExportSnapshot(){
    const currentSlide = (window.__getVisibleSlides?.() || [])[window.__currentSlideIndex || 0];
    return {
      themePack: document.documentElement.dataset.themePack || '',
      variantOutputMode: window.__getDeckVariantOutputMode?.() || 'comparison',
      currentIndex: window.__currentSlideIndex || 0,
      currentSlideStateId: window.__getSlideStateId?.(currentSlide) || currentSlide?.dataset.vmVariantStateId || currentSlide?.dataset.vmSlideId || '',
      state: window.__getDeckViewModelState?.() || {},
      canvasSnapshots: collectEditablePptxCanvasSnapshots(),
    };
  }

  // 导出走 snapshot(见 buildPdfExportSnapshot / collectEditablePptxCanvasSnapshots)把当前主题包/
  // 页面/编辑状态整份带给服务端,sourcePath 只用来定位要打开的 HTML 文件——不需要,也不应该带上
  // 任何查询参数(轻量视图定位参数也不例外),避免污染导出产物。
  function getServerExportSourcePath() {
    return new URL(location.href).pathname;
  }

  async function startServerExportDownload(downloadUrl, exportType){
    if(!downloadUrl) return false;
    try {
      const url = new URL(downloadUrl, location.href);
      if(url.origin !== location.origin) return false;
      const file = url.searchParams.get('file') || '';
      const expected = exportType === 'PDF'
        ? {path:'/api/export-pdf-download', ext:'.pdf'}
        : exportType === 'PPTX'
          ? {path:'/api/export-editable-pptx-download', ext:'.pptx'}
          : null;
      if(!expected) return false;
      if(url.pathname !== expected.path) return false;
      if(!file.toLowerCase().endsWith(expected.ext)) return false;
      // fetch → blob → downloadBlob:导航式下载(location.assign 依赖响应头
      // attachment)会被 Workbuddy 等内嵌浏览器的下载策略整体禁止(issue #23,
      // 表现为"已被禁止/0B"),而同环境 blob 下载可用——统一走 blob 通道,
      // 普通浏览器行为等价且文件名更可控。
      const response = await fetch(url.href, { credentials: 'same-origin' });
      if(!response.ok) return false;
      const blob = await response.blob();
      if(!blob.size) return false;
      const fallbackName = `${getDeckFileName()}${expected.ext}`;
      let downloadName = fallbackName;
      try {
        const decoded = decodeURIComponent(file);
        downloadName = decoded.split('/').pop() || fallbackName;
      } catch { /* keep fallback */ }
      await downloadBlob(blob, downloadName);
      return true;
    } catch {
      return false;
    }
  }

  function collectEditablePptxCanvasSnapshots(){
    const slides = window.__getVisibleSlides?.() || [...document.querySelectorAll('#deck > .slide:not([hidden])')];
    const out = [];
    slides.forEach((slide, slideIndex) => {
      const slideRect = slide.getBoundingClientRect();
      if(!slideRect.width || !slideRect.height) return;
      slide.querySelectorAll('canvas').forEach((canvas, canvasIndex) => {
        if(canvas.closest('.bt-unicorn-frame')) return;
        const style = getComputedStyle(canvas);
        const rect = canvas.getBoundingClientRect();
        if(style.display === 'none' || style.visibility === 'hidden' || Number(style.opacity || 1) <= 0.01) return;
        if(rect.width <= 1 || rect.height <= 1) return;
        try {
          const data = canvas.toDataURL('image/png');
          const sourceSlideId=slide.dataset.vmSourceSlideId || slide.dataset.vmSlideId || slide.id || '';
          const variantStateId=window.__getSlideStateId?.(slide) || slide.dataset.vmVariantStateId || slide.dataset.vmSlideId || '';
          out.push({
            slideIndex,
            sourceSlideId,
            variantStateId,
            slideStateId:variantStateId,
            canvasIndex,
            data,
            left: (rect.left - slideRect.left) / slideRect.width * 100,
            top: (rect.top - slideRect.top) / slideRect.height * 100,
            width: rect.width / slideRect.width * 100,
            height: rect.height / slideRect.height * 100,
          });
        } catch {}
      });
    });
    return out;
  }

  window.__exportDeckHtml = async function(){
    if(window.__deckExportLocked) return;
    window.__deckExportLocked = true;
    let exportUi = null;
    const viewState = captureExportViewState();
    try {
      exportUi = beginDeckExport('HTML');
      updateDeckExport(exportUi, 0, 1, window.__deckI18n.ui('准备页面状态...'));
      window.__syncDeckPageNumbers?.();
      window.__flushEditableTextState?.();
      window.__syncDeckViewModelFromDom?.();
      throwIfDeckExportCancelled(exportUi);
      const slides = await materializeExportSlides(exportUi, 'HTML');
      window.__flushEditableTextState?.();
      window.__syncDeckViewModelFromDom?.();
      throwIfDeckExportCancelled(exportUi);
      const clone = document.documentElement.cloneNode(true);
      await prepareSimpleHtmlExportClone(clone, slides);
      const html = await serializeHtmlExportClone(clone, exportUi);
      throwIfDeckExportCancelled(exportUi);
      const blob = new Blob(['<!DOCTYPE html>\n' + html], {type: 'text/html;charset=utf-8'});
      updateDeckExport(exportUi, 1, 1, window.__deckI18n.ui('HTML 已准备下载'));
      await downloadBlob(blob, 'index.html');
    } catch (error) {
      if(isDeckExportCancelledError(error)) return;
      console.error('[export html]', error);
      alert(window.__deckI18n.ui('HTML 导出失败，请在浏览器控制台查看错误。'));
    } finally {
      restoreExportViewState(viewState);
      endDeckExport(exportUi);
      window.__syncActiveEffects?.();
    }
  };

  async function materializeExportSlides(exportUi, label){
    const slides = window.__getVisibleSlides?.() || [...document.querySelectorAll('#deck > .slide:not([hidden])')];
    for(let index = 0; index < slides.length; index++){
      throwIfDeckExportCancelled(exportUi);
      const slide = slides[index];
      updateDeckExport(exportUi, index, slides.length, window.__deckI18n.ui('{label} 准备第 {current} / {total} 页', {label: label, current: index + 1, total: slides.length}));
      window.__ensureRuntimeSlideRendered?.(slide);
      if(index % 2 === 1) await nextFrame();
    }
    updateDeckExport(exportUi, slides.length, slides.length, window.__deckI18n.ui('{label} 页面已准备完成', {label: label}));
    await nextFrame();
    return slides;
  }

  function prepareSlidesForPrint(slides){
    const states = slides.map(slide => ({
      slide,
      active: slide.classList.contains('active'),
      deckActive: slide.hasAttribute('data-deck-active'),
    }));
    slides.forEach(slide => {
      slide.classList.add('active');
      slide.setAttribute('data-deck-active', '');
    });
    return () => states.forEach(({slide, active, deckActive}) => {
      slide.classList.toggle('active', active);
      if(deckActive) slide.setAttribute('data-deck-active', '');
      else slide.removeAttribute('data-deck-active');
