// 翻控件 label/desc/选项/页面名;UI_STRINGS_EN 翻 template 自身的界面文案。
// 查不到的词条一律回退中文,保证词典缺失只是显示降级,不产生任何功能差异。
(function(){
  // 界面语言解析优先级:用户手动选择(localStorage)> 系统语言(zh* → 中文,
  // 其它 → 英文)> goal.language(渲染时指定,系统语言不可得时的回退)> 中文。
  const LANG_KEY = 'dashi-deck-lang';
  let language = 'zh';
  let deckLanguage = 'zh';
  let metaDict = {};
  try {
    const opts = JSON.parse(document.getElementById('preview-options')?.textContent || '{}');
    if(opts.language === 'en') deckLanguage = 'en';
    if(opts.i18n && typeof opts.i18n === 'object') metaDict = opts.i18n;
  } catch (err) { /* keep zh */ }
  let savedLanguage = null;
  try { savedLanguage = localStorage.getItem(LANG_KEY); } catch (err) { /* private mode 等 */ }
  if(savedLanguage === 'zh' || savedLanguage === 'en'){
    language = savedLanguage;
  } else {
    const systemLanguage = String(navigator.language || '').toLowerCase();
    if(systemLanguage.startsWith('zh')) language = 'zh';
    else if(systemLanguage) language = 'en';

  // 导出进度 detail 来自导出引擎(vendor bundle / 服务端接口)的中文文案,
  // 按已知模式在显示层转英文;未匹配模式原样透出(中文兜底)。
  const EXPORT_DETAIL_EN = [
    [/^应用页面编辑状态$/, 'Applying page edits'],
    [/^生成 PPTX 文件$/, 'Generating PPTX file'],
    [/^保存 PPTX 文件$/, 'Saving PPTX file'],
    [/^采集页面结构 (\d+)\/(\d+)$/, 'Collecting page structure $1/$2'],
    [/^采集页面结构$/, 'Collecting page structure'],
    [/^生成 PPTX 对象 (\d+)\/(\d+)$/, 'Building PPTX objects $1/$2'],
    [/^服务端接收 PDF 导出请求$/, 'Server received PDF export request'],
    [/^服务端接收导出请求$/, 'Server received export request'],
    [/^启动截图浏览器$/, 'Launching screenshot browser'],
    [/^准备下载文件$/, 'Preparing file download'],
    [/^准备浏览器下载$/, 'Preparing browser download'],
    [/^打开预览页面$/, 'Opening preview page'],
    [/^准备导出页面状态$/, 'Preparing page state for export'],
    [/^等待服务端进度$/, 'Waiting for server progress'],
    [/^截图批次 (\d+)\/(\d+)$/, 'Screenshot batch $1/$2'],
    [/^截取第 (\d+)\/(\d+) 页$/, 'Capturing slide $1/$2'],
    [/^正在生成可编辑 PPTX$/, 'Generating editable PPTX'],
  ];
  function exportDetail(detail){
    const text = typeof detail === 'string' ? detail.trim() : '';
    if(!isEn || !text) return detail;
    for(const [pattern, replacement] of EXPORT_DETAIL_EN){
      if(pattern.test(text)) return text.replace(pattern, replacement);
    }
    return detail;
  }

  const isEn = language === 'en';
  function meta(value){
    if(!isEn || typeof value !== 'string' || !value) return value;
    return metaDict[value] || metaDict[value.trim()] || value;
  }
  function ui(text, params){
    let out = text;
    if(isEn && typeof text === 'string' && UI_STRINGS_EN[text]) out = UI_STRINGS_EN[text];
    if(params && typeof out === 'string'){
      out = out.replace(/\{(\w+)\}/g, (match, key) => (key in params ? String(params[key]) : match));
    }
    return out;
  }

  // 静态 DOM 文案批量翻译:文本节点 + title/aria-label/placeholder/alt。
  // 只在 en 下启动时跑一次,词典覆盖即生效,静态 HTML 无需逐处改动。
  const STATIC_ATTRS = ['title', 'aria-label', 'placeholder', 'alt', 'data-color-label'];
  function translateStaticDom(root){
    if(!isEn || !root) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const textNodes = [];
    while(walker.nextNode()) textNodes.push(walker.currentNode);
    textNodes.forEach(node => {
      const raw = node.nodeValue;
      const trimmed = raw?.trim();
      if(!trimmed || !UI_STRINGS_EN[trimmed]) return;
      node.nodeValue = raw.replace(trimmed, UI_STRINGS_EN[trimmed]);
    });
    const all = [root, ...root.querySelectorAll('*')];
    all.forEach(el => {
      if(!el.getAttribute) return;
      STATIC_ATTRS.forEach(attr => {
        const value = el.getAttribute(attr);
        if(value && UI_STRINGS_EN[value.trim()]) el.setAttribute(attr, UI_STRINGS_EN[value.trim()]);
      });
    });
  }

  window.__deckI18n = { language, isEn, meta, ui, exportDetail, setLanguage, translateStaticDom, uiStrings: UI_STRINGS_EN };

  if(isEn){
    const run = () => translateStaticDom(document.body);
    document.readyState === 'loading'
      ? document.addEventListener('DOMContentLoaded', run, { once: true })
      : run();
  }
  // html lang 跟随运行时语言(SSR 写入的初始值可能与运行时决定不一致)。
  document.documentElement.setAttribute('lang', isEn ? 'en' : 'zh-CN');
})();
</script>

<script>
(function(){
	  window.__pageTransitionModes = [
	    'none', 'liquidMorph', 'containerClip', 'containerSlide',
	    'pixelReveal', 'pixelZoom', 'pixelBarsY',
	    'sliceReveal', 'sliceHorizontal', 'sliceGallery',
	  ];
  const transitionColorDefaults = {
    pixelReveal:'#000000',
    pixelZoom:'#000000',
    pixelBarsY:'#000000',
    sliceReveal:'#000000',
    sliceHorizontal:'#ffffff',
    sliceGallery:'#ffffff',
  };
  window.__pageTransitionMode = 'none';
  window.__pageTransitionColorDefaults = transitionColorDefaults;
  window.__pageTransitionColors = {};
  window.__setPageTransition = value => {
    window.__pageTransitionMode = window.__pageTransitionModes.includes(value) ? value : 'none';
  };
  window.__getPageTransition = () => window.__pageTransitionMode || 'none';
  window.__isPageTransitionColorMode = mode => Boolean(transitionColorDefaults[mode]);
  window.__setPageTransitionColor = (mode, value) => {
    if(!transitionColorDefaults[mode]) return;
    window.__pageTransitionColors[mode] = normalizeTransitionColor(value) || transitionColorDefaults[mode];
  };
  window.__getPageTransitionColor = mode => window.__pageTransitionColors[mode] || transitionColorDefaults[mode] || '#000000';
  function normalizeTransitionColor(value){
    return /^#[0-9a-f]{6}$/i.test(value || '') ? value.toLowerCase() : '';
  }
  function updateHint(){
    const hint = document.getElementById('hint');
    if(hint) hint.textContent = '';
  }
  addEventListener('DOMContentLoaded', updateHint, {once:true});
})();

<script>
/* =============== Deck ViewModel Runtime =============== */
(function(){
  const vmEl = document.getElementById('deck-view-model');
  const textEl = document.getElementById('embedded-text-state');
  if(!vmEl) return;

  const STORE = 'dashi-ppt-view-model';
  const SERVER_SAVE_URL = '/api/save-deck-state';
  const SERVER_SAVE_DEBOUNCE_MS = 2000;
  const RESTORED_EMPHASIS_INDEX_KEYS = new Set(['activeIndex', 'currentIndex', 'emphasisIndex', 'featureIndex', 'focusCol', 'focusIndex', 'highlightCol', 'highlightIndex', 'highlightRowIndex']);
  const LEGACY_SCHEMA_V2_LOGICAL_SLIDE_FIELDS = Object.freeze([
    'id',
    'key',
    'label',
    'logicalIndex',
    'content',
    'stateId',
    'selectedVariant',
    'variants',
  ]);
  const OMIT_AUTHORED_PROP = Symbol('omit-authored-prop');
  const PRIVATE_NESTED_PROP_KEYS = new Set([
    'tone', 'color', 'colors', 'palette', 'dark', 'light',
    'pos', 'position', 'x', 'y', 'top', 'right', 'bottom', 'left',
    'rotate', 'rotation', 'angle', 'z', 'zIndex',
  ]);
  const vm = readJson(vmEl, {});
  const schemaV2LogicalSlideFields = resolveSchemaV2LogicalSlideFields(vm);
  vm.variantOutputMode = vm.variantOutputMode === 'selected-only' || vm.variantOutputMode === 'comparison'
    ? vm.variantOutputMode
    : (Number(vm.schemaVersion) === 2 ? 'comparison' : 'selected-only');
  if(Number(vm.schemaVersion) === 2){
    vm.slides = (vm.slides || []).map(slide => canonicalizeSchemaV2LogicalSlide(slide));
  }
  vm.state = vm.state || {};
  const embeddedText = readJson(textEl, {});
  const renderedSlideOrder = [...document.querySelectorAll('#deck > .slide')]
    .map(slide => slide.dataset.vmSlideId || slide.id)
    .filter(Boolean);
  const baseDuplicatedSlides = Array.isArray(vm.state.duplicatedSlides)
    ? deepCloneJson(vm.state.duplicatedSlides, [])
    : [];
  const baseState = {
    slideOrder: normalizeLogicalSlideOrder(
      vm.state.slideOrder
        || (renderedSlideOrder.length ? renderedSlideOrder : (vm.slides || []).map(slide => slide.id)),
      renderedSlideOrder,
      baseDuplicatedSlides,
    ),
    skippedSlides: uniqueIds(vm.state.skippedSlides || []),
    deletedSlides: uniqueIds(vm.state.deletedSlides || []),
    duplicatedSlides: baseDuplicatedSlides,
    variantSelection: {...(vm.state.variantSelection || {})},
    text: {...(vm.state.text || {}), ...embeddedText},
    media: deepCloneJson(vm.state.media, {}),
    props: {...(vm.state.props || {})},
  };
  // boot 恢复只有两层:HTML 内嵌基线(baseState)+ localStorage(仅签名匹配时生效)。
  // 不再有第三层 URL 编辑状态——分享链接式的编辑持久化已被自动保存(烧回 index.html 本体)取代。
  const deckSignature = createDeckSignature(vm, baseState.text);
  const saved = readSaved(deckSignature);
  if(saved.__draftInIdb) setTimeout(() => restoreDraftFromIdb(), 0);
  vm.state.duplicatedSlides = Array.isArray(saved.duplicatedSlides)
    ? deepCloneJson(saved.duplicatedSlides, [])
    : deepCloneJson(baseState.duplicatedSlides, []);
  vm.state.slideOrder = normalizeLogicalSlideOrder(
    saved.slideOrder || baseState.slideOrder,
    renderedSlideOrder,
    vm.state.duplicatedSlides,
  );
  vm.state.skippedSlides = saved.skippedSlides || baseState.skippedSlides;
  vm.state.deletedSlides = saved.deletedSlides || baseState.deletedSlides;
  vm.state.variantSelection = normalizeVariantSelections({
    ...baseState.variantSelection,
    ...(saved.variantSelection || {}),
  });
  vm.state.text = {...baseState.text, ...(saved.text || {})};
  vm.state.media = deepMergeJsonObjects(baseState.media, saved.media);
  vm.state.props = normalizeRestoredProps(mergePropsStates(baseState.props, saved.props));
  vm.state.__deckSignature = deckSignature;
  syncInitialSlideVariantOwnership();

  writeJson(textEl, vm.state.text);
  writeVm();

  window.__deckViewModel = {
    model: vm,
    getState,
    // 只读浅引用:getState 是全量深拷贝(含媒体 base64,可达数 MB),高频只读用 peek。
    peek(key){ return key == null ? vm.state : vm.state?.[key]; },
    setTextState,
    setMediaState,
    setSlideOrder,
    setSkippedSlides,
    setDeletedSlides,
    setVariantSelection,
    setVariantSelections,
    setProps,
    addDuplicatedSlide,
    restoreDuplicatedSlide,
    syncFromDom,
    write: writeVm,
    persist,
  };
  window.__getDeckViewModelState = getState;
  window.__syncDeckViewModelFromDom = syncFromDom;

  function getState(){
    return JSON.parse(JSON.stringify({
      ...(vm.state || {}),
      props: vm.state?.props || {},
    }));
  }


  function setTextState(text){
    vm.state.text = {...(text || {})};
    writeJson(textEl, vm.state.text);
    writeVm();
    persist();
  }

  function setMediaState(media){
    vm.state.media = deepCloneJson(media, {});
    writeVm();
    persist();
  }

  function setSlideOrder(order){
    vm.state.slideOrder = [...(order || [])];
    writeVm();
    persist();
  }

  function setSkippedSlides(ids){
    vm.state.skippedSlides = uniqueIds(ids);
    writeVm();
    persist();
  }

  function setDeletedSlides(ids){
    vm.state.deletedSlides = uniqueIds(ids);
    writeVm();
    persist();
  }

  function setVariantSelection(slideId, stateId){
    const next = normalizeVariantSelections({
      ...(vm.state.variantSelection || {}),
      [slideId]: stateId,
    });
    if(!next[slideId]) return false;
    vm.state.variantSelection = next;
    writeVm();
    persist();
    return true;
  }

  function setVariantSelections(source){
    vm.state.variantSelection = normalizeVariantSelections({
      ...(vm.state.variantSelection || {}),
      ...(source || {}),
    });
    writeVm();
    persist();
    return {...vm.state.variantSelection};
  }

  function setProps(slideId, props){
    if(!slideId) return;
    const authored = compactStatePropsFromRender(slideId, props || {});
    if(Object.keys(authored).length) vm.state.props[slideId] = authored;
    else delete vm.state.props[slideId];
    writeVm();
    persist();
  }

  function addDuplicatedSlide(record, sourceModel){
    const sourceId = record?.sourceId;
    const logicalSource = sourceModel
      || (vm.slides || []).find(slide => slide.id === sourceId)
      || null;
    const copyId = restoreDuplicatedSlide(record, logicalSource);
    if(!copyId || !sourceId) return '';
    const logicalCopy = (vm.slides || []).find(slide => slide.id === copyId) || null;
    copyDuplicatedSlideState(record, logicalSource, logicalCopy);
    const order = [...(vm.state.slideOrder || [])].filter(id => id !== copyId);
    const sourceOrderIndex = order.indexOf(sourceId);
    order.splice(sourceOrderIndex >= 0 ? sourceOrderIndex + 1 : order.length, 0, copyId);
    vm.state.slideOrder = order;
    writeVm();
    persist();
    return copyId;
  }

  function restoreDuplicatedSlide(record, sourceModel){
    const copyId = String(record?.copyId || '');
    const sourceId = String(record?.sourceId || '');
    if(!copyId || !sourceId) return '';
    const sourceIndex = (vm.slides || []).findIndex(slide => slide.id === sourceId);
    const logicalSource = sourceModel || (sourceIndex >= 0 ? vm.slides[sourceIndex] : null) || {};
    const storedRecord = deepCloneJson(record, {});
    let modelSlide;
    const restoreLogicalCopy = Array.isArray(logicalSource.variants)
      && logicalSource.variants.length
      && (Number(vm.schemaVersion) === 2 || storedRecord.logicalCopy === true);
    if(restoreLogicalCopy){
      modelSlide = buildDuplicatedLogicalSlide(storedRecord, logicalSource);
      if(!modelSlide) return '';
      storedRecord.logicalCopy = true;
      storedRecord.variantStateIds = Object.fromEntries(
        modelSlide.variants.map(variant => [variant.id, variant.stateId]),
      );
      storedRecord.variantKeys = Object.fromEntries(
        modelSlide.variants.map(variant => [variant.id, variant.key]),
      );
      storedRecord.selectedVariantStateId = vm.state.variantSelection?.[copyId]
        || modelSlide.stateId;
      vm.state.variantSelection = {
        ...(vm.state.variantSelection || {}),
        [copyId]:storedRecord.selectedVariantStateId,
      };
    }else{
      modelSlide = buildDuplicatedSingleLayoutSlide(storedRecord, logicalSource);
    }
    vm.state.duplicatedSlides = (vm.state.duplicatedSlides || []).filter(item => item.copyId !== copyId);
    vm.state.duplicatedSlides.push(storedRecord);
    if(!Array.isArray(vm.slides)) vm.slides = [];
    const existingIndex = vm.slides.findIndex(slide => slide.id === copyId);
    if(existingIndex >= 0) vm.slides.splice(existingIndex, 1);
    const refreshedSourceIndex = vm.slides.findIndex(slide => slide.id === sourceId);
    const insertAt = refreshedSourceIndex >= 0 ? refreshedSourceIndex + 1 : vm.slides.length;
    vm.slides.splice(insertAt, 0, modelSlide);
    rebuildComparisonPageDescriptors();
    writeVm();
    return copyId;
  }

  function resolveSchemaV2LogicalSlideFields(model){
    if(Number(model?.schemaVersion) !== 2) return [];
    const configured = model?.runtimeSchema?.schemaV2LogicalSlideFields;
    if(Array.isArray(configured) && configured.length){
      return [...new Set(configured.filter(field => typeof field === 'string' && field))];
    }
    return [...LEGACY_SCHEMA_V2_LOGICAL_SLIDE_FIELDS];
  }

  function canonicalizeSchemaV2LogicalSlide(source, overrides={}){
    const logical = {...(source || {}), ...(overrides || {})};
    if(Number(vm.schemaVersion) !== 2 || !Array.isArray(logical.variants)) return logical;
    const canonical = {};
    schemaV2LogicalSlideFields.forEach(field => {
      if(hasOwn(logical, field) && logical[field] !== undefined){
        canonical[field] = deepCloneJson(logical[field], logical[field]);
      }
    });
    return canonical;
  }
  window.__canonicalizeSchemaV2LogicalSlide = canonicalizeSchemaV2LogicalSlide;

  function mapDuplicatedSyncTextName(name, sourceVariant, copyVariant, logicalSourceId, logicalCopyId, useFallback=true){
    const syncName = String(name || '');
    if(!syncName) return '';
    const copyNamespaces = [copyVariant?.stateId, copyVariant?.key, logicalCopyId]
      .map(value => String(value || ''))
      .filter(Boolean);
    if(copyNamespaces.some(prefix => syncName === prefix || syncName.startsWith(`${prefix}:`))){
      return syncName;
    }
    const mappings = [
      [sourceVariant?.stateId, copyVariant?.stateId],
      [sourceVariant?.key, copyVariant?.key],
      [logicalSourceId, logicalCopyId],
    ].map(([from, to]) => [String(from || ''), String(to || '')])
      .filter(([from, to]) => from && to && from !== to)
      .sort(([a], [b]) => b.length - a.length);
    const mapping = mappings.find(([from]) => (
      syncName === from || syncName.startsWith(`${from}:`)
    ));
    if(mapping) return `${mapping[1]}${syncName.slice(mapping[0].length)}`;
    if(!useFallback) return '';
    const prefix = String(copyVariant?.stateId || copyVariant?.key || logicalCopyId || '');
    return prefix ? `${prefix}:${syncName}` : syncName;
  }
  window.__mapDuplicatedSyncTextName = mapDuplicatedSyncTextName;

  function buildDuplicatedLogicalSlide(record, logicalSource){
    const copyId = String(record?.copyId || '');
    if(!copyId) return null;
    const sourceVariants = Array.isArray(logicalSource?.variants) ? logicalSource.variants : [];
    if(!sourceVariants.length) return null;
    const variants = sourceVariants.map((sourceVariant, index) => {
      const variantId = String(sourceVariant?.id || sourceVariant?.variantId || `variant-${index + 1}`);
      return {
        ...deepCloneJson(sourceVariant, {}),
        id:variantId,
        stateId:String(record?.variantStateIds?.[variantId] || `${copyId}::${variantId}`),
        key:String(record?.variantKeys?.[variantId] || `${copyId}__${encodeURIComponent(variantId)}`),
      };
    });
    const requestedCopyStateId = vm.state.variantSelection?.[copyId]
      || record?.selectedVariantStateId;
    const sourceSelectedToken = record?.sourceVariantStateId
      || vm.state.variantSelection?.[logicalSource.id]
      || logicalSource.stateId
      || logicalSource.selectedVariant;
    const sourceSelected = sourceVariants.find(variant => (
      variant?.stateId === sourceSelectedToken || variant?.id === sourceSelectedToken
    )) || sourceVariants[0];
    const selected = variants.find(variant => (
      variant.stateId === requestedCopyStateId || variant.id === requestedCopyStateId
    )) || variants.find(variant => variant.id === sourceSelected?.id) || variants[0];
    return canonicalizeSchemaV2LogicalSlide(logicalSource, {
      id:copyId,
      key:String(record?.copyKey || copyId),
      stateId:selected.stateId,
      selectedVariant:selected.id,
      variants,
    });
  }

  function buildDuplicatedSingleLayoutSlide(record, logicalSource){
    const activeSource = Array.isArray(logicalSource?.variants)
      ? logicalSource.variants.find(variant => variant.stateId === record?.sourceVariantStateId)
        || logicalSource.variants.find(variant => variant.stateId === vm.state.variantSelection?.[logicalSource.id])
        || logicalSource.variants[0]
        || logicalSource
      : logicalSource || {};
    const {
      variants:_variants,
      selectedVariant:_selectedVariant,
      variantId:_variantId,
      stateId:_stateId,
      pageId:_pageId,
      ...source
    } = deepCloneJson(activeSource, {});
    const copyId = String(record?.copyId || '');
    const key = record?.copyKey || copyId;
    return {
      ...source,
      id:copyId,
      stateId:copyId,
      pageId:copyId,
      key,
      dataLayout:source.dataLayout || source.layout || '',
      props:{...(source.props || {}), ...deepCloneJson(record?.props, {})},
      ...(source.context && typeof source.context === 'object'
        ? {
            context:{
              ...source.context,
              id:copyId,
              stateId:copyId,
              key,
              physicalId:copyId,
              sourceSlideId:copyId,
              textKeyPrefix:`text:${key}:`,
            },
          }
        : {}),
    };
  }

  function copyDuplicatedSlideState(record, logicalSource, logicalCopy){
    if(!logicalSource || !logicalCopy) return;
    const logicalVariants = Array.isArray(logicalSource.variants) && Array.isArray(logicalCopy.variants);
    const pairs = logicalVariants
      ? logicalSource.variants.map((sourceVariant, index) => {
          const variantId = String(sourceVariant?.id || sourceVariant?.variantId || `variant-${index + 1}`);
          return {
            source:sourceVariant,
            copy:logicalCopy.variants.find(variant => variant.id === variantId)
              || logicalCopy.variants[index],
          };
        }).filter(pair => pair.copy)
      : [{source:logicalSource, copy:logicalCopy}];
    const props = {...(vm.state.props || {})};
    const media = deepCloneJson(vm.state.media, {});
    const text = {...(vm.state.text || {})};
    pairs.forEach(({source, copy}) => {
      copyStateEntry(props, source.stateId || logicalSource.id, copy.stateId || logicalCopy.id);
      copyStateEntry(media, source.stateId || logicalSource.id, copy.stateId || logicalCopy.id);
      copyStateEntry(media, source.key, copy.key);
      copyTextPrefix(text, source.key, copy.key);
    });
    copyStateEntry(media, logicalSource.id, logicalCopy.id);
    if(logicalVariants){
      copySyncTextNamespaces(
        text,
        pairs,
        logicalSource.id,
        logicalCopy.id,
        record?.variantSyncTextNames,
      );
    }else{
      (record?.syncTextNames || []).forEach(name => {
        const sourceKey = `sync:${name}`;
        const copyKey = `sync:${logicalCopy.id}:${name}`;
        if(hasOwn(text, sourceKey)) text[copyKey] = deepCloneJson(text[sourceKey], text[sourceKey]);
      });
    }
    vm.state.props = props;
    vm.state.media = media;
    vm.state.text = text;
    if(typeof window.__replaceEditableTextState === 'function'){
      window.__replaceEditableTextState(vm.state.text);
    }else{
      writeJson(textEl, vm.state.text);
    }
    const selected = logicalCopy.variants?.find(variant => (
      variant.stateId === vm.state.variantSelection?.[logicalCopy.id]
      || variant.stateId === record?.selectedVariantStateId
    )) || logicalCopy.variants?.[0];
    if(selected?.stateId){
      vm.state.variantSelection = {
        ...(vm.state.variantSelection || {}),
        [logicalCopy.id]:selected.stateId,
      };
      const stored = (vm.state.duplicatedSlides || []).find(item => item.copyId === logicalCopy.id);
      if(stored) stored.selectedVariantStateId = selected.stateId;
    }
  }

  function copySyncTextNamespaces(text, pairs, logicalSourceId, logicalCopyId, variantSyncTextNames={}){
    pairs.forEach(({source, copy}, index) => {
      const variantId = String(source?.id || source?.variantId || `variant-${index + 1}`);
      const names = Array.isArray(variantSyncTextNames?.[variantId])
        ? variantSyncTextNames[variantId]
        : [];
      names.forEach(name => {
        const sourceName = resolveDuplicatedSyncTextSourceName(
          text,
          name,
          source,
          logicalSourceId,
        );
        if(!sourceName) return;
        const nextName = mapDuplicatedSyncTextName(
          name,
          source,
          copy,
          logicalSourceId,
          logicalCopyId,
          true,
        );
        if(!nextName) return;
        const sourceKey = `sync:${sourceName}`;
        text[`sync:${nextName}`] = deepCloneJson(text[sourceKey], text[sourceKey]);
      });
    });
  }

  function resolveDuplicatedSyncTextSourceName(text, name, sourceVariant, logicalSourceId){
    const syncName = String(name || '');
    if(!syncName) return '';
    const namespaces = [sourceVariant?.stateId, sourceVariant?.key, logicalSourceId]
      .map(value => String(value || ''))
      .filter(Boolean);
    const alreadyNamespaced = namespaces.some(prefix => (
      syncName === prefix || syncName.startsWith(`${prefix}:`)
    ));
    const candidates = alreadyNamespaced
      ? [syncName]
      : [...namespaces.map(prefix => `${prefix}:${syncName}`), syncName];
    return candidates.find(candidate => hasOwn(text, `sync:${candidate}`)) || '';
  }

  function copyStateEntry(state, sourceKey, copyKey){
    if(!state || !sourceKey || !copyKey || !hasOwn(state, sourceKey)) return;
    state[copyKey] = deepCloneJson(state[sourceKey], state[sourceKey]);
  }

  function copyTextPrefix(text, sourceSlideKey, copySlideKey){
    if(!sourceSlideKey || !copySlideKey) return;
    const sourcePrefix = `text:${sourceSlideKey}:`;
    const copyPrefix = `text:${copySlideKey}:`;
    Object.entries({...text}).forEach(([key, value]) => {
      if(!key.startsWith(sourcePrefix)) return;
      text[`${copyPrefix}${key.slice(sourcePrefix.length)}`] = deepCloneJson(value, value);
    });
  }

  function rebuildComparisonPageDescriptors(){
    if(Number(vm.schemaVersion) !== 2) return;
    let comparisonIndex = 0;
    vm.comparisonPages = (vm.slides || []).flatMap(slide => (
      (slide.variants || []).map((variant, variantIndex) => ({
        id:variant.stateId,
        sourceSlideId:slide.id,
        stateId:variant.stateId,
        variantId:variant.id,
        variantKind:variant.kind || variant.variantKind || 'template',
        variantIndex,
        variantCount:slide.variants.length,
        comparisonIndex:comparisonIndex++,
        selected:(vm.state.variantSelection?.[slide.id] || slide.stateId) === variant.stateId,
        key:variant.key,
        themePack:variant.themePack,
        ...((variant.kind || variant.variantKind) === 'bespoke'
          ? {adjustable:false}
          : {layout:variant.layout}),
      }))
    ));
  }

  function syncFromDom(){
    const slides = window.__getVisibleSlides?.() || [...document.querySelectorAll('#deck > .slide:not([hidden])')];
    setSlideOrder(slides.map((slide, index) => slide.dataset.vmSlideId || vm.slides?.[index]?.id || `slide-${index + 1}`));
    return getState();
  }

  function readSaved(signature){
    try {
      const saved = JSON.parse(localStorage.getItem(STORE) || '{}') || {};
      return saved.__deckSignature === signature ? saved : {};
    } catch {
      return {};
    }
  }

  // 大 state(用户传图后 props 里是 data: URL)会超出 localStorage 配额——溢出到
  // IndexedDB(容量以百 MB 计),localStorage 只留签名指针;readSaved 同步启动后由
  // restoreDraftFromIdb 异步补齐。预览服务在时 state 仍会烧回 index.html 本体,
  // 本地草稿只是无服务(静态服务器/file://)场景的兜底。
  const DRAFT_DB = 'dashi-deck-drafts';
  function idbDraft(mode, value){
    return new Promise(resolve => {
      try {
        const open = indexedDB.open(DRAFT_DB, 1);
        open.onupgradeneeded = () => open.result.createObjectStore('state');
        open.onerror = () => resolve(null);
        open.onsuccess = () => {
          const db = open.result;
          const tx = db.transaction('state', mode === 'get' ? 'readonly' : 'readwrite');
          const store = tx.objectStore('state');
          const req = mode === 'get' ? store.get(deckSignature) : store.put(value, deckSignature);
          req.onsuccess = () => { resolve(mode === 'get' ? req.result : true); db.close(); };
          req.onerror = () => { resolve(null); db.close(); };
        };
      } catch { resolve(null); }
    });
  }
  function persist(){
    vm.state.__deckSignature = deckSignature;
    try {
      localStorage.setItem(STORE, JSON.stringify(vm.state || {}));
    } catch (error) {
      // 配额超限:整份 state 进 IndexedDB,localStorage 留指针供 readSaved 感知。
      idbDraft('put', vm.state || {});
      try {
        localStorage.setItem(STORE, JSON.stringify({ __deckSignature: deckSignature, __draftInIdb: true }));
      } catch {}
    }
    scheduleServerSave();
  }
  async function restoreDraftFromIdb(){
    const draft = await idbDraft('get');
    if(!draft || draft.__deckSignature !== deckSignature) return;
    // 应用路径复用导出快照的共享实现(setText/setProps/文本 innerHTML/重渲染),
    // 该路径已被服务端与浏览器端导出双重验证。
    try {
      const script = document.createElement('script');
      await new Promise((resolve, reject) => {
        if(window.__editablePptxBrowser?.applyEditablePptxSnapshot) return resolve();
        script.src = 'assets/vendor/editable-pptx-browser.js';
        script.onload = resolve;
        script.onerror = () => reject(new Error('draft restore bundle failed'));
        document.head.appendChild(script);
      });
      const currentIndex = Math.max(0, (window.__getVisibleSlides?.() || []).findIndex(s => s.classList.contains('active')));
      await window.__editablePptxBrowser.applyEditablePptxSnapshot({ state: draft, currentIndex });
      writeJson(textEl, vm.state.text);
      writeVm();
    } catch (error) {
      console.warn('[deck draft] IndexedDB 草稿恢复失败', error);
    }
  }

  function writeVm(){
    writeJson(vmEl, vm);
  }

  // 预览服务下的自动保存:防抖 POST 把 state 烧回 index.html 本体(见 scripts/serve-preview-https.mjs
  // 的 /api/save-deck-state)。file:// 或没起预览服务时这次 fetch 天然失败——那就只退回 localStorage/
  // URL 状态兜底,并在“确有未落盘改动”时亮起低调的常驻提醒条(deckSaveDirty && serviceAvailable===false)。
  // serviceAvailable 初始为 null(未知):第一次保存结果出来之前不显示提醒,避免每次编辑都闪一下。
  let serverSaveTimer = null;
  let serverSaveInFlight = false;
  let serverSaveQueued = false;
  let deckSaveDirty = false;

  function deckAutosaveDisabled(){
    try {
      const options = JSON.parse(document.getElementById('preview-options')?.textContent || '{}');
      return options.autosave === false;
    } catch { return false; }
  }
  let serverSaveAvailable = null;

  function scheduleServerSave(){
    if(deckAutosaveDisabled()) return;
    deckSaveDirty = true;
    updateSaveStatusBanner();
    if(serverSaveTimer !== null) clearTimeout(serverSaveTimer);
    serverSaveTimer = setTimeout(runServerSave, SERVER_SAVE_DEBOUNCE_MS);
  }

  async function runServerSave(){
    serverSaveTimer = null;
    if(serverSaveInFlight){ serverSaveQueued = true; return; }
    serverSaveInFlight = true;
    let succeeded = false;
    try {
      const response = await fetch(SERVER_SAVE_URL, {
        method:'POST',
        headers:{'content-type':'application/json'},
        body:JSON.stringify({state:getState()}),
      });
      if(!response.ok) throw new Error(`save-deck-state responded ${response.status}`);
      const result = await response.json();
      serverSaveAvailable = true;
      if(result && result.mediaMap) applyMediaMapReconciliation(result.mediaMap);
      succeeded = true;
    } catch (error) {
      serverSaveAvailable = false;
    } finally {
      serverSaveInFlight = false;
      if(succeeded) deckSaveDirty = false;
      updateSaveStatusBanner();
      if(serverSaveQueued){
        serverSaveQueued = false;
        scheduleServerSave();
      }
    }
  }

  // 服务端把 data: 媒体落盘后,回传"原始 data: URL → 相对路径"的映射(mediaMap),而不是整份
  // state:这次 fetch 从发出到响应之间用户可能已经继续编辑(打了更多字、换了别的图),直接拿
  // 服务端回显的旧 state 整体覆盖当下 vm.state 会把这段等待期里的新编辑悄悄冲掉。所以这里只做
  // "精确字符串替换"——把当下(最新)vm.state.props/media 里仍然等于某个原始 data: URL 的位置换成
  // 对应相对路径,其余字段一律不碰;如果那个位置在等待期间已经被换成别的内容,替换会自然落空,
  // 留到下一次保存周期用新内容的 data: URL 再处理一遍。
  // 不调用 persist()/scheduleServerSave():这只是把服务端已确认落盘的结果同步回来,不是新的编辑。
  function applyMediaMapReconciliation(mediaMap){
    const entries = Object.entries(mediaMap || {});
    if(!entries.length) return;
    vm.state.props = replaceKnownDataUrls(vm.state.props, entries);
    vm.state.media = replaceKnownDataUrls(vm.state.media, entries);
    writeVm();
    try {
      localStorage.setItem(STORE, JSON.stringify(vm.state || {}));
    } catch (error) {
      console.warn('[deck view model] reconciled state could not be persisted', error);
    }
  }

  function replaceKnownDataUrls(value, entries){
    if(Array.isArray(value)) return value.map(item => replaceKnownDataUrls(item, entries));
    if(value && typeof value === 'object'){
      const next = {};
      for(const [key, item] of Object.entries(value)) next[key] = replaceKnownDataUrls(item, entries);
      return next;
    }
    if(typeof value === 'string'){
      for(const [from, to] of entries){ if(value === from) return to; }
    }
    return value;
  }

  function updateSaveStatusBanner(){
    const el = document.getElementById('deck-save-status');
    if(!el) return;
    const show = deckSaveDirty && serverSaveAvailable === false;
    el.hidden = !show;
  }

  // 富文本可能被程序化写入 contenteditable(el.innerHTML = value),必须剥离脚本/事件处理器/
  // 危险元素才安全。用 <template> 解析(content 惰性,<img onerror>/<script> 不会执行),按白名单清洗。
  // 暴露为 window.__sanitizeRichText 供外部/测试直接调用。
  var SANITIZE_ALLOWED_TAGS = {B:1,STRONG:1,I:1,EM:1,BR:1,SUP:1,SUB:1};
  function sanitizeRichText(value){
    if (typeof value !== 'string' || value.indexOf('<') === -1) return value;
    var tpl = document.createElement('template');
    tpl.innerHTML = value;
    (function walk(node){
      var children = Array.prototype.slice.call(node.childNodes);
      for (var i=0;i<children.length;i++){
        var child = children[i];
        if (child.nodeType === 1){
          walk(child);
          if (SANITIZE_ALLOWED_TAGS[child.tagName]){
            while (child.attributes.length) child.removeAttribute(child.attributes[0].name);
          } else if (child.tagName === 'SCRIPT' || child.tagName === 'STYLE') {
            child.remove();
          } else {
            child.replaceWith.apply(child, Array.prototype.slice.call(child.childNodes));
          }
        } else if (child.nodeType !== 3) {
          child.remove();
        }
      }
    })(tpl.content);
    return tpl.innerHTML;
  }
  if (typeof window !== 'undefined') window.__sanitizeRichText = sanitizeRichText;

  function compactStatePropsFromRender(slideId, renderProps){
    const defaults = getComponentDefaultSlideProps(slideId);
    const source = getSlideSourceProps(slideId);
    // 默认值剔除时必须看到 HTML 内嵌保存层(baseState.props):用户把颜色改回组件
    // 默认值时,如果保存层里是旧颜色,当前默认值仍是一个必须保留的显式覆盖。但最后只能相对
    // goal source 做根层 diff;若再相对 baseState diff,刚烧回 HTML 的媒体等值会在重新打开时被清空。
    const fallback = {...source, ...(baseState.props?.[slideId] || {})};
    const authored = compactAuthoredPropValue(renderProps || {}, defaults, fallback, '');
    if(!authored || typeof authored !== 'object' || Array.isArray(authored)) return {};
    return diffAuthoredRootForState(authored, source);
  }

  function compactAuthoredPropValue(current, defaults, source, path){
    if(Array.isArray(current)){
      const items = current.map((item, index) => compactAuthoredPropValue(
        item,
        Array.isArray(defaults) ? defaults[index] : undefined,
        Array.isArray(source) ? source[index] : undefined,
        `${path}[]`,
      ));
      let end = items.length;
      while(end > 0 && isOmittedAuthoredProp(items[end - 1])) end -= 1;
      if(end === 0 && !Array.isArray(source)) return OMIT_AUTHORED_PROP;
      return items.slice(0, end).map(item => isOmittedAuthoredProp(item) ? {} : item);
    }
    if(current && typeof current === 'object'){
      const out = {};
      Object.entries(current).forEach(([key, value]) => {
        if(path && isPrivateNestedPropKey(key)) return;
        const child = compactAuthoredPropValue(
          value,
          defaults && typeof defaults === 'object' ? defaults[key] : undefined,
          source && typeof source === 'object' ? source[key] : undefined,
          path ? `${path}.${key}` : key,
        );
        if(!isOmittedAuthoredProp(child)) out[key] = child;
      });
      if(Object.keys(out).length) return out;
      return source && typeof source === 'object' ? out : OMIT_AUTHORED_PROP;
    }
    const hasSource = source !== undefined;
    if(hasSource || JSON.stringify(current) !== JSON.stringify(defaults)) return current;
    return OMIT_AUTHORED_PROP;
  }

  function diffAuthoredRootForState(authored, source){
    const out = {};
    Object.entries(authored || {}).forEach(([key, value]) => {
      if(JSON.stringify(value) !== JSON.stringify(source?.[key])) out[key] = value;
    });
    return out;
  }

  function isOmittedAuthoredProp(value){
    return value === OMIT_AUTHORED_PROP;
  }

  function isPrivateNestedPropKey(key){
    return PRIVATE_NESTED_PROP_KEYS.has(String(key || ''));
  }

  function getComponentDefaultSlideProps(slideId){
    const slideEl = [...document.querySelectorAll('#deck > .slide')].find(slide => (
      (slide.dataset.vmVariantStateId || slide.dataset.vmSlideId) === slideId
    ));
    return readDatasetJson(slideEl?.querySelector('[data-prop-controls]')?.dataset.propDefaults, {});
  }

  function getSlideSourceProps(slideId){
    const source = findSlideSourceModel(slideId);
    if(source?.kind !== 'template') return source?.props || {};
    const logical = (vm.slides || []).find(item => (
      item === source
      || (Array.isArray(item?.variants) && item.variants.includes(source))
    ));
    const slide = [...document.querySelectorAll('#deck > .slide')].find(item => (
      item.dataset.vmVariantStateId === slideId
      || item.dataset.vmSlideId === slideId
      || item.dataset.vmSourceSlideId === slideId
    ));
    return source.materializedProps
      || window.__resolveRuntimeTemplateVariantProps?.(slide, source, logical)
      || source.props
      || {};
  }

  function getDefaultSlideProps(slideId){
    const source = getSlideSourceProps(slideId);
    const defaults = getComponentDefaultSlideProps(slideId);
    return {...defaults, ...source, ...(baseState.props?.[slideId] || {})};
  }

  function mergePropsStates(...states){
    const out = {};
    states.forEach(state => {
      Object.entries(state || {}).forEach(([slideId, values]) => {
        out[slideId] = {...(out[slideId] || {}), ...(values || {})};
      });
    });
    return out;
  }

  function normalizeRestoredProps(props){
    const out = {};
    Object.entries(props || {}).forEach(([slideId, rawValues]) => {
      const normalized = normalizeRestoredSlideProps(slideId, rawValues);
      if(normalized && Object.keys(normalized).length) out[slideId] = normalized;
    });
    return out;
  }

  // 防御性钳制:localStorage 里保存的 range 类 prop 可能带着旧版本写入的越界值
  // (例如联动 count 收窄后残留的旧 index),启动时按当前控件边界夹回合法范围。
  function normalizeRestoredSlideProps(slideId, rawValues){
    if(!rawValues || typeof rawValues !== 'object' || Array.isArray(rawValues)) return {};
    const controls = getSlidePropControls(slideId);
    if(!controls.length) return {...rawValues};
    const defaults = getDefaultSlideProps(slideId);
    const values = {...defaults, ...rawValues};
    controls.forEach(control => {
      const type = normalizeRestoredControlType(control?.type);
      if(type !== 'range' || !hasOwn(rawValues, control.key)) return;
      const bounds = resolveRestoredRangeBounds(control, values);
      const current = Number(values[control.key]);
      if(!Number.isFinite(current)) return;
      values[control.key] = Math.min(bounds.max, Math.max(bounds.min, current));
    });
    return compactStatePropsFromRender(slideId, values);
  }

  function resolveRestoredRangeBounds(control, values){
    const min = Number(control.min ?? 0);
    let max = Number(control.max ?? 10);
    if(control.maxFromKey && RESTORED_EMPHASIS_INDEX_KEYS.has(control.key)){
      const linkedValue = Number(values?.[control.maxFromKey]);
      if(Number.isFinite(linkedValue)) {
        const explicitOffset = Number(control?.maxFromKeyOffset);
        const offset = Number.isFinite(explicitOffset) ? explicitOffset : (min === 0 ? -1 : 0);
        max = Math.min(max, Math.max(min, linkedValue + offset));
      }
    }
    if(max < min) max = min;
    return {min, max};
  }

  function normalizeRestoredControlType(type){
    if(['slider', 'range', 'number'].includes(type)) return 'range';
    return type || 'range';
  }

  function getSlidePropControls(slideId){
    const slideEl = [...document.querySelectorAll('#deck > .slide')].find(slide => (
      (slide.dataset.vmVariantStateId || slide.dataset.vmSlideId) === slideId
    ));
    return readDatasetJson(slideEl?.querySelector('[data-prop-controls]')?.dataset.propControls, []);
  }

  function findSlideSourceModel(slideId){
    for(const slide of vm.slides || []){
      if(slide.id === slideId) return slide;
      const variant = Array.isArray(slide.variants)
        ? slide.variants.find(item => item?.stateId === slideId)
        : null;
      if(variant) return variant;
    }
    return null;
  }

  function syncInitialSlideVariantOwnership(){
    const logicalSlides = Array.isArray(vm.slides) ? vm.slides : [];
    const logicalById = new Map(logicalSlides
      .filter(slide => slide?.id)
      .map(slide => [String(slide.id), slide]));
    const logicalByVariantStateId = new Map();
    logicalSlides.forEach(logical => {
      (Array.isArray(logical?.variants) ? logical.variants : []).forEach(variant => {
        if(variant?.stateId) logicalByVariantStateId.set(String(variant.stateId), logical);
      });
    });
    [...document.querySelectorAll('#deck > .slide')].forEach((slide, index) => {
      const slideId = String(slide.dataset.vmSlideId || slide.id || renderedSlideOrder[index] || '');
      const stateId = String(slide.dataset.vmVariantStateId || '');
      const sourceToken = String(slide.dataset.vmSourceSlideId || slideId);
      const logical = logicalById.get(sourceToken)
        || logicalByVariantStateId.get(stateId)
        || logicalByVariantStateId.get(slideId);
      const logicalId = String(logical?.id || sourceToken);
      if(!logicalId) return;
      const variants = Array.isArray(logical?.variants) ? logical.variants : [];
      const selectedToken = stateId
        || vm.state.variantSelection?.[logicalId]
        || logical?.stateId
        || logical?.selectedVariant;
      const variant = variants.find(item => item?.stateId === selectedToken)
        || variants.find(item => item?.id === selectedToken)
        || variants[0];
      if(!slide.dataset.vmSourceSlideId) slide.dataset.vmSourceSlideId = logicalId;
      if(!slide.dataset.vmVariantKind){
        slide.dataset.vmVariantKind = variant?.kind || variant?.variantKind
          || logical?.kind || logical?.variantKind || 'template';
      }
    });
  }

  function normalizeVariantSelections(source){
    const out = {};
    for(const slide of vm.slides || []){
      if(!Array.isArray(slide.variants) || !slide.variants.length) continue;
      const requested = source?.[slide.id];
      const selected = slide.variants.find(variant => variant?.stateId === requested)
        || slide.variants.find(variant => variant?.id === requested)
        || slide.variants.find(variant => variant?.stateId === slide.stateId)
        || slide.variants.find(variant => variant?.id === slide.selectedVariant)
        || slide.variants[0];
      if(selected?.stateId) out[slide.id] = selected.stateId;
    }
    for(const record of vm.state.duplicatedSlides || []){
      const copyId = String(record?.copyId || '');
      if(!copyId || out[copyId]) continue;
      const requested = String(source?.[copyId] || record?.selectedVariantStateId || '');
      const expectedStateIds = new Set(Object.values(record?.variantStateIds || {}).map(String));
      const sourceSlide = (vm.slides || []).find(slide => slide.id === record?.sourceId);
      (sourceSlide?.variants || []).forEach((variant, index) => {
        const variantId = String(variant?.id || variant?.variantId || `variant-${index + 1}`);
        expectedStateIds.add(`${copyId}::${variantId}`);
      });
      if(requested && expectedStateIds.has(requested)) out[copyId] = requested;
    }
    return out;
  }

  function hasOwn(object, key){
    return Object.prototype.hasOwnProperty.call(object || {}, key);
  }

  function deepCloneJson(value, fallback){
    if(value === undefined) return fallback;
    try {
      return JSON.parse(JSON.stringify(value));
    } catch {
      return fallback;
    }
  }

  function deepMergeJsonObjects(base, override){
    return {
      ...deepCloneJson(base, {}),
      ...deepCloneJson(override, {}),
    };
  }

  function readDatasetJson(value, fallback){
    try {
      return JSON.parse(value || '') || fallback;
    } catch {
      return fallback;
    }
  }

  function uniqueIds(ids){
    return [...new Set((ids || []).filter(Boolean).map(String))];
  }

  function normalizeLogicalSlideOrder(order, renderedIds, duplicatedSlides=vm.state.duplicatedSlides){
    const rendered = uniqueIds(renderedIds);
    const duplicateRecords = Array.isArray(duplicatedSlides) ? duplicatedSlides : [];
    const duplicatedIds = uniqueIds(duplicateRecords.map(record => record?.copyId));
    const logicalIds = uniqueIds([...rendered, ...duplicatedIds]);
    const logicalIdSet = new Set(logicalIds);
    const sourceByStateId = new Map();
    for(const slide of vm.slides || []){
      if(!logicalIdSet.has(slide?.id)) continue;
      sourceByStateId.set(slide.id, slide.id);
      for(const variant of slide.variants || []){
        if(variant?.stateId) sourceByStateId.set(String(variant.stateId), slide.id);
      }
    }
    duplicateRecords.forEach(record => {
      const copyId = String(record?.copyId || '');
      if(!copyId) return;
      sourceByStateId.set(copyId, copyId);
      Object.values(record?.variantStateIds || {}).forEach(stateId => {
        if(stateId) sourceByStateId.set(String(stateId), copyId);
      });
    });
    const normalized = [];
    const seen = new Set();
    for(const value of order || []){
      const id = String(value || '');
      const legacySource = id.includes('::') ? id.slice(0, id.lastIndexOf('::')) : '';
      const sourceId = sourceByStateId.get(id)
        || (logicalIdSet.has(id) ? id : '')
        || (logicalIdSet.has(legacySource) ? legacySource : '');
      if(!sourceId || seen.has(sourceId)) continue;
      seen.add(sourceId);
      normalized.push(sourceId);
    }
    for(const id of rendered){
      if(seen.has(id)) continue;
      seen.add(id);
      normalized.push(id);
    }
    duplicateRecords.forEach(record => {
      const copyId = String(record?.copyId || '');
      if(!copyId || seen.has(copyId)) return;
      const sourceId = String(record?.sourceId || '');
      const sourceIndex = normalized.indexOf(sourceId);
      normalized.splice(sourceIndex >= 0 ? sourceIndex + 1 : normalized.length, 0, copyId);
      seen.add(copyId);
    });
    return normalized;
  }

  function readJson(el, fallback){
    if(!el) return fallback;
    try {
      return JSON.parse(el.textContent || '') || fallback;
    } catch {
      return fallback;
    }
  }

  function writeJson(el, data){
    if(el) el.textContent = JSON.stringify(data || {}).replace(/</g, '\\u003c');
  }

  function createDeckSignature(model, text){
    const payload = JSON.stringify({
      title: model.title,
      exportId: model.exportId || '',
      schemaVersion: model.schemaVersion,
      variantOutputMode: model.variantOutputMode,
      slides: (model.slides || []).map(slide => [
        slide.id,
        slide.key,
        slide.layout,
        slide.dataLayout,
        slide.props,
        slide.content,
        (slide.variants || []).map(variant => [
          variant.id,
          variant.stateId,
          variant.key,
          variant.kind,
          variant.layout,
          variant.dataLayout,
          variant.themePack,
          variant.props,
          variant.media,
          variant.contentMap,
          variant.composition,
          variant.adjustable,
        ]),
      ]),
      text,
    });

    || null;
  const sourceModel = duplicatedRecord?.sourceId
    ? getLogicalSlideModel(duplicatedRecord.sourceId)
    : null;
  const sourceVariant = sourceModel?.variants?.find(variant => variant.id === copyVariant?.id)
    || null;
  slide.querySelectorAll('[data-sync-text]').forEach(node => {
    const value = node.dataset.syncText || '';
    if(!value) return;
    const next = window.__mapDuplicatedSyncTextName?.(
      value,
      sourceVariant,
      copyVariant,
      sourceModel?.id,
      copyId,
      true,
    );
    if(next && next !== value) node.dataset.syncText = next;
  });
  slide.querySelectorAll('[data-editable-id]').forEach(node => {
    const id = node.dataset.editableId || '';
    if(id.startsWith(`text:${copyKey}:`)) return;
    node.removeAttribute('data-editable-id');
    node.removeAttribute('contenteditable');
    node.removeAttribute('spellcheck');
    node.removeAttribute('role');
    delete node.dataset.editableReady;
    delete node.dataset.editing;
    delete node.dataset.editBefore;
  });
  slide.querySelectorAll('image-slot,.dslot,.acl-slot,.kx-imgslot,[data-slot-id],[data-dashi-slot-id]').forEach((node, index) => {
    if(node.dataset.slotId && !node.dataset.slotId.startsWith(`${copyId}:`)){
      node.dataset.slotId = `${copyId}:${node.dataset.slotId}`;
    }
    if(node.dataset.dashiSlotId && !node.dataset.dashiSlotId.startsWith(`${copyId}:`)){
      node.dataset.dashiSlotId = `${copyId}:${node.dataset.dashiSlotId}`;
    }
    if(node.dataset.mediaKey && !node.dataset.mediaKey.startsWith(`${copyId}:`)){
      node.dataset.mediaKey = `${copyId}:${node.dataset.mediaKey}`;
    }
    if(!node.id && node.tagName?.toLowerCase?.() === 'image-slot') node.id = `${copyId}-slot-${index + 1}`;
  });
  return slide;
}

function restorePersistedCatalogSlides(){
  const state = window.__deckViewModel?.getState?.() || {};
  const deleted = new Set((Array.isArray(state.deletedSlides) ? state.deletedSlides : []).map(String));
  const records = (Array.isArray(state.duplicatedSlides) ? state.duplicatedSlides : []).filter(record => !deleted.has(String(record?.copyId || '')));
  if(!records.length) return;
  const slideById = new Map(collectDeckSlides().map((slide, index) => [getSlideVmId(slide, index), slide]));
  records.forEach(record => {
    if(!record?.sourceId || !record?.copyId || slideById.has(record.copyId)) return;
    const source = slideById.get(record.sourceId);
    if(!source) return;
    const sourceModel = getLogicalSlideModel(source);
    const restoredId = window.__deckViewModel?.restoreDuplicatedSlide?.(record, sourceModel);
    const copyModel = restoredId ? getLogicalSlideModel(restoredId) : null;
    const selectedStateId = window.__deckViewModel?.peek?.('variantSelection')?.[record.copyId]
      || state.variantSelection?.[record.copyId]
      || record.selectedVariantStateId
      || copyModel?.stateId;
    const copyVariant = copyModel?.variants?.find(variant => variant.stateId === selectedStateId)
      || copyModel?.variants?.find(variant => variant.id === selectedStateId)
      || copyModel?.variants?.[0];
    const clone = source.cloneNode(true);
    releaseTemplateVideoElements(clone);
    prepareDuplicatedSlideClone(clone, source, record.copyId, copyModel, copyVariant);
    deck.insertBefore(clone, source.nextSibling);
    slideById.set(record.copyId, clone);
    if(copyVariant){
      materializeSlideVariant(clone, copyVariant, {
        isolated:true,
        context:'restore duplicated logical slide',
      });
    }else{
      ensureRuntimeSlideRendered(clone, undefined, {isolated:true, context:'restore duplicated slide'});
    }
  });
}
window.__restorePersistedCatalogSlides = restorePersistedCatalogSlides;

function applyPersistedSlideOrder(){
  const order = window.__deckViewModel?.getState?.().slideOrder || [];
  if(!order.length) return;
  const current = collectDeckSlides();
  const slideById = new Map(current.map((slide, index) => [getSlideVmId(slide, index), slide]));
  order.forEach(id => {
    const slide = slideById.get(id);
    if(slide) deck.appendChild(slide);
  });
}
window.__applyPersistedSlideOrder = applyPersistedSlideOrder;

const slideStateSetCache = new Map();
function getSlideStateSet(key){
  const vmApi = window.__deckViewModel;
  const source = vmApi?.peek ? vmApi.peek(key) : vmApi?.getState?.()?.[key];
  const list = Array.isArray(source) ? source : [];
  const cached = slideStateSetCache.get(key);
  if(cached && cached.source === source) return cached.set;
  const set = new Set(list.filter(Boolean).map(String));
  slideStateSetCache.set(key, { source, set });
  return set;
}

function isSlideHiddenByThemePack(slide){
  return !!(activeThemePack && slide?.dataset.themePack && slide.dataset.themePack !== activeThemePack);
}

function isSlideDeleted(slide, index=allSlides.indexOf(slide)){
  return getSlideStateSet('deletedSlides').has(getSlideVmId(slide, index));
}

function isSlideSkipped(slide, index=allSlides.indexOf(slide)){
  return getSlideStateSet('skippedSlides').has(getSlideVmId(slide, index));
}

function getCatalogSlides(){
  allSlides=collectDeckSlides();
  const deleted = getSlideStateSet('deletedSlides');
  return allSlides.filter((slide, index) => !isSlideHiddenByThemePack(slide) && !deleted.has(getSlideVmId(slide, index)));
}

function persistCatalogSlideOrder(){
  window.__deckViewModel?.setSlideOrder?.(getCatalogSlides().map((slide, index) => getSlideVmId(slide, index)));
}

function refreshSlideList(){
  allSlides=collectDeckSlides();
  const skipped = getSlideStateSet('skippedSlides');
  const deleted = getSlideStateSet('deletedSlides');
  allSlides.forEach((slide, index) => {
    const slideId = getSlideVmId(slide, index);
    const hiddenByPack = isSlideHiddenByThemePack(slide);
    const hiddenByState = deleted.has(slideId) || skipped.has(slideId);
    const hidden = hiddenByPack || hiddenByState;
    slide.hidden = hidden;
    if(skipped.has(slideId)) slide.dataset.slideSkipped = 'true';
    else delete slide.dataset.slideSkipped;
    if(hidden) slide.setAttribute('aria-hidden', 'true');
    else slide.removeAttribute('aria-hidden');
  });
  slides=allSlides.filter(slide => !slide.hidden);
  total=slides.length;
  if(total === 0) idx=0;
  if(idx >= total) idx=Math.max(0,total-1);
  syncDeckPageNumbers();
}
window.__refreshSlideList = refreshSlideList;

function parseRuntimeSlidePage(layout){
  const match = String(layout || '').match(/^(theme\d+)_page(\d+)$/i);
  return match ? Number(match[2]) : null;
}

function getRuntimeSlideErrorMeta(slide){
  const root = slide?.querySelector?.('.imported-theme-root');
  const layout = slide?.dataset?.vmLayout || root?.dataset?.pageKey || '';
  const index = Number(slide?.dataset?.vmIndex);
  return {
    theme: slide?.dataset?.themePack || root?.dataset?.themeKey || activeThemePack || document.documentElement.dataset.themePack || 'unknown',
    page: parseRuntimeSlidePage(layout) ?? (Number.isFinite(index) ? index + 1 : null),
    layout: layout || 'unknown',
    dataLayout: slide?.dataset?.layout || '',
    slideId: slide?.dataset?.vmSlideId || '',
  };
}

function reportRuntimeSlideError(context, slide, error){
  const meta = getRuntimeSlideErrorMeta(slide);
  const message = error?.message || String(error || 'runtime render failed');
  const detail = {...meta, context, message};
  window.__deckRuntimeErrors = window.__deckRuntimeErrors || [];
  window.__deckRuntimeErrors.push(detail);
  console.error(`[${context}] theme=${meta.theme} page=${meta.page == null ? 'unknown' : String(meta.page).padStart(3, '0')} layout=${meta.layout} ${message}`, error);
  dispatchEvent(new CustomEvent('deck-runtime-error', {detail}));
}

function isRuntimeThemeSlide(slide){
  return !!slide?.querySelector?.('.imported-theme-root');
}

function showRuntimeSlideErrorPlaceholder(slide, error){
  if(!slide) return;
  let overlay = slide.querySelector(':scope > [data-runtime-error-overlay]');
  if(!overlay){
    overlay = document.createElement('div');
    overlay.setAttribute('data-runtime-error-overlay', 'true');
    overlay.style.cssText = 'position:absolute;inset:0;z-index:80;display:flex;flex-direction:column;'
      + 'align-items:center;justify-content:center;gap:10px;padding:48px;text-align:center;'
      + 'background:rgba(17,17,20,0.94);color:#fff;font:600 22px/1.4 var(--sans,sans-serif);pointer-events:none;';
    const title = document.createElement('div');
    title.textContent = window.__deckI18n.ui('该页渲染失败，内容已跳过');
    const detail = document.createElement('div');
    detail.style.cssText = 'font-weight:400;font-size:14px;opacity:.7;max-width:82%;word-break:break-word;';
    overlay.append(title, detail);
    slide.appendChild(overlay);
  }
  const detailEl = overlay.lastElementChild;
  if(detailEl) detailEl.textContent = error?.message ? String(error.message).slice(0, 240) : '';
}

function clearRuntimeSlideErrorPlaceholder(slide){
  slide?.querySelector?.(':scope > [data-runtime-error-overlay]')?.remove();
}

// isolated:true 的调用方(如 go()/commitSlideIndex)在这次调用之后还有收尾代码要跑(释放
// 导航锁等)——异常在这里必须被兜住,不能冲断收尾代码。非 isolated 调用方(如 overview 缩略图
// 生成管线的 renderOverviewThumb)自己有更专用的外层 try/catch 和恢复 UI,这里必须让异常正常
// 往外传,不能抢先吞掉,否则外层那套上下文更准确的错误处理和占位 UI 就都不会触发了。
function renderRuntimeSlideWithIsolation(slide, props, opts={}){
  const renderOpts = {...opts, trusted:true};
  if(!opts.isolated){
    const rendered = !!window.__renderRuntimeSlide?.(slide, props, renderOpts);
    delete slide.dataset.runtimeRenderError;
    clearRuntimeSlideErrorPlaceholder(slide);
    return rendered;
  }
  let rendered = false;
  let thrown = null;
  try{
    rendered = !!window.__renderRuntimeSlide?.(slide, props, renderOpts);
  }catch(error){
    thrown = error;
  }
  if(rendered){
    delete slide.dataset.runtimeRenderError;
    clearRuntimeSlideErrorPlaceholder(slide);
    return true;
  }
  if(thrown) reportRuntimeSlideError(opts.context || 'runtime isolated render', slide, thrown);
  if(isRuntimeThemeSlide(slide)){
    slide.dataset.runtimeRenderError = 'true';
    showRuntimeSlideErrorPlaceholder(slide, thrown);
  }
  return false;
}

function ensureRuntimeSlideRendered(slide, values, opts={}){
  const finalize = rendered => {
    if(rendered){
      uniquifyDuplicatedRuntimeSlideSvgIds(slide);
      namespaceDuplicatedRuntimeSlideDom(slide);
      window.__initEditableText?.(slide);
    }
    return rendered;
  };
  if(!slide) return false;
  const slideId = getSlideStateId(slide);
  const sourceModel = getSlideSourceModel(slide);
  const sourceProps = sourceModel?.kind === 'template'
    ? sourceModel.materializedProps
      || window.__resolveRuntimeTemplateVariantProps?.(slide, sourceModel)
      || sourceModel.props
      || {}
    : sourceModel?.props || {};
  const savedProps = window.__deckViewModel?.peek?.('props')?.[slideId]
    || window.__deckViewModel?.getState?.().props?.[slideId]
    || {};
  const next = {...sourceProps, ...savedProps, ...(values || {})};
  return finalize(renderRuntimeSlideWithIsolation(slide, next, opts));
}
window.__ensureRuntimeSlideRendered = ensureRuntimeSlideRendered;

function materializeSlideVariant(slide, variant, opts={}){
  if(!slide || !variant?.stateId || typeof window.__materializeRuntimeSlideVariant !== 'function') return false;
  const logicalId = getSlideVmId(slide);
  const logicalModel = getLogicalSlideModel(logicalId);
  const variantIndex = Math.max(0, logicalModel?.variants?.findIndex(item => item.stateId === variant.stateId) ?? 0);
  const previousVariant = getSlideVariantModel(slide);
  const previousEditableText = new Map(
    [...slide.querySelectorAll('[data-editable-id]')]
      .map(element => [element.dataset.editableId, element.innerHTML]),
  );
  const previousTextState = {
    ...(window.__deckViewModel?.peek?.('text')
      || window.__deckViewModel?.getState?.().text
      || {}),
  };
  const context = opts.context || 'switch slide variant';
  const rollbackPreviousVariant = () => {
    if(opts.rollback === false || !previousVariant || previousVariant.stateId === variant.stateId) return false;
    const restored = materializeSlideVariant(slide, previousVariant, {
      isolated:true,
      context:`${context} rollback`,
      rollback:false,
    });
    if(restored){
      window.__replaceEditableTextState?.(previousTextState);
      slide.querySelectorAll('[data-editable-id]').forEach(element => {
        const value = previousEditableText.get(element.dataset.editableId);
        if(value !== undefined) element.innerHTML = value;
      });
    }
    return restored;
  };
  try{
    if(!window.__materializeRuntimeSlideVariant(slide, variant)){
      rollbackPreviousVariant();
      return false;
    }
    slide.dataset.vmSlideId = logicalId;
    slide.dataset.vmSourceSlideId = logicalId;
    slide.dataset.vmVariantStateId = variant.stateId;
    slide.dataset.vmVariantId = variant.id || `variant-${variantIndex + 1}`;
    slide.dataset.vmVariantIndex = String(variantIndex);
    slide.dataset.vmVariantCount = String(logicalModel?.variants?.length || 1);
    slide.dataset.vmVariantKind = variant.kind || 'template';
    delete slide.dataset.vmVariantMode;
    slide.dataset.vmSlideKey = variant.key || variant.stateId;
    slide.dataset.vmLayout = variant.layout || '';
    slide.dataset.layout = variant.dataLayout || variant.layout || '';
    if(variant.themePack) slide.dataset.themePack = variant.themePack;
    else delete slide.dataset.themePack;
    if(variant.label) slide.dataset.label = variant.label;
    else delete slide.dataset.label;
    const rendered = ensureRuntimeSlideRendered(slide, undefined, {
      isolated:opts.isolated !== false,
      context,
      suppressMotion:opts.suppressMotion === true,
    });
    if(rendered){
      window.__restoreEffectIframes?.(slide);
      if(slide.classList.contains('active')) window.__syncActiveEffects?.(slide, {skipMotion:true});
    }else{
      rollbackPreviousVariant();
    }
    return rendered;
  }catch(error){
    if(opts.isolated !== false) reportRuntimeSlideError(context, slide, error);
    rollbackPreviousVariant();
    if(opts.isolated === false) throw error;
    return false;
  }
}

function applyDeckVariantSelections(opts={}){
  const selections = window.__deckViewModel?.peek?.('variantSelection')
    || window.__deckViewModel?.getState?.().variantSelection
    || {};
  collectDeckSlides().forEach(slide => {
    const logical = getLogicalSlideModel(slide);
    if(!Array.isArray(logical?.variants) || !logical.variants.length) return;
    const requested = selections[logical.id];
    const variant = logical.variants.find(item => item.stateId === requested)
      || logical.variants.find(item => item.id === requested)
      || logical.variants.find(item => item.stateId === logical.stateId)
      || logical.variants[0];
    if(!variant) return;
    if(!opts.force && getSlideStateId(slide) === variant.stateId) return;
    materializeSlideVariant(slide, variant, {
      isolated:opts.isolated !== false,
      context:opts.context || 'restore slide variant',
      suppressMotion:opts.suppressMotion === true,
    });
  });
}
window.__applyDeckVariantSelections = applyDeckVariantSelections;

function setSlideVariant(slideId, stateId){
  const sourceId = getSlideSourceId(slideId);
  const logical = getLogicalSlideModel(sourceId);
  const variant = logical?.variants?.find(item => item.stateId === stateId)
    || logical?.variants?.find(item => item.id === stateId);
  if(!variant) return false;
  const slide = collectDeckSlides().find(item => getSlideSourceId(item) === sourceId);
  if(!slide) return false;
  if(getSlideStateId(slide) === variant.stateId){
    window.__deckViewModel?.setVariantSelection?.(sourceId, variant.stateId);
    return true;
  }
  if(slide.contains(document.activeElement)) document.activeElement.blur?.();
  if(!materializeSlideVariant(slide, variant, {context:'select slide variant'})) return false;
  window.__deckViewModel?.setVariantSelection?.(sourceId, variant.stateId);
  window.__markOverviewThumbDirty?.(slide);
  window.__syncSlideTone?.(slide);
  window.__layoutDeck?.();
  if(isEditMode()) window.__refreshRailCatalog?.();
  const detail = {slideId, sourceSlideId:sourceId, stateId:variant.stateId, variantId:variant.id, variantKind:variant.kind || 'template'};
  dispatchEvent(new CustomEvent('swiss-slide-variant-change', {detail}));
  return true;
}
window.__setSlideVariant = setSlideVariant;

function prepareSlideForTransition(slide, values, opts={}){
  if(!slide) return false;
  const rendered = ensureRuntimeSlideRendered(slide, values, opts);
  if(opts.isolated && slide.dataset.runtimeRenderError === 'true') return false;
  window.__restoreEffectIframes?.(slide);
  slide.dataset.transitionReady = 'true';
  return rendered || !!slide.firstElementChild;
}
window.__prepareSlideForTransition = prepareSlideForTransition;

function startTransitionSlideEnter(slide){
  if(!slide) return false;
  clearRuntimeMotionSuppression(slide);
  window.__transitionEnteredSlide = slide;
  slide.dataset.transitionEnterStarted = 'true';
  slide.setAttribute('data-deck-active', '');
  window.__restoreEffectIframes?.(slide);
  window.__syncActiveEffects?.(slide);
  return true;
}
window.__startTransitionSlideEnter = startTransitionSlideEnter;

function preloadAdjacentSlides(activeIndex=idx, opts={}){
  if(deckDiagnosticFlags.disableAdjacentPreload) return;
  const targets = [activeIndex + 1, activeIndex - 1]
    .filter(index => index >= 0 && index < slides.length)
    .map(index => slides[index])
    .filter(Boolean);
  if(!targets.length) return;
  const run = () => {
    applyAdjacentVisibility(activeIndex);
    targets.forEach(slide => prepareSlideForTransition(slide, undefined, {
      isolated:true,
      context:'adjacent preload',
    }));
    window.__releaseInactiveRuntimeSlides?.(slides[activeIndex], {adjacentPreload:true});
  };
  if(opts.immediate){
    run();
    return;
  }
  const delay = Number(opts.delay || 0);
  if(delay > 0){
    if(adjacentPreloadTimer !== null) clearTimeout(adjacentPreloadTimer);
    adjacentPreloadTimer = setTimeout(() => {
      adjacentPreloadTimer=null;
      if(activeIndex === idx) preloadAdjacentSlides(activeIndex);
    }, delay);
    return;
  }
  if('requestIdleCallback' in window) requestIdleCallback(run, {timeout: 260});
  else setTimeout(run, 60);
}
window.__preloadAdjacentSlides = preloadAdjacentSlides;

// Keep the active slide's immediate neighbors painted (content-visibility:visible)
// so adjacent navigation never flashes a blank/un-rendered frame.
function applyAdjacentVisibility(activeIndex=idx){
  const near = new Set();
  [activeIndex - 1, activeIndex + 1].forEach(index => {
    if(index >= 0 && index < slides.length && slides[index]) near.add(slides[index]);
  });
  allSlides.forEach(slide => slide.classList.toggle('cv-near', near.has(slide)));
}

function setActiveThemePack(themePack, opts={}){
  activeThemePack=themePack || '';
  if(activeThemePack) document.documentElement.dataset.themePack=activeThemePack;
  else document.documentElement.removeAttribute('data-theme-pack');
  refreshSlideList();
  renderNav();
  layoutDeck();
  if(opts.navigate !== false) go(0, {animate:false, skipThumbPause:true});
  else commitSlideIndex(idx, {
    fullActiveSync:true,
    suppressMotion:opts.suppressMotion === true,
  });
  if(isEditMode() && overviewGrid){
    refreshRailCatalog();
  }
  scheduleViewParamsWrite();
}
window.__setActiveThemePack=setActiveThemePack;

function applyDeckTransform(){
  deck.style.transform=`translateX(${-idx*deckW}px)`;
}

function measureDeckStage(availableW, availableH, offsetLeft=0){
  const safeW=Math.max(320,availableW);
  const safeH=Math.max(180,availableH);
  const width=Math.min(safeW,safeH*DECK_ASPECT_W/DECK_ASPECT_H);
  const height=width*DECK_ASPECT_H/DECK_ASPECT_W;
  return {
    width,
    height,
    left:offsetLeft+(safeW-width)/2,
    top:(safeH-height)/2,
  };
}

function layoutDeck(){
  const panel=document.getElementById('preview-panel');
  const panelOpen=isEditMode() && document.body.classList.contains('preview-panel-open');
  const collapsed=document.body.classList.contains('editor-panels-collapsed');
  const panelW=panelOpen && panel ? panel.offsetWidth : 0;
  const railW=isEditMode() && slideRail ? slideRail.offsetWidth : 0;
  const topbarH=(isEditMode() && deckTopbar && !collapsed) ? deckTopbar.offsetHeight : 0;
  const stagePad=(isEditMode() && !collapsed) ? 64 : 0;
  const stage=measureDeckStage(innerWidth-railW-panelW-stagePad*2,innerHeight-topbarH-stagePad*2,railW+stagePad);
  deckW=stage.width;
  deckH=stage.height;
  deckLeft=stage.left;
  deckTop=stage.top+topbarH+stagePad;
  deckScale=deckW/1920;
  document.documentElement.style.setProperty('--deck-w',`${deckW}px`);
  document.documentElement.style.setProperty('--deck-h',`${deckH}px`);
  document.documentElement.style.setProperty('--deck-left',`${deckLeft}px`);
  document.documentElement.style.setProperty('--deck-top',`${deckTop}px`);
  document.documentElement.style.setProperty('--deck-scale',String(deckScale));
  deck.style.width=(total*deckW)+'px';
  deck.style.height=deckH+'px';
  applyDeckTransform();
}
window.__layoutDeck=layoutDeck;
addEventListener('resize',layoutDeck);

let slideRailResizePointerId=null;
let slideRailResizeFrame=null;
function readCssPxVar(name, fallback){
  const value = Number.parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name));
  return Number.isFinite(value) ? value : fallback;
}
function clampSlideRailWidth(value){
  const min = readCssPxVar('--slide-rail-min-w', 156);
  const max = readCssPxVar('--slide-rail-max-w', 320);
  return Math.max(min, Math.min(max, value));
}
function requestSlideRailResizeLayout(){
  if(slideRailResizeFrame !== null) return;
  slideRailResizeFrame = requestAnimationFrame(() => {
    slideRailResizeFrame = null;
    syncSlideRailScrollbarPadding();
    layoutDeck();
    if(isEditMode() && overviewGrid){
      const range = getOverviewThumbRange(overviewGrid, {includeNear:true});
      fitOverviewThumbnails(range.cards);
      observeOverviewThumbs(overviewGrid);
    }
  });
}
function setSlideRailWidth(value){
  document.documentElement.style.setProperty('--slide-rail-w', `${clampSlideRailWidth(value)}px`);
  requestSlideRailResizeLayout();
}
function syncSlideRailScrollbarPadding(){
  if(!slideRailList) return;
  const scrollbarW = Math.max(0, slideRailList.offsetWidth - slideRailList.clientWidth);
  slideRailList.style.setProperty('--rail-scrollbar-w', `${scrollbarW}px`);
}
window.__syncSlideRailScrollbarPadding = syncSlideRailScrollbarPadding;
function endSlideRailResize(event){
  if(slideRailResizePointerId === null || event.pointerId !== slideRailResizePointerId) return;
  slideRailResizePointerId = null;
  document.body.classList.remove('is-rail-resizing');
  slideRailResizeHandle?.releasePointerCapture?.(event.pointerId);
  requestSlideRailResizeLayout();
  if(isEditMode()) requestOverviewThumbRefresh(false, {priority:true});
}
slideRailResizeHandle?.addEventListener('pointerdown', event => {
  if(!isEditMode()) return;
  event.preventDefault();
  slideRailResizePointerId = event.pointerId;
  document.body.classList.add('is-rail-resizing');
  slideRailResizeHandle.setPointerCapture?.(event.pointerId);
});
slideRailResizeHandle?.addEventListener('pointermove', event => {
  if(slideRailResizePointerId === null || event.pointerId !== slideRailResizePointerId) return;
  event.preventDefault();
  setSlideRailWidth(event.clientX);
});
slideRailResizeHandle?.addEventListener('pointerup', endSlideRailResize);
slideRailResizeHandle?.addEventListener('pointercancel', endSlideRailResize);

let previewPanelResizePointerId=null;
function clampPreviewPanelWidth(value){
  const min = readCssPxVar('--preview-panel-min-w', 300);
  const max = Math.min(readCssPxVar('--preview-panel-max-w', 560), window.innerWidth - 120);
  return Math.max(min, Math.min(Math.max(min, max), value));
}
function setPreviewPanelWidth(value){
  document.documentElement.style.setProperty('--preview-panel-w', `${clampPreviewPanelWidth(value)}px`);
  requestSlideRailResizeLayout();
}
function endPreviewPanelResize(event){
  if(previewPanelResizePointerId === null || event.pointerId !== previewPanelResizePointerId) return;
  previewPanelResizePointerId = null;
  document.body.classList.remove('is-rail-resizing');
  previewPanelResizeHandle?.releasePointerCapture?.(event.pointerId);

const theme10SkipTags = new Set(['STYLE','SCRIPT','BR','HR','DEFS']);
const theme10AtomicTags = new Set(['SVG','CANVAS','IMG','VIDEO','IMAGE-SLOT']);

function theme10ElementChildren(node){
  const out = [];
  for(let child = node?.firstElementChild; child; child = child.nextElementSibling){
    if(!theme10SkipTags.has(child.tagName)) out.push(child);
  }
  return out;
}

function playTheme10Motion(slide){
  if(!slide?.hasAttribute?.('data-deck-active')) return false;
  const wrap = slide?.querySelector?.('.ds-slidewrap');
  const root = wrap?.firstElementChild || wrap;
  if(!root) return false;
  const groups = theme10ElementChildren(root);
  let targets = [];
  groups.forEach(group => {
    const children = theme10ElementChildren(group);
    if(children.length >= 2 && children.length <= 10 && !theme10AtomicTags.has(group.tagName)) targets.push(...children);
    else targets.push(group);
  });
  if(targets.length < 2 || targets.length > 26) targets = groups;
  if(!targets.length) return false;
  targets = targets.map(el => {
    const rect = el.getBoundingClientRect();
    return {el, top:rect.top, left:rect.left};
  }).sort((a,b) => {
    const band = Math.round(a.top / 64) - Math.round(b.top / 64);
    return band !== 0 ? band : a.left - b.left;
  }).map(item => item.el);
  targets.forEach(el => {
    el.classList.remove('ds-anim','ds-fade');
    el.style.removeProperty('--ds-d');
  });
  void root.offsetWidth;
  const step = Math.max(34, Math.min(72, Math.round(620 / targets.length)));
  targets.forEach((el, index) => {
    const position = getComputedStyle(el).position;
    const fade = position === 'absolute' || position === 'fixed' || theme10AtomicTags.has(el.tagName);
    el.style.setProperty('--ds-d', `${50 + index * step}ms`);
    el.classList.add(fade ? 'ds-fade' : 'ds-anim');
  });
  return true;
}

function syncTheme10Motion(activeSlide=getActiveSlide()){

  function attempt(){
    if(!activeSlide?.isConnected || !activeSlide.hasAttribute('data-deck-active')) return;
    if(playTheme10Motion(activeSlide)) return;
    if(tries++ < 15) requestAnimationFrame(attempt);
  }
  requestAnimationFrame(attempt);
}

function go(n, opts={}){
  blurActiveEditableText();
  if(window.__deckExportLocked && !opts.force) return;
  if(lock){
    if(isEditMode() && !opts.force){
      pendingNavigationDirection = n > idx ? 1 : n < idx ? -1 : pendingNavigationDirection;
    }
    return;
  }
  if(opts.refreshSlideList) refreshSlideList();
  if(total <= 0){
    lock=true;
    commitSlideIndex(0, opts);
    requestAnimationFrame(releaseDeckNavigationLock);
    return;
  }
  const nextIndex=Math.max(0,Math.min(total-1,n));
  const currentSlide=slides[idx];
  const nextSlide=slides[nextIndex];
  const mode = opts.animate === false || nextIndex === idx || nextSlide?.querySelector?.('[data-page-key="theme05_page048"]')
    ? 'none'
    : (window.__getPageTransition?.() || 'none');
  if(mode !== 'none') prepareSlideForTransition(nextSlide);
  if(mode !== 'none' && typeof window.__playPageTransition === 'function' && currentSlide && nextSlide){
    let committed=false;
    const commit=()=>{
      if(committed) return;
      committed=true;
      commitSlideIndex(nextIndex, isEditMode() ? {...opts, skipPlaySlide:true, skipMotionEffects:true} : opts);
    };
    const transitionOptions = isEditMode() ? {...opts, commitEarly:true, nonBlocking:true} : opts;
    const transition = window.__playPageTransition(mode, currentSlide, nextSlide, nextIndex >= idx ? 1 : -1, commit, transitionOptions);
    if(isEditMode()){
      commit();
      Promise.resolve(transition).catch(error => console.warn('[page transition]', error));
      return;
    }
    lock=true;
    Promise.resolve(transition)
      .catch(error => console.warn('[page transition]', error))
      .finally(() => {
        commit();
        requestAnimationFrame(releaseDeckNavigationLock);
      });
    return;
  }
  lock=true;
  commitSlideIndex(nextIndex, isPresentMode() ? {...opts, skipPlaySlide:true, skipMotionEffects:true} : opts);
  requestAnimationFrame(releaseDeckNavigationLock);
}

function collectLogicalVariantSyncTextNames(source, sourceModel, state, onRendered){

    const variantId = String(variant?.id || variant?.variantId || `variant-${index + 1}`);
    const probe = source.cloneNode(false);
    probe.removeAttribute('id');
    probe.dataset.vmSlideId = sourceModel.id;
    probe.dataset.vmSourceSlideId = sourceModel.id;
    probe.dataset.vmVariantStateId = variant.stateId || variantId;
    try{
      if(!window.__materializeRuntimeSlideVariant?.(probe, variant)) return;
      const sourceProps = (variant.kind || variant.variantKind) === 'template'
        ? variant.materializedProps
          || window.__resolveRuntimeTemplateVariantProps?.(probe, variant)
          || variant.props
          || {}
        : variant.props || {};
      const savedProps = state.props?.[variant.stateId] || {};
      if(window.__renderRuntimeSlide?.(
        probe,
        {...sourceProps, ...savedProps},
        {trusted:true, suppressMotion:true},
      ) === false) return;
      onRendered?.(probe, variant);
      const names = [...new Set(
        [...probe.querySelectorAll('[data-sync-text]')]
          .map(node => node.dataset.syncText)

function duplicateCatalogSlide(catalogIndex){
