  function buildHtmlExportComparisonPages(slides){
    const descriptors = [];
    (slides || []).forEach((slide, logicalIndex) => {
      const variants = Array.isArray(slide?.variants) ? slide.variants : [];
      if(!variants.length){
        const variantStateId = slide?.stateId || slide?.id;
        if(!variantStateId) return;
        descriptors.push({
          id:variantStateId,
          sourceSlideId:slide.id,
          logicalIndex,
          variantStateId,
          variantId:slide.variantId || '',
          variantKind:slide.variantKind || slide.kind || 'template',
          variantIndex:Number(slide.variantIndex || 0),
          variantCount:Number(slide.variantCount || 1),
          exportIndex:descriptors.length,
        });
        return;
      }
      variants.forEach((variant, variantIndex) => {
        const variantStateId = variant?.stateId || variant?.id || slide.id;
        descriptors.push({
          id:variantStateId,
          sourceSlideId:slide.id,
          logicalIndex,
          variantStateId,
          variantId:variant?.id || '',
          variantKind:variant?.kind || variant?.variantKind || 'template',
          variantIndex:Number(variant?.variantIndex ?? variantIndex),
          variantCount:variants.length,
          exportIndex:descriptors.length,
        });
      });
    });
    return descriptors;
  }

  function buildHtmlExportStateClosure(state, slides, visibleSlides, variantSelection, exportedProps){
    const retainedLogicalIds = new Set();
    const ownerRecordsByType = new Map();
    const retainedSyncKeys = new Set();
    const retainedMediaKeys = new Set();
    const visibleById = new Map((visibleSlides || []).map(slide => [
      slide.dataset.vmSourceSlideId || slide.dataset.vmSlideId,
      slide,
    ]));
    const duplicatedRecords = new Map(
      (Array.isArray(state?.duplicatedSlides) ? state.duplicatedSlides : [])
        .map(record => [String(record?.copyId || ''), record])
        .filter(([copyId]) => copyId),
    );
    const runtimeSlides = window.__deckViewModel?.model?.slides || [];
    const liveSlides = new Map(runtimeSlides.map(slide => [String(slide?.id || ''), slide]));
    const ordinaryTextOwnerTypes = ['renderableTextKey'];
    const syncTextOwnerTypes = ['variantStateId', 'variantKey', 'logicalId'];
    const mediaOwnerTypes = ['variantStateId', 'variantKey', 'logicalStateId', 'logicalKey', 'logicalId'];
    const propsOwnerTypes = ['variantStateId', 'logicalStateId'];

    const registerOwner = (type, value, logicalId) => {
      const owner = String(value || '');
      const pageId = String(logicalId || '');
      if(!type || !owner || !pageId) return;
      if(!ownerRecordsByType.has(type)) ownerRecordsByType.set(type, new Map());
      const recordsByOwner = ownerRecordsByType.get(type);
      if(!recordsByOwner.has(owner)) recordsByOwner.set(owner, []);
      const records = recordsByOwner.get(owner);
      if(records.some(record => record.logicalId === pageId)) return;
      records.push({owner, type, logicalId:pageId});
    };
    const rememberSyncName = name => {
      const syncName = String(name || '');
      if(syncName) retainedSyncKeys.add(`sync:${syncName}`);
    };
    const rememberMediaKey = value => {
      const mediaKey = String(value || '');
      if(mediaKey) retainedMediaKeys.add(mediaKey);
    };

    runtimeSlides.forEach(logical => {
      const logicalId = String(logical?.id || '');
      if(!logicalId) return;
      registerOwner('logicalId', logicalId, logicalId);
      registerOwner('logicalStateId', logical?.stateId || logicalId, logicalId);
      registerOwner('logicalKey', logical?.key, logicalId);
      const variants = Array.isArray(logical?.variants) ? logical.variants : [];
      if(variants.length){
        variants.forEach(variant => {
          registerOwner('renderableTextKey', variant?.key, logicalId);
          registerOwner('variantStateId', variant?.stateId, logicalId);
          registerOwner('variantKey', variant?.key, logicalId);
        });
      }else{
        registerOwner('renderableTextKey', logical?.key, logicalId);
      }
    });

    const sortedOwnerRecordsByType = new Map(
      [...ownerRecordsByType.entries()].map(([type, recordsByOwner]) => [
        type,
        [...recordsByOwner.entries()]
          .sort(([left], [right]) => right.length - left.length || left.localeCompare(right)),
      ]),
    );
    const matchesOwnerCandidate = (candidate, owner, exact) => exact
      ? candidate === owner
      : candidate === owner || (
          candidate.startsWith(owner)
          && candidate.charAt(owner.length) === ':'
        );
    const summarizeOwnerMatches = (matches, channel) => {
      if(!matches.length) return null;
      const owner = matches[0].owner;
      const types = [...new Set(matches.map(match => match.type))];
      const logicalIds = [...new Set(matches.flatMap(match => (
        match.ownerRecords.map(record => record.logicalId)
      )))];
      const retained = logicalIds.filter(logicalId => retainedLogicalIds.has(logicalId));
      const excluded = logicalIds.filter(logicalId => !retainedLogicalIds.has(logicalId));
      if(retained.length && excluded.length){
        throw new Error(
          `[dashi-ppt] HTML export state closure ambiguous owner "${owner}" in ${channel} state channel: matching owner types [${types.join(', ')}]; retained logical slides [${retained.join(', ')}] conflict with excluded logical slides [${excluded.join(', ')}].`,
        );
      }
      return {
        owner,
        type:types[0],
        types,
        logicalIds,
        retained:retained.length > 0,
      };
    };
    const resolveOwner = (value, channel, ownerTypes, exact=false) => {
      const candidate = String(value || '');
      if(!candidate) return null;
      const matches = [];
      for(const type of ownerTypes){
        const records = sortedOwnerRecordsByType.get(type) || [];
        for(const [owner, ownerRecords] of records){
          if(!matchesOwnerCandidate(candidate, owner, exact)) continue;
          matches.push({owner, type, ownerRecords});
        }
      }
      if(!matches.length) return null;
      const longestOwnerLength = Math.max(...matches.map(match => match.owner.length));
      return summarizeOwnerMatches(
        matches.filter(match => match.owner.length === longestOwnerLength),
        channel,
      );
    };
    (slides || []).forEach(logical => {
      const logicalId = String(logical?.id || '');
      if(!logicalId) return;
      retainedLogicalIds.add(logicalId);
      const variants = Array.isArray(logical.variants) ? logical.variants : [];

      const runtimeSlide = visibleById.get(logicalId);
      if(!runtimeSlide) return;
      if(variants.length){
        const namesByVariant = collectLogicalVariantSyncTextNames(runtimeSlide, logical, state || {}, probe => {
          collectRenderedMediaStateKeys(probe).forEach(rememberMediaKey);
        });
        const duplicateRecord = duplicatedRecords.get(logicalId);
        const sourceLogical = duplicateRecord?.sourceId
          ? liveSlides.get(String(duplicateRecord.sourceId))
          : null;
        variants.forEach((variant, index) => {
          const variantId = String(variant?.id || variant?.variantId || `variant-${index + 1}`);
          const sourceVariant = sourceLogical?.variants?.find(item => (
            String(item?.id || item?.variantId || '') === variantId
          )) || null;
          (namesByVariant[variantId] || []).forEach(name => {
            const nextName = isDuplicatedRuntimeSlide(runtimeSlide)
              ? window.__mapDuplicatedSyncTextName?.(
                  name,
                  sourceVariant,
                  variant,
                  sourceLogical?.id,
                  logicalId,
                  true,
                ) || name
              : name;
            rememberSyncName(nextName);
          });
        });
        return;
      }
      collectRenderedMediaStateKeys(runtimeSlide).forEach(rememberMediaKey);
      runtimeSlide.querySelectorAll('[data-sync-text]').forEach(node => {
        const name = node.dataset.syncText || '';
        if(!name) return;
        const nextName = isDuplicatedRuntimeSlide(runtimeSlide)
          ? window.__mapDuplicatedSyncTextName?.(
              name,
              null,
              null,
              duplicatedRecords.get(logicalId)?.sourceId,
              logicalId,
              true,
            ) || name
          : name;
        rememberSyncName(nextName);
      });
    });

    const text = {};
    Object.entries(state?.text || {}).forEach(([key, value]) => {
      if(key.startsWith('text:')){
        const owner = resolveOwner(key.slice(5), 'ordinary text', ordinaryTextOwnerTypes);
        if(owner?.retained) text[key] = value;
        return;
      }
      if(key.startsWith('sync:')){
        if(retainedSyncKeys.has(key)){
          text[key] = value;
          return;
        }
        const owner = resolveOwner(key.slice(5), 'sync text', syncTextOwnerTypes);
        if(owner?.retained) text[key] = value;
      }
    });

    const media = {};
    Object.entries(state?.media || {}).forEach(([key, value]) => {
      if(retainedMediaKeys.has(key)){
        media[key] = value;
        return;
      }
      const owner = resolveOwner(key, 'media', mediaOwnerTypes);
      if(owner?.retained) media[key] = value;
    });

    const props = {};
    Object.entries(exportedProps || {}).forEach(([key, value]) => {
      const owner = resolveOwner(key, 'props', propsOwnerTypes, true);
      if(owner?.retained) props[key] = value;
    });

    return {
      slideOrder:[...retainedLogicalIds],
      skippedSlides:[],
      deletedSlides:[],
      variantSelection:{...(variantSelection || {})},
      text,
      media,
      props,
    };
  }

  function buildHtmlExportViewModel(visibleSlides, outputMode=window.__getDeckVariantOutputMode?.() || 'comparison'){
    const liveModel = window.__deckViewModel.model;
    const state = liveModel.state || {};
    const sourceSlides = new Map((liveModel.slides || []).map(slide => [slide.id, slide]));
    const variantSelection = {};
    const exportedProps = {};
    const seenSources = new Set();
    const slides = (visibleSlides || []).map(slide => {
      const sourceId = slide.dataset.vmSourceSlideId || slide.dataset.vmSlideId;
      if(!sourceId || seenSources.has(sourceId)) return null;
      seenSources.add(sourceId);
      const source = sourceSlides.get(sourceId);
      if(!source) return null;
      if(Array.isArray(source.variants) && source.variants.length){
        const variants = source.variants.map(variant => {
          const id = variant.stateId;
          const currentProps = {...(state.props?.[id] || {})};
          if(id && Object.keys(currentProps).length) exportedProps[id] = currentProps;
          if((variant.kind || variant.variantKind) === 'bespoke') return variant;
          return {
            ...variant,
            props:{...(variant.props || {}), ...currentProps},
          };
        });
        const selectedToken = state.variantSelection?.[sourceId]
          || slide.dataset.vmVariantStateId
          || source.selectedVariant
          || source.stateId;
        const selected = variants.find(variant => variant.stateId === selectedToken)
          || variants.find(variant => variant.id === selectedToken)
          || variants[0];
        if(selected?.stateId) variantSelection[sourceId] = selected.stateId;
        const logical = {
          ...source,
          stateId:selected?.stateId ?? source.stateId,
          selectedVariant:selected?.id ?? source.selectedVariant,
          variants,
        };
        if(Number(liveModel.schemaVersion) === 2 && typeof window.__canonicalizeSchemaV2LogicalSlide === 'function'){
          return window.__canonicalizeSchemaV2LogicalSlide(logical);
        }
        return logical;
      }
      const id = source.stateId || sourceId;
      const currentProps = {...(state.props?.[id] || state.props?.[sourceId] || {})};
      if(Object.keys(currentProps).length) exportedProps[id] = currentProps;
      return {
        ...source,
        props: {...(source.props || {}), ...currentProps},
      };
    }).filter(Boolean);
    const model = {
      ...liveModel,
      exportId: 'html-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8),
      variantOutputMode: normalizeVariantOutputMode(outputMode),
      slides,
      comparisonPages:buildHtmlExportComparisonPages(slides),
      state:buildHtmlExportStateClosure(state, slides, visibleSlides, variantSelection, exportedProps),
    };
    delete model.physicalPages;
    delete model.variantPresentation;
    return model;
  }

  window.__buildHtmlExportViewModelSnapshot = (outputMode=window.__getDeckVariantOutputMode?.() || 'comparison') => (
    buildHtmlExportViewModel(
      window.__getVisibleSlides?.() || [...document.querySelectorAll('#deck > .slide:not([hidden])')],
      outputMode,
    )
  );

  function pruneHiddenSlidesForHtmlExport(clone, visibleSlides){
    const visibleIds = new Set((visibleSlides || []).map((slide, index) => getCloneSlideKey(slide, index)).filter(Boolean));
    if(!visibleIds.size) return;
    clone.querySelectorAll('#deck > .slide').forEach((slide, index) => {
      if(!visibleIds.has(getCloneSlideKey(slide, index))){
        slide.remove();
        return;
      }
      slide.hidden = false;
      slide.removeAttribute('hidden');
      slide.removeAttribute('aria-hidden');
      slide.removeAttribute('data-slide-skipped');
    });
  }

  function getCloneSlideKey(slide, index){
    return slide?.dataset?.vmSlideId || slide?.dataset?.vmLayout || slide?.dataset?.layout || `slide-${index + 1}`;
  }

  async function inlineLocalScriptsForHtmlExport(clone){
    const scripts = [...clone.querySelectorAll('script[src^="assets/"]')];
    await Promise.all(scripts.map(async script => {
      const src = script.getAttribute('src');
      try {
        const response = await fetch(src);
        if(!response.ok) return;
        script.textContent = (await response.text()).replace(/<\/script/gi, '<\\/script');
        script.removeAttribute('src');
        script.removeAttribute('crossorigin');
        script.removeAttribute('integrity');
      } catch {}
    }));
  }

  async function embedUnicornAssetsForExport(clone){
    const paths = [...new Set(
      [
        ...[...clone.querySelectorAll('.bt-unicorn-frame[data-unicorn-json-file-path]')]
          .map(frame => frame.dataset.unicornJsonFilePath),
        ...[...clone.querySelectorAll('script')]
          .flatMap(script => [...(script.textContent || '').matchAll(/assets\/unicorn\/[^"'`\\\s)]+\.json/g)].map(match => match[0])),
      ]
        .filter(Boolean)
    )];
    if(!paths.length) return;
    const assets = {};
    await Promise.all(paths.map(async path => {
      try {
        const response = await fetch(path);
        if(response.ok) assets[path] = await response.text();
      } catch {}
    }));
    if(!Object.keys(assets).length) return;
    clone.querySelector('#embedded-unicorn-assets')?.remove();
    const script = document.createElement('script');
    script.id = 'embedded-unicorn-assets';
    script.type = 'application/json';
    script.textContent = JSON.stringify(assets).replace(/</g, '\\u003c');
    clone.querySelector('head')?.appendChild(script);
  }

  async function serializeHtmlExportClone(clone, exportUi){
    let html = clone.outerHTML;
    const refs = collectHtmlExportLocalMediaRefs(html);
    if(!refs.length) return html;
    let done = 0;
    const replacements = [];
    await Promise.all(refs.map(async item => {
      throwIfDeckExportCancelled(exportUi);
      const dataUrl = await readHtmlExportLocalAssetDataUrl(item.path);
      done += 1;
      updateDeckExport(exportUi, done, refs.length, window.__deckI18n.ui('HTML 打包素材 {done} / {total}', {done: done, total: refs.length}));
      if(dataUrl) replacements.push({...item, dataUrl});
    }));
    replacements.forEach(({variants, dataUrl}) => {
      variants.forEach(ref => {
        html = html.split(ref).join(dataUrl);
      });
    });
    return html;
  }

  function collectHtmlExportLocalMediaRefs(html){
    const refs = new Map();
    const pattern = /(?:^|["'`(,;:\s=])((?:\.\/|\/)?(?:assets|images|uploads)\/[^"'`<>)\s\\]+?\.(?:png|jpe?g|webp|gif|svg|avif|mp4|webm|mov)(?:[?#][^"'`<>)\s\\]*)?)/gi;
    let match;
    while((match = pattern.exec(html))){
      const raw = match[1];
      const path = normalizeHtmlExportLocalMediaRef(raw);
      if(!path) continue;
      if(!refs.has(path)) refs.set(path, new Set());
      refs.get(path).add(raw);
      const encoded = encodeURI(path);
      if(encoded !== path) refs.get(path).add(encoded);
    }
    return [...refs].map(([path, variants]) => ({path, variants:[...variants]}));
  }

  function normalizeHtmlExportLocalMediaRef(value){
    const raw = String(value || '').trim();
    if(!raw || /^(data:|blob:|https?:|mailto:|tel:|#)/i.test(raw)) return '';
    const clean = raw
      .split('#')[0]
      .split('?')[0]
      .replace(/^\.?\//, '')
      .replace(/^\/+/, '');
    if(!/^(assets|images|uploads)\//.test(clean)) return '';
    if(!/\.(?:png|jpe?g|webp|gif|svg|avif|mp4|webm|mov)$/i.test(clean)) return '';
    return clean;
  }

  async function readHtmlExportLocalAssetDataUrl(path){
    try {
      const response = await fetch(path, {cache:'no-store'});
      if(!response.ok) return '';
      return await blobToDataUrl(await response.blob());
    } catch {
      return '';
    }
  }

  function blobToDataUrl(blob){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result || ''));
      reader.onerror = () => reject(reader.error || new Error('Could not read local export asset.'));
      reader.readAsDataURL(blob);
    });
  }

  function staticUnicornRuntime(){
    const DEFAULT_SDK_URL = 'assets/vendor/unicornstudio.umd.js';
    let sdkPromise = null;
    let sdkPromiseUrl = '';
    let embeddedAssetMap = null;
    const embeddedAssetUrls = new Map();

    window.__initUnicornScenes = initUnicornScenes;
    window.__resetUnicornSceneFrame = resetFrame;
    window.__syncUnicornSceneActivity = syncUnicornSceneActivity;

    addEventListener('swiss-slide-change', event => {
      const {index, slide} = event.detail || {};
      syncUnicornSceneActivity(slide);
      setTimeout(() => {
        if((window.__currentSlideIndex || 0) === index) initUnicornScenes(slide);
      }, 80);
    });

    syncUnicornSceneActivity(getCurrentSlide());
    initUnicornScenes(getCurrentSlide());

    function initUnicornScenes(scope = getCurrentSlide(), options = {}){
      const root = scope instanceof Element ? scope : document;
      const selector = '.bt-unicorn-frame[data-unicorn-project-id],.bt-unicorn-frame[data-unicorn-json-file-path]';
      const frames = [
        ...(root.matches?.(selector) ? [root] : []),
        ...Array.from(root.querySelectorAll(selector)),
      ];
      const activeSlide = getCurrentSlide();
      const pending = frames.filter(frame => {
        if(frame.dataset.unicornReady || frame.closest('.bt-image-slot.has-user-image,.bt-image-slot.has-user-media')) return false;
        return options.force || activeSlide.contains(frame) || frame === activeSlide;
      });
      if(!pending.length) return Promise.resolve([]);
      const sdkUrl = pending[0].dataset.unicornSdkUrl || DEFAULT_SDK_URL;
      return loadSdk(sdkUrl)
        .then(() => Promise.allSettled(pending.map(initFrame)))
        .catch(error => {
          pending.forEach(frame => markFrameFallback(frame, 'runtime-load'));
          return [];
        });
    }

    function getCurrentSlide(){
      const slides = window.__getVisibleSlides?.() || [...document.querySelectorAll('#deck > .slide:not([hidden])')];
      return slides[window.__currentSlideIndex || 0] || document;
    }

    function loadSdk(sdkUrl){
      if(window.UnicornStudio?.addScene) return Promise.resolve();
      if(sdkPromise && sdkPromiseUrl === sdkUrl) return sdkPromise;
      sdkPromiseUrl = sdkUrl;
      sdkPromise = new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = sdkUrl;
        script.async = true;
        script.onload = resolve;
        script.onerror = () => reject(new Error(`Failed to load Unicorn SDK ${sdkUrl}`));
        document.head.appendChild(script);
      })
        .then(() => {
          if(!window.UnicornStudio?.addScene) throw new Error('UnicornStudio.addScene not found');
        }).catch(error => {
          sdkPromise = null;
          sdkPromiseUrl = '';
          throw error;
        });
      return sdkPromise;
    }

    function initFrame(frame){
      const scene = frame.querySelector('.bt-unicorn-scene');
      const sourceKey = getFrameSourceKey(frame);
      if(frame.dataset.unicornReady && frame.dataset.unicornActiveSource !== sourceKey) resetFrame(frame);
      if(!scene || frame.dataset.unicornReady) return;
      const elementId = scene.id || `unicorn-${Math.random().toString(36).slice(2, 11)}`;
      scene.id = elementId;
      frame.dataset.unicornReady = 'true';
      frame.dataset.unicornActiveSource = sourceKey;
      // dpi 按实际显示尺寸自适应:deck 缩放 0.7 时无需按全尺寸 1.5x 超采样渲染,
      // GPU 像素量随窗口缩放线性下降(unicorn 页「进入即卡」的主要来源)。
      const declaredDpi = Number(frame.dataset.unicornDpi || 1.5);
      const deckScale = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--deck-scale')) || 1;
      const adaptiveDpi = Math.max(0.75, Math.min(declaredDpi, (window.devicePixelRatio || 1) * deckScale));
      const config = {
        elementId,
        scale: Number(frame.dataset.unicornScale || 1),
        dpi: adaptiveDpi,
        fps: Number(frame.dataset.unicornFps || 30),
        lazyLoad: false,
        production: true,
        altText: 'Shader scene',
        ariaLabel: 'Shader scene',
      };
      if(frame.dataset.unicornJsonFilePath) config.filePath = resolveUnicornJsonFilePath(frame.dataset.unicornJsonFilePath);
      else config.projectId = frame.dataset.unicornProjectId;
      return window.UnicornStudio.addScene(config).then(sceneInstance => {
        frame.__unicornScene = sceneInstance;
      }).catch(error => {
        frame.removeAttribute('data-unicorn-ready');
        frame.removeAttribute('data-unicorn-active-source');
        console.warn('[unicorn] failed to initialize scene', error);
      });
    }

    function markFrameFallback(frame, reason){
      if(!frame) return;
      frame.dataset.unicornFallback = reason || 'runtime';
      frame.removeAttribute('data-unicorn-ready');
      frame.removeAttribute('data-unicorn-active-source');
    }

    function resetFrame(frame){
      if(!frame) return;
      frame.__unicornScene?.destroy?.();
      frame.__unicornScene = null;
      frame.removeAttribute('data-unicorn-ready');
      frame.removeAttribute('data-unicorn-active-source');
      frame.removeAttribute('data-unicorn-fallback');
      const scene = frame.querySelector('.bt-unicorn-scene');
      if(scene){
        scene.innerHTML = '';
        scene.removeAttribute('id');
      }
    }

    function getFrameSourceKey(frame){
      if(!frame) return '';
      if(frame.dataset.unicornJsonFilePath) return `file:${frame.dataset.unicornJsonFilePath}`;
      if(frame.dataset.unicornProjectId) return `project:${frame.dataset.unicornProjectId}`;
      return '';
    }

    function syncUnicornSceneActivity(activeSlide = getCurrentSlide()){
      document.querySelectorAll('.bt-unicorn-frame[data-unicorn-ready]').forEach(frame => {
        if(activeSlide && activeSlide.contains(frame)) return;
        resetFrame(frame);
      });
    }

    function resolveUnicornJsonFilePath(path){
      const source = getEmbeddedUnicornAssets()[path];
      if(!source) return path;
      if(embeddedAssetUrls.has(path)) return embeddedAssetUrls.get(path);
      const url = URL.createObjectURL(new Blob([source], {type:'application/json'}));
      embeddedAssetUrls.set(path, url);
      return url;
    }

    function getEmbeddedUnicornAssets(){
      if(embeddedAssetMap) return embeddedAssetMap;
      const script = document.getElementById('embedded-unicorn-assets');
      if(!script){
        embeddedAssetMap = {};
        return embeddedAssetMap;
      }
      try {
        embeddedAssetMap = JSON.parse(script.textContent || '{}') || {};
      } catch {
        embeddedAssetMap = {};
      }
      return embeddedAssetMap;
    }

    addEventListener('pagehide', () => {
      embeddedAssetUrls.forEach(url => URL.revokeObjectURL(url));
      embeddedAssetUrls.clear();
    });
  }


	  function captureSlideImage(slideEl, options){
	    const image = window.htmlToImage.toPng(slideEl, withSlideCaptureFilter(options));
	    const timeout = new Promise((_, reject) => {
	      setTimeout(() => reject(new Error('Slide image capture timed out')), 20000);
	    });
	    return Promise.race([image, timeout]);
	  }

  const slideCaptureIgnoredTags = new Set(['STYLE', 'SCRIPT', 'NOSCRIPT', 'TEMPLATE']);

  function withSlideCaptureFilter(options = {}){
    const customFilter = options.filter;
    return {
      ...options,
      filter(node){
        if(typeof customFilter === 'function' && !customFilter(node)) return false;
        if(node?.nodeType === 1 && node.tagName === 'IMG' && !(node.currentSrc || node.getAttribute('src'))) return false;
        if(node?.nodeType === 1 && node.tagName === 'VIDEO' && !(node.currentSrc || node.getAttribute('src') || node.querySelector('source[src]'))) return false;
        let current = node?.nodeType === 1 ? node : node?.parentNode;
        while(current){
          if(current.nodeType === 1 && slideCaptureIgnoredTags.has(current.tagName)) return false;
          current = current.parentNode;
        }
        return true;
      },
    };
  }

  async function waitForExportFonts(){
    if(!document.fonts?.ready) return;
    await Promise.race([
      document.fonts.ready.catch(() => {}),
      new Promise(resolve => setTimeout(resolve, 2500)),
    ]);
  }

  async function waitForSlideCaptureReady(slide){
    if(document.fonts?.ready) await document.fonts.ready.catch(() => {});
    const images = [...(slide?.querySelectorAll?.('img') || [])].filter(img => !img.complete);
    await Promise.race([
      Promise.all(images.map(img => new Promise(resolve => {
        img.addEventListener('load', resolve, {once:true});
        img.addEventListener('error', resolve, {once:true});
      }))),
      new Promise(resolve => setTimeout(resolve, 1800)),
    ]);
    slide?.querySelectorAll?.('video').forEach(video => {
      if(video.readyState < 2) video.load?.();
    });
    await nextFrame();
    finishSlideCaptureMotion(slide);
    await nextFrame();
    await nextFrame();
  }

  function runBrowserPrint(){
    const printWindow = arguments[0] || window;
    return new Promise(resolve => {
      let done = false;
      let timer = null;
      const finish = () => {
        if(done) return;
        done = true;
        clearTimeout(timer);
        printWindow.removeEventListener?.('afterprint', finish);
        resolve();
      };
      printWindow.addEventListener?.('afterprint', finish, {once:true});
      timer = setTimeout(finish, 15000);
      printWindow.focus?.();
      if(printWindow === window) window.print();
      else printWindow.print();
    });
  }

  function finishSlideCaptureMotion(slide){
    if(!slide?.getAnimations) return;
    slide.getAnimations({subtree:true}).forEach(animation => {
      const timing = animation.effect?.getComputedTiming?.();
      const endTime = Number(timing?.endTime);
      if(!Number.isFinite(endTime) || endTime <= 0) return;
      try { animation.finish(); } catch {}
    });
  }

  const retainedDownloadUrls = [];
  window.addEventListener('pagehide', releaseRetainedDownloadUrls);
  window.addEventListener('beforeunload', releaseRetainedDownloadUrls);

	  function downloadBlob(blob, filename){
	    const type = blob.type || getDownloadMime(filename);
	    const file = typeof File === 'function'
	      ? new File([blob], filename, {type})
	      : new Blob([blob], {type});
	    const url = URL.createObjectURL(file);
	    retainedDownloadUrls.push(url);
	    const link = document.createElement('a');
	    link.href = url;
	    link.download = filename;
	    link.rel = 'noopener';
	    link.style.display = 'none';
	    document.body.appendChild(link);
	    return new Promise(resolve => {
	      setTimeout(() => {
	        link.click();
	        setTimeout(() => link.remove(), 1000);
	        resolve();
	      }, 0);
	    });
	  }

  function releaseRetainedDownloadUrls(){
    while(retainedDownloadUrls.length){
      URL.revokeObjectURL(retainedDownloadUrls.pop());
    }
  }

  function getDownloadMime(filename){
    const lower = String(filename || '').toLowerCase();
    if(lower.endsWith('.pptx')) return 'application/vnd.openxmlformats-officedocument.presentationml.presentation';
    if(lower.endsWith('.html') || lower.endsWith('.htm')) return 'text/html;charset=utf-8';
    if(lower.endsWith('.pdf')) return 'application/pdf';
    return 'application/octet-stream';
  }

	  function beginDeckExport(label){
	    window.__deckExportLocked = true;
	    document.body.classList.add('exporting-deck');
	    const overlay = document.createElement('div');
	    overlay.className = 'deck-export-overlay';
	    overlay.__deckExportCancelled = false;
	    overlay.innerHTML = `
	      <div class="deck-export-card" role="status" aria-live="polite">
	        <div class="deck-export-title">${window.__deckI18n.ui('{label} 导出中', {label: label})}</div>
	        <div class="deck-export-detail">${window.__deckI18n.ui('准备中...')}</div>
	        <div class="deck-export-bar"><div class="deck-export-fill"></div></div>
	        <div class="deck-export-actions"><button class="deck-export-cancel" type="button">${window.__deckI18n.ui('取消')}</button></div>
	      </div>`;
	    overlay.querySelector('.deck-export-cancel')?.addEventListener('click', event => {
	      event.preventDefault();
	      event.stopPropagation();
	      requestDeckExportCancel(overlay);
	    });
	    overlay.addEventListener('mousedown', event => event.preventDefault());
	    overlay.addEventListener('click', event => event.preventDefault());
	    document.body.appendChild(overlay);
	    return overlay;
	  }

  function updateDeckExport(overlay, current, total, detail){
    if(!overlay) return;
    const pct = total > 0 ? Math.min(100, Math.max(0, Math.round((current / total) * 100))) : 0;
    const text = detail || window.__deckI18n.ui('导出进度 {pct}%', {pct: pct});
    overlay.querySelector('.deck-export-detail').textContent = `${text} · ${pct}%`;
	    overlay.querySelector('.deck-export-fill').style.width = pct + '%';
	  }

  function requestDeckExportCancel(overlay){
    if(!overlay || overlay.__deckExportCancelled) return;
    overlay.__deckExportCancelled = true;
    const cancel = overlay.querySelector('.deck-export-cancel');
    if(cancel){
      cancel.disabled = true;
      cancel.textContent = window.__deckI18n.ui('正在取消...');
    }
    const detail = overlay.querySelector('.deck-export-detail');
    if(detail) detail.textContent = window.__deckI18n.ui('正在取消，正在恢复页面状态...');
  }

  function throwIfDeckExportCancelled(overlay){
    if(!overlay?.__deckExportCancelled) return;
    const error = new Error('Deck export cancelled');
    error.name = 'DeckExportCancelled';
    throw error;
  }

  function isDeckExportCancelledError(error){
    return error?.name === 'DeckExportCancelled';
  }

	  function endDeckExport(overlay){
	    window.__deckExportLocked = false;
	    document.body.classList.remove('exporting-deck');
    overlay?.remove();
  }


  function loadExportScript(src, isReady){
    if(isReady()) return Promise.resolve();
    return new Promise((resolve, reject) => {
      const existing = [...document.scripts].find(script => script.getAttribute('src') === src);
      const script = existing || document.createElement('script');
      const done = () => isReady() ? resolve() : reject(new Error(`${src} did not expose its browser API`));
      script.addEventListener('load', done, {once:true});
      script.addEventListener('error', () => reject(new Error(`${src} failed to load`)), {once:true});
      if(existing) setTimeout(done, 0);
      else {
        script.src = src;
        script.async = true;
        document.head.appendChild(script);
      }
    });
  }

  function restorePptxExportState(state){
    if(!state) return;
    go(state.index, {animate:false, force:true});
    setDeckMode(state.mode === 'present' ? 'present' : 'edit');
    if(window.__setEditorPanelsCollapsed) window.__setEditorPanelsCollapsed(Boolean(state.panelsCollapsed));
    else document.body.classList.toggle('editor-panels-collapsed', Boolean(state.panelsCollapsed));
    if(!state.panelsCollapsed){
      document.body.classList.toggle('preview-panel-open', state.panelOpen);
    }
    window.__layoutDeck?.();
  }

  function getCaptureBackground(slide){
    const value = getComputedStyle(slide).backgroundColor;
    return value && value !== 'rgba(0, 0, 0, 0)' ? value : getComputedStyle(document.documentElement).getPropertyValue('--paper').trim() || '#fff';
  }

	  function nextFrame(){
	    return new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
	  }

	  async function waitForUnicornFrames(scope=document, timeout=6000){
	    const start = performance.now();
	    do {
	      await nextFrame();
	      const loading = scope.querySelector?.('[data-unicorn-loading="true"]');
	      const frames = [...(scope.querySelectorAll?.('.bt-unicorn-frame[data-unicorn-json-file-path],.bt-unicorn-frame[data-unicorn-project-id]') || [])]
	        .filter(frame => !frame.closest('.bt-image-slot.has-user-image,.bt-image-slot.has-user-media'));
	      const ready = !frames.length || frames.every(frame => frame.dataset.unicornReady || frame.querySelector('canvas'));
	      if(!loading && ready) return;
	    } while(performance.now() - start < timeout);
	  }

  function getDeckFileName(){
    return (document.title || 'presentation')
      .replace(/[\\/:*?"<>|]+/g, '')
      .replace(/\s+/g, '-')
      .trim() || 'presentation';
  }

  // Export is HTTP-service only. Tell the user to use the preview server instead of
  // producing a lower-fidelity client-side file. Opening the deck from disk
  // (location.protocol === 'file:') cannot export editable PPTX.
  function isExportServiceContext(){
    return location.protocol === 'http:' || location.protocol === 'https:';
  }
  function deckLocalDirForPrompt(){
    try {
      let dir = decodeURIComponent(location.pathname || '');
      dir = dir.replace(/\/[^\/]*$/, '');
      // Windows 下 file:// 的 pathname 形如 /C:/...,去掉开头斜杠还原盘符路径。
      if(/^\/[A-Za-z]:\//.test(dir + '/')) dir = dir.slice(1);
      return dir || location.href;
    } catch { return location.href; }
  }
  async function copyPromptText(text, button){
    let copied = false;
    try { await navigator.clipboard.writeText(text); copied = true; } catch {}
    if(!copied){
      try {
        const area = document.createElement('textarea');
        area.value = text;
        area.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
        document.body.appendChild(area);
        area.select();
        copied = document.execCommand('copy');
        area.remove();
      } catch {}
    }
    if(button){
      const original = button.textContent;
      button.textContent = window.__deckI18n.ui(copied ? '已复制' : '复制失败');
      button.classList.toggle('copied', copied);
      setTimeout(() => { button.textContent = original; button.classList.remove('copied'); }, 1600);
    }
    return copied;
  }
  // mode: 'file' = file:// 直接打开;'no-service' = 地址是 HTTP 但背后没有导出服务
  // (常见于 Agent 随手起的通用静态服务器如 `python3 -m http.server`,POST 一律 501,
  // 或预览服务进程已退出)。两种场景都引导用户把提示词发给 AI 走正确的预览/导出流程。
  const EXPORT_GUIDE_COPY = {
    file: {
      title: window.__deckI18n.ui('当前非 HTTP 模式,无法导出'),
      desc: window.__deckI18n.ui('直接打开本地 HTML 文件时没有导出服务。把下面的提示词发给 AI,让它用 Dashi PPT 的预览服务打开后再导出:'),
      startLabel: window.__deckI18n.ui('发送给 AI,启动预览服务:'),
      // 提示词必须指名 dashi-ppt 的预览服务:只说"启动 http 服务"会诱导 AI 用
      // python -m http.server 等静态服务器,那正是 no-service 场景的事故根源。
      startPrompt: () => window.__deckI18n.ui('帮我用 dashi-ppt 的预览服务启动这个 PPT 的预览 {dir}', {dir: deckLocalDirForPrompt()}),
    },
    'no-service': {
      title: window.__deckI18n.ui('当前服务不支持导出'),
      desc: window.__deckI18n.ui('这个地址后面没有可用的导出服务(可能是一个纯静态文件服务器,或预览服务已退出)。把下面的提示词发给 AI,让它用 Dashi PPT 自带的预览服务重新启动:'),
      startLabel: window.__deckI18n.ui('发送给 AI,重启预览服务:'),
      startPrompt: () => window.__deckI18n.ui('帮我用 dashi-ppt 的预览服务重新启动这个 PPT 的预览'),
    },
  };
  function showExportServiceRequired(mode){
    const copy = EXPORT_GUIDE_COPY[mode] || EXPORT_GUIDE_COPY.file;
    let modal = document.getElementById('export-http-modal');
    if(!modal){
      modal = document.createElement('div');
      modal.id = 'export-http-modal';
      modal.innerHTML = `
        <div class="ehm-card" role="dialog" aria-modal="true" aria-label="导出需要预览服务">
          <button class="ehm-close" type="button" aria-label="关闭">×</button>
          <p class="ehm-title"></p>
          <p class="ehm-desc"></p>
          <div class="ehm-label" data-label="start"></div>
          <div class="ehm-prompt"><code data-prompt="start"></code><button class="ehm-copy" type="button" data-copy="start">复制</button></div>
          <div class="ehm-label">也可以直接跟 AI 说:</div>
          <div class="ehm-prompt"><code data-prompt="export"></code><button class="ehm-copy" type="button" data-copy="export">复制</button></div>
          <p class="ehm-desc" data-manual-cmd style="margin:14px 0 0"></p>
        </div>`;
      window.__deckI18n.translateStaticDom(modal);
      modal.addEventListener('click', event => {
        const copyKey = event.target?.dataset?.copy;
        if(copyKey) { copyPromptText(modal.querySelector(`[data-prompt="${copyKey}"]`)?.textContent || '', event.target); return; }
        if(event.target === modal || event.target.closest('.ehm-close')) modal.classList.remove('open');
      });
      document.addEventListener('keydown', event => {
        if(event.key === 'Escape') modal.classList.remove('open');
      });
      document.body.appendChild(modal);
    }
    modal.querySelector('.ehm-title').textContent = copy.title;
    modal.querySelector('.ehm-desc').textContent = copy.desc;
    modal.querySelector('[data-label="start"]').textContent = copy.startLabel;
    modal.querySelector('[data-prompt="start"]').textContent = copy.startPrompt();
    modal.querySelector('[data-prompt="export"]').textContent = window.__deckI18n.ui('帮我导出PPTX');
    modal.querySelector('[data-manual-cmd]').textContent = window.__deckI18n.ui('手动方式:在终端运行 npm --prefix <skill-root>/project run preview:start -- <输出 ppt 目录> <port>,再用它输出的 http://127.0.0.1:<port>/ 打开导出。');
    modal.classList.add('open');
  }

  staticUnicornRuntime();
})();

</script>
<script>
/* =============== Text State =============== */
(function(){
  const deck = document.getElementById('deck');
  if(!deck) return;
  const stateEl = document.getElementById('embedded-text-state');
  const textState = readTextState();
  const defaultTextState = window.__deckDefaultTextState || {};
  const textCounters = new Map();
  const renderedTextBaselines = new WeakMap();

  window.__deckDefaultTextState = defaultTextState;
  window.__getDeckDefaultTextState = () => ({...defaultTextState});
  window.__initEditableText = scope => applyTextState(scope);
  window.__setEditableTextMode = (on, scope = deck) => syncEditableMode(scope, on);
  window.__flushEditableTextState = flushTextState;
  window.__replaceEditableTextState = state => {
    Object.keys(textState).forEach(key => delete textState[key]);
    Object.assign(textState, state || {});
    writeTextState();
  };
  applyTextState(deck);
  deck.addEventListener('pointerdown', handleEditablePointerDown, true);
  deck.addEventListener('focusin', handleFocusIn, true);
  deck.addEventListener('input', handleInput, true);
  deck.addEventListener('blur', handleBlur, true);

  function applyTextState(scope = deck){
    prepareTextElements(scope);
    syncEditableMode(scope);
  }

  function prepareTextElements(scope = deck){
    const root = scope instanceof Element ? scope : deck;
    resetTextCounters(root);
    const claimedTextIds = new Set();
    const candidates = [
      ...(isTextCandidate(root) ? [root] : []),
      ...root.querySelectorAll('*'),
    ];
    candidates.forEach(el => {
      if(el !== root && !root.contains(el)) return;
      if(el !== root && el.parentElement?.closest('[data-editable-id]')) return;
      if(!el.dataset.editableId && !isTextCandidate(el)) return;

  function nextTextId(el){

    const path = el.dataset.editablePath;

  function getTextSlideKey(slide){
    return slide?.dataset.vmSlideKey || slide?.dataset.vmLayout || slide?.dataset.vmSlideId || 'deck';
  }

  function readTextState(){
    try {
      return JSON.parse(stateEl?.textContent || '{}') || {};
    } catch {
      return {};
    }
  }

  function isTextCandidate(el){
    if(!(el instanceof HTMLElement)) return false;
    if(el.hasAttribute('data-editable-skip')) return false;
    if(el.closest('[data-dashi-page-number]')) return false;
    if(el.parentElement?.closest('[data-editable-id]')) return false;
    if(window.__isDeckFileSlotTarget?.(el) || el.closest('#nav,#deck-page-pager,#preview-panel,#preview-panel-collapse')) return false;
    if(['SCRIPT','STYLE','CANVAS','SVG','PATH','BUTTON','INPUT','SELECT','TEXTAREA','VIDEO','IMG'].includes(el.tagName)) return false;
    if(!el.textContent?.trim()) return false;
    return [...el.children].every(child => ['BR','SPAN','B','I','EM','STRONG','SMALL'].includes(child.tagName));
  }
})();

		      gsap.set(slices, {autoAlpha:1, xPercent:config.orientation === 'horizontal' ? showFrom : 0, yPercent:config.orientation === 'vertical' ? showFrom : 0});

		          xPercent:0,
		          yPercent:0,
			          duration:config.showDuration,
			          ease:'power4.inOut',
			          stagger:index => sliceStagger(index, config.count, config.stagger, ctx.direction, false),
			        }, 0)
		        .set(ctx.current, {autoAlpha:0}, coverEndAt)
		        .set(ctx.next, {zIndex:2}, coverEndAt)
		        .to(slices, {
		          xPercent:config.orientation === 'horizontal' ? hideTo : 0,
		          yPercent:config.orientation === 'vertical' ? hideTo : 0,
			          duration:config.hideDuration,
			          ease:'power4.inOut',
			          stagger:index => sliceStagger(index, config.count, config.stagger, ctx.direction, true),
			        }, uncoverAt)
		        .add(ctx.startTargetEnter, uncoverAt);
		    }, opts);
		  }
		  function playContainerMotion(ctx, opts, variant){
		    ctx.stage.dataset.transitionReference = 'blenkcode/codrops-demo';
		    ctx.stage.dataset.transitionVariant = variant;
		    const currentContainer = document.createElement('div');
		    const nextContainer = document.createElement('div');
		    currentContainer.className = 'page-transition-container';
		    nextContainer.className = 'page-transition-container';
		    currentContainer.dataset.containerRole = 'current';
		    nextContainer.dataset.containerRole = 'next';
			    currentContainer.dataset.containerTransition = 'true';
			    nextContainer.dataset.containerTransition = 'true';
			    currentContainer.dataset.containerVariant = variant;
			    nextContainer.dataset.containerVariant = variant;
			    currentContainer.appendChild(ctx.current);
			    nextContainer.appendChild(ctx.next);
			    ctx.stage.append(currentContainer, nextContainer);
			    return playTimeline(ctx, tl => {
			      if(variant === 'alternative-slide'){
			        const startSide = ctx.direction > 0 ? 'right' : 'left';
			        nextContainer.dataset.containerDirectionStart = startSide;
			        currentContainer.dataset.containerDirectionStart = startSide;
			        gsap.set(currentContainer, {zIndex:1, opacity:1, scale:1, x:'0%', force3D:true});
			        gsap.set(nextContainer, {zIndex:2, opacity:1, x:`${100 * ctx.direction}%`, force3D:true});
			        gsap.set(ctx.next, {autoAlpha:1});
			        tl.to(currentContainer, {x:`${-50 * ctx.direction}%`, scale:.8, duration:1.05, ease:'power4.inOut', force3D:true}, 0)
			          .to(currentContainer, {opacity:.38, duration:1.05, ease:'none'}, 0)
			          .to(nextContainer, {x:'0%', duration:1.05, ease:'power4.inOut', force3D:true}, 0)
			          .add(ctx.startTargetEnter, .5);
			        return;
			      }
			      const clipStart = ctx.direction > 0 ? 'top' : 'bottom';
			      const startClipPath = ctx.direction > 0 ? 'inset(100% 0% 0% 0%)' : 'inset(0% 0% 100% 0%)';
			      currentContainer.dataset.containerDirectionStart = ctx.direction > 0 ? 'up' : 'down';
			      nextContainer.dataset.containerDirectionStart = ctx.direction > 0 ? 'up' : 'down';
			      currentContainer.dataset.containerClipStart = clipStart;
			      nextContainer.dataset.containerClipStart = clipStart;
			      gsap.set(currentContainer, {zIndex:1, opacity:1, scale:1, y:'0%', force3D:true});
			      gsap.set(nextContainer, {zIndex:2, opacity:1, clipPath:startClipPath, force3D:true});
			      gsap.set(ctx.next, {autoAlpha:1, scale:1.04});
			      tl.to(currentContainer, {y:`${-30 * ctx.direction}%`, scale:.8, opacity:.4, duration:.86, ease:'power4.inOut', force3D:true}, 0)
			        .to(nextContainer, {clipPath:'inset(0% 0% 0% 0%)', duration:.86, ease:'power4.inOut', force3D:true}, 0)
		        .to(ctx.next, {scale:1, duration:.86, ease:'power3.out'}, 0)
		        .add(ctx.startTargetEnter, .42);
		    }, opts);
		  }
		  function pixelScaleVars(axis, from, to){
		    if(axis === 'scaleX') return {scaleX:to, scaleY:1};
		    if(axis === 'scaleY') return {scaleY:to, scaleX:1};
		    return {scale:to};
		  }
		  function resolveConfigValue(value, ctx){
		    return typeof value === 'function' ? value(ctx) : value;
		  }
		  function resolveNumber(value, fallback){
		    return value == null ? fallback : value;
		  }
		  function transitionBlockColor(mode, fallback){
		    const color = window.__getPageTransitionColor?.(mode) || fallback || '#000000';
		    return /^#[0-9a-f]{6}$/i.test(color) ? color : fallback || '#000000';
		  }
		  function firstPixelIndex(cells, rows, cols, mode, direction){
		    let bestIndex = 0;
		    let bestValue = Infinity;
		    cells.forEach((cell, index) => {
		      const row = Number(cell.dataset.pixelRow || 0);
		      const col = Number(cell.dataset.pixelColumn || 0);
		      const value = pixelOrderBase(row, col, rows, cols, mode, direction);
		      if(value < bestValue){
		        bestValue = value;
		        bestIndex = index;
		      }
		    });
		    return bestIndex;
		  }
		  function maxPixelStagger(cells, rows, cols, mode, direction, reverse){
		    return cells.reduce((max, cell, index) => Math.max(max, pixelStagger(index, cells, rows, cols, mode, direction, reverse)), 0);
		  }
		  function pixelStagger(index, cells, rows, cols, mode, direction, reverse){
		    const cell = cells[index];
		    const row = Number(cell.dataset.pixelRow || 0);
		    const col = Number(cell.dataset.pixelColumn || 0);
		    let base = pixelOrderBase(row, col, rows, cols, mode, direction);
		    if(mode === 'row-random') base += ((row * 17 + col * 13) % 6) * .8;
		    if(reverse) base = rows + cols - base;
		    const factor = mode === 'center-fast' ? .008 : .012;
		    return Math.max(0, base * factor);
		  }
		  function pixelOrderBase(row, col, rows, cols, mode, direction){
		    let base = row + col * .3;
		    if(mode === 'center' || mode === 'center-fast'){
		      base = Math.abs(row - (rows - 1) / 2) + Math.abs(col - (cols - 1) / 2);
		      if(direction < 0) base = rows + cols - base;
		    } else if(mode === 'rows'){
		      base = direction > 0 ? row : rows - row - 1;
		    } else if(mode === 'columns'){
		      base = direction > 0 ? col : cols - col - 1;
		    } else if(mode === 'row-random'){
		      base = direction > 0 ? row : rows - row - 1;
		    }
		    return base;
		  }
		  function sliceOriginForDirection(orientation, origin, direction){
		    if(direction > 0) return origin;
		    if(orientation === 'vertical') return origin === 'top' ? 'bottom' : 'top';
		    return origin === 'left' ? 'right' : 'left';
		  }
		  function sliceOriginOffset(orientation, origin){
		    if(orientation === 'vertical') return origin === 'top' ? -105 : 105;
		    return origin === 'left' ? -105 : 105;
		  }
		  function firstSliceIndex(count, mode, direction){
		    let bestIndex = 0;
		    let bestValue = Infinity;
		    for(let index=0; index<count; index+=1){
		      const value = sliceOrderBase(index, count, mode, direction);
		      if(value < bestValue){
		        bestValue = value;
		        bestIndex = index;
		      }
		    }
		    return bestIndex;
		  }
		  function maxSliceStagger(count, mode, direction, reverse){
		    let max = 0;
		    for(let index=0; index<count; index+=1) max = Math.max(max, sliceStagger(index, count, mode, direction, reverse));
		    return max;
		  }
		  function sliceStagger(index, count, mode, direction, reverse){
		    let order = sliceOrderBase(index, count, mode, direction);
		    if(reverse) order = count - order - 1;
		    return Math.max(0, order * .045);
		  }
		  function sliceOrderBase(index, count, mode, direction){
		    if(mode === 'center'){
		      const distance = Math.abs((count - 1) / 2 - index);
		      return direction > 0 ? distance : count / 2 - distance;
		    }
		    return direction > 0 ? index : count - index - 1;
		  }
})();
</script>
<script>
/* =============== Quiet topbar · 语言切换 =============== */
(function(){
  const btn=document.getElementById('preview-lang-toggle');
  const i18n=window.__deckI18n;
  if(!btn||!i18n) return;
  // 按钮显示目标语言(点击后切到的那种),title 用目标语言书写给目标用户看。
  btn.textContent=i18n.isEn?'中':'EN';
  const hint=i18n.isEn?'切换到中文':'Switch to English';
  btn.setAttribute('title',hint);
  btn.setAttribute('aria-label',hint);
  btn.addEventListener('click',()=>i18n.setLanguage(i18n.isEn?'zh':'en'));
})();
</script>
<script>
/* =============== Quiet topbar · 明暗切换 =============== */
(function(){
  const btn=document.getElementById('preview-theme-toggle');
  if(!btn) return;
  const KEY='dashi-pp-chrome-theme';
  const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>';
  const systemDark=()=>matchMedia('(prefers-color-scheme:dark)').matches;
  const current=()=>{const a=document.documentElement.getAttribute('data-pp-theme');return a==='dark'||a==='light'?a:(systemDark()?'dark':'light');};
  function paintIcon(theme){btn.innerHTML=theme==='dark'?SUN:MOON;btn.setAttribute('title',window.__deckI18n.ui(theme==='dark'?'切换到明亮':'切换到暗色'));}
  function apply(theme){document.documentElement.setAttribute('data-pp-theme',theme);paintIcon(theme);try{localStorage.setItem(KEY,theme);}catch{}}
  let saved;try{saved=localStorage.getItem(KEY);}catch{}
  if(saved==='dark'||saved==='light') apply(saved); else paintIcon(current());
  btn.addEventListener('click',()=>apply(current()==='dark'?'light':'dark'));
})();
</script>
<script>
if(parent!==window){
document.addEventListener('keydown', e=>{if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();parent.postMessage({type:'yebisu-close'},location.origin)}},true);
window.addEventListener('message', e=>{if(e.source!==parent||e.origin!==location.origin||e.data?.type!=='yebisu-slide')return;const n=e.data.index; if(!Number.isInteger(n))return;window.go(n,{animate:false,force:true});});
const pager=document.getElementById('deck-page-count');
const report=()=>{const n=parseInt(pager?.textContent,10)-1;if(Number.isInteger(n))parent.postMessage({type:'yebisu-page',index:n},location.origin)};
if(pager)new MutationObserver(report).observe(pager,{childList:true,subtree:true,characterData:true});
report();
}
</script></body>
