<!doctype html><html lang="ja"><meta charset="utf-8"><title>週末の汐見港町 · 変換後PowerPoint</title><style>html,body{margin:0;height:100%;background:#111}img{width:100%;height:100%;object-fit:contain}</style><img alt="変換後PowerPointの実描画"><script>let n=0;function go(i){if(!Number.isInteger(i)||i<0||i>=7)return;n=i;document.querySelector('img').src='render/slide-'+String(i+1).padStart(2,'0')+'.png';if(parent!==window)parent.postMessage({type:'yebisu-page',index:i,total:7},location.origin)}addEventListener('message',e=>{if(e.source===parent&&e.origin===location.origin&&e.data?.type==='yebisu-slide')go(e.data.index)});addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(n+1);if(e.key==='ArrowLeft')go(n-1);if(e.key==='Escape'&&parent!==window)parent.postMessage({type:'yebisu-close'},location.origin)});go(0)</script></html>
