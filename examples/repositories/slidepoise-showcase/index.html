<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>クリックを減らす、予約の流れ。</title><style>body{margin:0;background:#112132;height:100vh;display:grid;place-items:center}img{width:min(100vw,177.777vh);aspect-ratio:16/9;object-fit:contain}nav{position:fixed;bottom:12px;right:16px;background:#246AF1;color:white;display:flex;align-items:center;gap:14px;padding:9px;font-family:sans-serif}button{font:inherit;background:none;border:1px solid white;color:white;padding:8px 15px}.embed nav{display:none}</style><img id="slide" src="render/slide-01.png" alt="迷う操作を、半分に。"><nav aria-label="スライド操作"><button id="prev">戻る</button><span id="counter">1 / 3</span><button id="next">進む</button></nav><script>const titles=["迷う操作を、半分に。", "分岐は、空席で決まる。", "目標を決めて、順に直す。"];let n=0;function show(i){n=Math.max(0,Math.min(2,i));document.querySelector('#slide').src='render/slide-'+String(n+1).padStart(2,'0')+'.png';document.querySelector('#slide').alt=titles[n];document.querySelector('#counter').textContent=(n+1)+' / 3';if(parent!==window)parent.postMessage({type:'yebisu-page',index:n,total:3},location.origin)}document.querySelector('#prev').onclick=()=>show(n-1);document.querySelector('#next').onclick=()=>show(n+1);addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(n+1);if(e.key==='ArrowLeft')show(n-1)});addEventListener('message',e=>{if(e.source===parent&&e.origin===location.origin&&e.data?.type==='yebisu-slide'&&Number.isInteger(e.data.index))show(e.data.index)});if(parent!==window)document.body.classList.add('embed');show(0)</script></html>
