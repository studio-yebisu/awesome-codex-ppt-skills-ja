<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>日本語実行例</title><style>html,body{margin:0;background:#161b22;color:white;height:100%;font:16px sans-serif}main{height:calc(100% - 48px);display:flex;align-items:center;justify-content:center}img{max-width:100%;max-height:100%;object-fit:contain}nav{text-align:center;height:40px}button{padding:6px 18px;margin:4px}a{color:#b4dfff}</style><main><img id="page" alt="スライド"></main><nav><button id="prev">前へ</button><span id="count"></span><button id="next">次へ</button><a href="deck.pptx">PPTX</a> <a href="render/deck.pdf">PDF</a></nav><script>let current=0;function show(i){current=Math.max(0,Math.min(5,i));document.getElementById('page').src='render/slide-'+String(current+1).padStart(2,'0')+'.png';document.getElementById('count').textContent=(current+1)+' / 6';if(parent!==window)parent.postMessage({type:'yebisu-page',index:current},location.origin)}document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1)});window.addEventListener('message',e=>{if(e.source===parent&&e.origin===location.origin&&e.data?.type==='yebisu-slide'&&Number.isInteger(e.data.index))show(e.data.index)});show(0);</script></html>
