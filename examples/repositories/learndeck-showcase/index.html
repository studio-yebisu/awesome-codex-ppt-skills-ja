<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>花を、一本から。</title><style>*{box-sizing:border-box}body{margin:0;background:#211F1B;display:grid;place-items:center;height:100vh}.stage{width:min(100vw,177.777vh);aspect-ratio:16/9;position:relative}img{width:100%;height:100%;object-fit:contain}nav{position:fixed;bottom:12px;right:16px;display:flex;gap:12px;align-items:center;background:#211F1B;color:#F2EBD9;padding:8px 15px;font-family:sans-serif}button{font:inherit;background:transparent;border:1px solid #F2EBD9;color:#F2EBD9;padding:7px 14px}span{font-size:15px}.embed nav{display:none}</style><div class="stage"><img id="slide" src="render/slide-01.png" alt="花を、一本から。"></div><nav aria-label="スライド操作"><button id="previous">戻る</button><span id="count">1 / 5</span><button id="next">進む</button></nav><script>const titles=["花を、一本から。", "一本なら、置く場所を選べる。", "選ぶ。届く。飾る。", "束にする日も、休む日も。", "次の一輪を、楽しみにする。"];let n=0;function show(i){n=Math.max(0,Math.min(4,i));document.querySelector('#slide').src='render/slide-'+String(n+1).padStart(2,'0')+'.png';document.querySelector('#slide').alt=titles[n];document.querySelector('#count').textContent=(n+1)+' / 5';if(parent!==window)parent.postMessage({type:'yebisu-page',index:n,total:5},location.origin)}document.querySelector('#previous').onclick=()=>show(n-1);document.querySelector('#next').onclick=()=>show(n+1);addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(n+1);if(e.key==='ArrowLeft')show(n-1);if(e.key==='Home')show(0);if(e.key==='End')show(4)});addEventListener('message',e=>{if(e.source===parent&&e.origin===location.origin&&e.data?.type==='yebisu-slide'&&Number.isInteger(e.data.index))show(e.data.index)});if(parent!==window)document.body.classList.add('embed');show(0)</script></html>
