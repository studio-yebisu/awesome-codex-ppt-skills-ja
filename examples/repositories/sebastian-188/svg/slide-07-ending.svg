<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"/><text x="100" y="90" style="font-family:Microsoft YaHei,Noto Sans CJK JP,SimHei,PingFang SC,sans-serif;font-size:24px;font-weight:700;" fill="#000000">06 / A COMPLETE REQUEST</text><text x="1710" y="1016" style="font-family:Microsoft YaHei,Noto Sans CJK JP,SimHei,PingFang SC,sans-serif;font-size:24px;font-weight:700;" fill="#000000">07 / 07</text><rect x="0" y="0" width="510" height="1080" fill="#E2001A"/><text x="100" y="295" style="font-family:Microsoft YaHei,Noto Sans CJK JP,SimHei,PingFang SC,sans-serif;font-size:94px;font-weight:900;" fill="#FFFFFF">五つを、</text><text x="100" y="420" style="font-family:Microsoft YaHei,Noto Sans CJK JP,SimHei,PingFang SC,sans-serif;font-size:94px;font-weight:900;" fill="#FFFFFF">一つの</text><text x="100" y="545" style="font-family:Microsoft YaHei,Noto Sans CJK JP,SimHei,PingFang SC,sans-serif;font-size:94px;font-weight:900;" fill="#FFFFFF">依頼へ。</text><text x="100" y="880" style="font-family:Microsoft YaHei,Noto Sans CJK JP,SimHei,PingFang SC,sans-serif;font-size:27px;font-weight:700;" fill="#FFFFFF">COPY &amp; ADAPT</text><text x="620" y="150" style="font-family:Microsoft YaHei,Noto Sans CJK JP,SimHei,PingFang SC,sans-serif;font-size:68px;font-weight:900;" fill="#000000">招待メールの制作依頼</text><text x="620" y="280" style="font-family:Microsoft YaHei,Noto Sans CJK JP,SimHei,PingFang SC,sans-serif;font-size:28px;font-weight:700;" fill="#E2001A">目的</text><text x="620" y="330" style="font-family:Microsoft YaHei,Noto Sans CJK JP,SimHei,PingFang SC,sans-serif;font-size:36px;font-weight:400;" fill="#000000">来場候補日を返信してもらう。</text><line x1="620" y1="355" x2="1810" y2="355" stroke="#000000" stroke-width="2"/><text x="620" y="392" style="font-family:Microsoft YaHei,Noto Sans CJK JP,SimHei,PingFang SC,sans-serif;font-size:28px;font-weight:700;" fill="#E2001A">読み手</text><text x="620" y="442" style="font-family:Microsoft YaHei,Noto Sans CJK JP,SimHei,PingFang SC,sans-serif;font-size:36px;font-weight:400;" fill="#000000">初めて来る近隣の店舗担当者。</text><line x1="620" y1="467" x2="1810" y2="467" stroke="#000000" stroke-width="2"/><text x="620" y="504" style="font-family:Microsoft YaHei,Noto Sans CJK JP,SimHei,PingFang SC,sans-serif;font-size:28px;font-weight:700;" fill="#E2001A">入力</text><text x="620" y="554" style="font-family:Microsoft YaHei,Noto Sans CJK JP,SimHei,PingFang SC,sans-serif;font-size:36px;font-weight:400;" fill="#000000">添付の会期・会場・所要時間の一覧だけを使う。</text><line x1="620" y1="579" x2="1810" y2="579" stroke="#000000" stroke-width="2"/><text x="620" y="616" style="font-family:Microsoft YaHei,Noto Sans CJK JP,SimHei,PingFang SC,sans-serif;font-size:28px;font-weight:700;" fill="#E2001A">制約</text><text x="620" y="666" style="font-family:Microsoft YaHei,Noto Sans CJK JP,SimHei,PingFang SC,sans-serif;font-size:36px;font-weight:400;" fill="#000000">件名30字・本文300字以内。専門用語を避ける。</text><line x1="620" y1="691" x2="1810" y2="691" stroke="#000000" stroke-width="2"/><text x="620" y="728" style="font-family:Microsoft YaHei,Noto Sans CJK JP,SimHei,PingFang SC,sans-serif;font-size:28px;font-weight:700;" fill="#E2001A">完成条件</text><text x="620" y="778" style="font-family:Microsoft YaHei,Noto Sans CJK JP,SimHei,PingFang SC,sans-serif;font-size:36px;font-weight:400;" fill="#000000">必要情報を含め、不明点を末尾に別記する。</text><line x1="620" y1="803" x2="1810" y2="803" stroke="#000000" stroke-width="2"/><text x="620" y="920.0" style="font-family:Microsoft YaHei,Noto Sans CJK JP,SimHei,PingFang SC,sans-serif;font-size:32px;font-weight:700;" fill="#000000">まず一案を作成。送信はせず、レビュー用の文章で渡す。</text><text x="100" y="1016" style="font-family:Microsoft YaHei,Noto Sans CJK JP,SimHei,PingFang SC,sans-serif;font-size:20px;font-weight:400;" fill="#FFFFFF">架空例 / SVG ORIGINAL</text></svg>