<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"/><text x="100" y="90" style="font-family:Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif;font-size:24px;font-weight:700;" fill="#000000">05 / DEFINITION OF DONE</text><text x="100" y="1016" style="font-family:Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif;font-size:20px;font-weight:400;" fill="#000000">STUDIO YEBISU / FICTIONAL BRIEF EXAMPLES</text><text x="1710" y="1016" style="font-family:Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif;font-size:24px;font-weight:700;" fill="#000000">06 / 07</text><text x="100" y="240" style="font-family:Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif;font-size:88px;font-weight:900;" fill="#000000">完成は、確認できる言葉で。</text><text x="100" y="345" style="font-family:Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif;font-size:28px;font-weight:700;" fill="#E2001A">EXAMPLE A / 招待メールの受け取り条件</text><text x="100" y="650" style="font-family:Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif;font-size:290px;font-weight:900;" fill="#E2001A">3</text><text x="100" y="810" style="font-family:Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif;font-size:48px;font-weight:900;" fill="#000000">CHECKS</text><text x="650" y="470" style="font-family:Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif;font-size:42px;font-weight:700;" fill="#000000">必要な情報</text><text x="650" y="535" style="font-family:Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif;font-size:36px;font-weight:400;" fill="#000000">会期・会場・所要時間・返信先がある。</text><line x1="650" y1="575" x2="1810" y2="575" stroke="#000000" stroke-width="2"/><text x="650" y="620" style="font-family:Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif;font-size:42px;font-weight:700;" fill="#000000">文字量</text><text x="650" y="685" style="font-family:Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif;font-size:36px;font-weight:400;" fill="#000000">件名30字以内、本文300字以内。</text><line x1="650" y1="725" x2="1810" y2="725" stroke="#000000" stroke-width="2"/><text x="650" y="770" style="font-family:Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif;font-size:42px;font-weight:700;" fill="#000000">根拠と空欄</text><text x="650" y="835" style="font-family:Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif;font-size:36px;font-weight:400;" fill="#000000">入力にない事実を追加せず、不明は列挙。</text><line x1="650" y1="875" x2="1810" y2="875" stroke="#000000" stroke-width="2"/><text x="650" y="950" style="font-family:Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif;font-size:30px;font-weight:700;" fill="#000000">レビュー：送信前に日時・住所・返信先を人が確認する。</text></svg>