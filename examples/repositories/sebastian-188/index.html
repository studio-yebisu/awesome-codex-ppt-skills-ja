<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIに任せる前の設計図</title><style>body{margin:0;background:#111;color:white;font-family:Arial,sans-serif}main{height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center}img{width:min(100%,1600px);max-height:calc(100svh - 75px);object-fit:contain}nav{display:flex;gap:16px;align-items:center;padding:16px}button,a{color:white;background:transparent;border:1px solid #888;padding:8px 16px;text-decoration:none;font-size:16px}button:focus-visible,a:focus-visible{outline:3px solid #e2001a}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}</style><main><img id="page" alt=""><nav><button id="prev" aria-label="前のページ">←</button><span id="count"></span><button id="next" aria-label="次のページ">→</button><button id="play">再生</button><button id="full">全画面</button><a href="deck.pdf">PDF</a></nav></main><script>const pages=["svg/slide-01-cover.svg", "svg/slide-02-summary.svg", "svg/slide-03-contrast.svg", "svg/slide-04-input.svg", "svg/slide-05-constraints.svg", "svg/slide-06-checks.svg", "svg/slide-07-ending.svg"];let n=0,timer=null;function show(){document.querySelector('#page').src=pages[n];document.querySelector('#page').alt='AIに任せる前の設計図 '+(n+1)+'ページ';document.querySelector('#count').textContent=(n+1)+' / '+pages.length}function step(d){n=(n+d+pages.length)%pages.length;show()}document.querySelector('#prev').onclick=()=>step(-1);document.querySelector('#next').onclick=()=>step(1);document.querySelector('#play').onclick=()=>{if(timer){clearInterval(timer);timer=null}else{timer=setInterval(()=>step(1),5000)}document.querySelector('#play').textContent=timer?'停止':'再生'};document.querySelector('#full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.querySelector('main').requestFullscreen()};document.onkeydown=e=>{if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1);if(e.key==='Escape'&&timer){clearInterval(timer);timer=null;document.querySelector('#play').textContent='再生'}};show();</script></html>
