<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"><rect width="1280" height="720" fill="#FFFFFF"/><text x="40" y="24" text-anchor="start" font-family="Zen Kaku Gothic New" font-size="16" fill="#6E6E6E" letter-spacing="1">E-03</text><rect x="1188" y="16" width="9" height="9" fill="#3156C5"/><text x="1240" y="24" text-anchor="end" font-family="Zen Kaku Gothic New" font-size="16" fill="#151B1D" font-weight="600">MORNING / WORKSHOP</text><line x1="40" y1="32" x2="1240" y2="32" stroke="#151B1D" stroke-width="1"/><text x="40" y="78" text-anchor="start" font-family="Zen Kaku Gothic New" font-size="38" fill="#151B1D" font-weight="700">朝は一つ選んで、次を残す。</text><line x1="40" y1="94" x2="1240" y2="94" stroke="#151B1D" stroke-width="1"/><rect x="80.0" y="260" width="200" height="100" fill="#F1EACF" stroke="#9B9B9B" stroke-width="1.5"/><text x="180.0" y="296" text-anchor="middle" font-family="Zen Kaku Gothic New" font-size="16" fill="#151B1D" font-weight="700" letter-spacing="2">03 min</text><text x="180.0" y="326" text-anchor="middle" font-family="Zen Kaku Gothic New" font-size="16" fill="#151B1D" font-weight="700">一つ選ぶ</text><line x1="280.0" y1="310" x2="330.0" y2="310" stroke="#9B9B9B" stroke-width="2"/><polygon points="330,304 342,310 330,316" fill="#151B1D"/><rect x="342.0" y="260" width="200" height="100" fill="#F1EACF" stroke="#9B9B9B" stroke-width="1.5"/><text x="442.0" y="296" text-anchor="middle" font-family="Zen Kaku Gothic New" font-size="16" fill="#151B1D" font-weight="700" letter-spacing="2">10 min</text><text x="442.0" y="326" text-anchor="middle" font-family="Zen Kaku Gothic New" font-size="16" fill="#151B1D" font-weight="700">取り組む</text><line x1="542.0" y1="310" x2="592.0" y2="310" stroke="#9B9B9B" stroke-width="2"/><polygon points="592,304 604,310 592,316" fill="#151B1D"/><rect x="604.0" y="260" width="200" height="100" fill="#F1EACF" stroke="#9B9B9B" stroke-width="1.5"/><text x="704.0" y="296" text-anchor="middle" font-family="Zen Kaku Gothic New" font-size="16" fill="#151B1D" font-weight="700" letter-spacing="2">05 min</text><text x="704.0" y="326" text-anchor="middle" font-family="Zen Kaku Gothic New" font-size="16" fill="#151B1D" font-weight="700">メモする</text><line x1="804.0" y1="310" x2="854.0" y2="310" stroke="#9B9B9B" stroke-width="2"/><polygon points="854,304 866,310 854,316" fill="#151B1D"/><rect x="866" y="260" width="200" height="100" fill="#151B1D"/><text x="966.0" y="296" text-anchor="middle" font-family="Zen Kaku Gothic New" font-size="16" fill="#C4C4C4" font-weight="700" letter-spacing="2">02 min</text><text x="966.0" y="326" text-anchor="middle" font-family="Zen Kaku Gothic New" font-size="16" fill="#FFFFFF" font-weight="700">次を残す</text><text x="80" y="470" text-anchor="start" font-family="Zen Kaku Gothic New" font-size="39" fill="#151B1D" font-weight="700">20分の、サンプル行程。</text><text x="80" y="525" text-anchor="start" font-family="Zen Kaku Gothic New" font-size="23" fill="#6E6E6E">時間配分は目安。仕事内容に合わせて、長さと順番を変える。</text><line x1="80" y1="580" x2="1150" y2="580" stroke="#151B1D" stroke-width="1.5"/><text x="80" y="624" text-anchor="start" font-family="Zen Kaku Gothic New" font-size="19" fill="#6E6E6E">改善の実績を示す図ではありません。</text><line x1="40" y1="690" x2="1240" y2="690" stroke="#151B1D" stroke-width="1"/><text x="40" y="709" text-anchor="start" font-family="Zen Kaku Gothic New" font-size="16" fill="#6E6E6E">来源：架空企画 / 試行のための提案</text><text x="1240" y="709" text-anchor="end" font-family="Manrope" font-size="16" fill="#6E6E6E">2 / 4</text></svg>