<section class="slide " data-id="morning-4" data-transition="fade" data-stagger="cascade" data-bg="light" data-speaker-notes="夜は選ぶ・置く・詰める、朝は確認する役割に分けます。朝だけでなく、前夜に増えた準備時間も必ず記録し、合計負担が増えていないか確認します。"><div class="slide-content"><div class="stage"><h2>朝は、確認して出る。</h2><div class="compare"><div class="baseline"><p class="eyebrow">前夜：選択と準備</p><div class="night"><div class="night-row"><span class="object" data-magic-id="object-0" data-magic-line="nowrap">服</span><p>明日着る1組を選ぶ</p></div><div class="night-row"><span class="object" data-magic-id="object-1" data-magic-line="nowrap">鍵</span><p>置き場所を1か所に</p></div><div class="night-row"><span class="object" data-magic-id="object-2" data-magic-line="nowrap">バッグ</span><p>必要な物を詰める</p></div></div></div><div><p class="metric-label">朝：確認して、出発</p><div class="metric"><span class="number" data-magic-id="target" data-magic-line="nowrap">30分</span></div><p class="small">起床から出発までの目標</p><p class="dayline">まずは <span class="test-days" data-magic-id="days" data-magic-line="nowrap">5日間</span> 試す。</p><p class="lead">忘れ物がないかを確認。<br>速さより、無理なく続けられるか。</p></div></div><p class="foot">前夜に増えた時間も計測。朝だけ短くても、一日の負担が増えれば調整する。</p></div></div></section>
