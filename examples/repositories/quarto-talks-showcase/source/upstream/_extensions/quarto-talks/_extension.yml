title: Quarto Talks
author: Alfredo H. Sanchez
version: 0.4.1
quarto-required: ">=1.4.0"
contributes:
  formats:
    revealjs:
      theme: [default, quarto-talks.scss]
      filters: [bluesky.lua]
      width: 1600
      height: 900
      margin: 0.08
      center: false
      auto-stretch: false
      controls: false
      progress: false
      slide-number: c/t
      show-slide-number: all
      transition: fade
      background-transition: fade
      navigation-mode: linear
      hash: true
      history: false
      preview-links: auto
      code-line-numbers: false
      code-overflow: wrap
      code-block-height: 650px
      highlight-style: github
      embed-resources: true
      self-contained-math: true
      html-math-method: katex
      title-slide-attributes:
        data-background-color: "#ffffff"
