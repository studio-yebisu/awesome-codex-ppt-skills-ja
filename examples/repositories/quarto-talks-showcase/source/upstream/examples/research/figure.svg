<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 680" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic weekly evening library visits</title>
  <desc id="desc">Visits increase from 38, 43, and 45 before extended hours to 61, 67, and 72 afterward.</desc>
  <rect width="1400" height="680" fill="#ffffff"/>
  <g stroke="#d5dde1" stroke-width="2">
    <line x1="150" y1="530" x2="1300" y2="530"/>
    <line x1="150" y1="410" x2="1300" y2="410"/>
    <line x1="150" y1="290" x2="1300" y2="290"/>
    <line x1="150" y1="170" x2="1300" y2="170"/>
  </g>
  <g fill="#62717a" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28">
    <text x="112" y="540" text-anchor="end">20</text>
    <text x="112" y="420" text-anchor="end">40</text>
    <text x="112" y="300" text-anchor="end">60</text>
    <text x="112" y="180" text-anchor="end">80</text>
    <text x="80" y="350" text-anchor="middle" transform="rotate(-90 80 350)">Evening visits</text>
    <text x="250" y="590" text-anchor="middle">1</text>
    <text x="450" y="590" text-anchor="middle">2</text>
    <text x="650" y="590" text-anchor="middle">3</text>
    <text x="850" y="590" text-anchor="middle">4</text>
    <text x="1050" y="590" text-anchor="middle">5</text>
    <text x="1250" y="590" text-anchor="middle">6</text>
    <text x="730" y="640" text-anchor="middle">Week</text>
  </g>
  <line x1="750" y1="120" x2="750" y2="530" stroke="#7b8c96" stroke-width="3" stroke-dasharray="10 12"/>
  <text x="770" y="145" fill="#62717a" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25">hours extended</text>
  <polyline points="250,422 450,392 650,380 850,284 1050,248 1250,218" fill="none" stroke="#315f7d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#ffffff" stroke="#315f7d" stroke-width="7">
    <circle cx="250" cy="422" r="13"/>
    <circle cx="450" cy="392" r="13"/>
    <circle cx="650" cy="380" r="13"/>
    <circle cx="850" cy="284" r="13"/>
    <circle cx="1050" cy="248" r="13"/>
    <circle cx="1250" cy="218" r="13"/>
  </g>
</svg>
