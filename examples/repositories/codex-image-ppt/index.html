<!doctype html><html lang="ja"><meta charset="utf-8"><title>Gitの保存・記録・共有</title><style>html,body{margin:0;background:#182231;height:100%;overflow:hidden}img{width:100%;height:100%;object-fit:contain}</style><img id="slide" src="render/slide-01.png" alt="Gitの保存・記録・共有"><script>let n=1;function go(v){n=Math.max(1,Math.min(3,v));document.querySelector('img').src='render/slide-'+String(n).padStart(2,'0')+'.png';parent.postMessage({type:'yebisu-page',page:n,total:3},location.origin)}addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(n+1);if(e.key==='ArrowLeft')go(n-1)});addEventListener('message',e=>{if(e.source!==parent||e.origin!==location.origin)return;if(e.data?.type==='yebisu-slide')go(e.data.page)});go(1);</script></html>
