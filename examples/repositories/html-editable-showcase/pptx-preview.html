<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>完成PPTXプレビュー — 小さな店の、ひとつの旗。</title><style>html,body{margin:0;width:100%;height:100%;background:#151b1d;overflow:hidden}img{width:100%;height:100%;object-fit:contain}nav{position:fixed;bottom:12px;right:16px;background:#151b1dde;color:#edeb63;padding:8px 14px;font:13px sans-serif;display:flex;gap:12px;align-items:center}button,a{color:#edeb63;background:none;border:0;font:inherit;cursor:pointer}button{font-size:22px}</style></head><body><img id="slide" src="render/slide-01.png" alt="完成PPTXの1ページ"><nav><button id="prev" aria-label="前へ">←</button><span id="counter"></span><button id="next" aria-label="次へ">→</button><a href="index.html">制作HTMLを見る</a></nav><script>let i=0;function go(n){i=Math.max(0,Math.min(4,n));const img=document.getElementById('slide');img.src='render/slide-'+String(i+1).padStart(2,'0')+'.png';img.alt='完成PPTXの'+(i+1)+'ページ';document.getElementById('counter').textContent=(i+1)+' / 5';if(parent!==window)parent.postMessage({type:'yebisu-page',index:i,total:5},location.origin)}document.getElementById('prev').onclick=()=>go(i-1);document.getElementById('next').onclick=()=>go(i+1);addEventListener('keydown',e=>{if(['ArrowRight',' '].includes(e.key))go(i+1);if(e.key==='ArrowLeft')go(i-1)});addEventListener('message',e=>{if(e.source===parent&&e.origin===location.origin&&e.data?.type==='yebisu-slide'&&Number.isInteger(e.data.index))go(e.data.index)});go(0);</script></body></html>
