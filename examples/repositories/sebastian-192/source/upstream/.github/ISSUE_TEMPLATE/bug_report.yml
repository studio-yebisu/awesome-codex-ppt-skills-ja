name: Bug report / 问题报告
description: Report a reproducible problem with SlideMuse / 提交可复现的问题
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Please use Discussions for usage questions. Share only sanitized examples and logs.
        使用咨询请前往 Discussions。请仅提供脱敏后的最小示例和日志。
  - type: textarea
    id: environment
    attributes:
      label: Environment / 运行环境
      description: Agent and version, OS, SlideMuse version, Python, and render backend. You may paste sanitized output from `python slidemuse.py doctor --json`.
      placeholder: "Codex / Windows / SlideMuse version / Python version / PowerPoint or LibreOffice"
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Stage / 出错阶段
      options:
        - Installation / 安装
        - Content or style / 内容或风格
        - Image generation / 图片生成
        - Editable compilation / 可编辑编译
        - Rendering / 渲染
        - Review or evaluation / 审阅或评分
        - Data or speaker notes / 数据或讲稿
        - Other / 其他
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction / 最短复现步骤
      description: Include the exact command, a minimal Page Spec or Scene, and required sanitized assets when possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result / 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result and logs / 实际结果与日志
      description: Include exit code, error text and screenshots for visual problems.
    validations:
      required: true
