<!doctype html><html lang="ja"><meta charset="utf-8"><title>青葉デザイン はじめの一週間</title><style>html,body{margin:0;background:#142032;height:100%}img{display:block;width:100%;height:100%;object-fit:contain}</style><img id="page" alt="PowerPoint描画の日本語スライド"><script>let n=1;function go(i){n=Math.max(1,Math.min(4,i));document.querySelector('img').src='render/slide-'+String(n).padStart(2,'0')+'.png';parent.postMessage({type:'yebisu-page',index:n-1,total:4},location.origin)}addEventListener('message',e=>{if(e.source!==parent||e.origin!==location.origin)return;if(e.data.type==='yebisu-slide'&&Number.isInteger(e.data.index))go(e.data.index+1)});addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(n+1);if(e.key==='ArrowLeft')go(n-1)});go(1)</script></html>
