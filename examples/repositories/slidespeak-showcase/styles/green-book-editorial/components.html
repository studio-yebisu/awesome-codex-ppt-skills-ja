<template id="slide-cover"><section class="slide bookgreen book-cover"><p class="book-label">{{label}}</p><div class="long-rule"></div><h1>{{title}}</h1><p class="sub">{{subtitle}}</p><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" data-visual-event="signature-mark"><path d="M300 420 L45 315 V40 L300 146 L555 40 V315 Z" fill="none" stroke="currentColor" stroke-width="3"/><path d="M300 146 V420 M75 80 L275 163 M75 122 L275 205 M325 163 L525 80 M325 205 L525 122" stroke="currentColor" fill="none" stroke-width="3"/></svg><div class="lower-rule"></div><p class="book-footer">{{notice}}</p></section></template>
<template id="slide-statement"><section class="slide book-statement"><div class="long-rule"></div><h2>{{title}}</h2><p class="sub">{{body}}</p><div class="spine" data-visual-event="signature-mark"></div><div class="lower-rule"></div><p class="book-footer">{{label}}</p></section></template>
<template id="slide-quote"><section class="slide book-quote"><div class="long-rule"></div><div class="quote-mark"></div><h2>{{title}}</h2><p class="sub">{{body}}</p><div class="lower-rule"></div><p class="book-footer">{{label}}</p></section></template>
<template id="slide-split"><section class="slide book-split"><div class="long-rule"></div><h2>{{title}}</h2><p class="sub">{{body}}</p><div class="vertical"></div><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" data-visual-event="signature-mark"><path d="M300 420 L45 315 V40 L300 146 L555 40 V315 Z" fill="none" stroke="currentColor" stroke-width="3"/><path d="M300 146 V420 M75 80 L275 163 M75 122 L275 205 M325 163 L525 80 M325 205 L525 122" stroke="currentColor" fill="none" stroke-width="3"/></svg><p class="caption">{{caption}}</p><div class="lower-rule"></div><p class="book-footer">{{label}}</p></section></template>
<template id="slide-timeline"><section class="slide book-timeline"><div class="long-rule"></div><h2>{{title}}</h2><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" data-visual-event="signature-mark"><path d="M25 150 H430 M300 35 L440 150 L300 265" stroke="currentColor" fill="none" stroke-width="4"/></svg><div class="process"><div class="step" data-visual-event="item-marker"><b>01</b><h3>{{first}}</h3><p>{{one}}</p></div><div class="step" data-visual-event="item-marker"><b>02</b><h3>{{second}}</h3><p>{{two}}</p></div><div class="step" data-visual-event="item-marker"><b>03</b><h3>{{third}}</h3><p>{{three}}</p></div></div><div class="lower-rule"></div><p class="book-footer">{{label}}</p></section></template>
<template id="slide-closing"><section class="slide bookgreen book-closing"><div class="long-rule"></div><h2>{{title}}</h2><p class="sub">{{body}}</p><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" data-visual-event="signature-mark"><path d="M25 150 H430 M300 35 L440 150 L300 265" stroke="currentColor" fill="none" stroke-width="4"/></svg><div class="lower-rule"></div><p class="book-footer">{{label}}</p></section></template>
