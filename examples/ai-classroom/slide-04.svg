<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="伝わる依頼の3つの材料"><title>伝わる依頼の3つの材料</title><rect width="1280" height="720" fill="#ECF4E9"/><g><text x="72" y="72" font-size="18" font-weight="700" font-family="BIZ UDPGothic, sans-serif" letter-spacing="2" text-anchor="start" fill="#285A4A" stroke="none" stroke-width="0"><tspan x="72" dy="0">TRY IT</tspan></text></g><g><text x="72" y="157" font-size="48" font-weight="700" font-family="BIZ UDPGothic, sans-serif" letter-spacing="0" text-anchor="start" fill="#213E34" stroke="none" stroke-width="0"><tspan x="72" dy="0">伝わる依頼の3つの材料</tspan></text></g><g><line x1="72" y1="195" x2="1208" y2="195" fill="none" stroke="#285A4A" stroke-width="1"/></g><g><text x="72" y="299" font-size="44" font-weight="700" font-family="BIZ UDPGothic, sans-serif" letter-spacing="0" text-anchor="start" fill="#285A4A" stroke="none" stroke-width="0"><tspan x="72" dy="0">相手</tspan></text></g><g><text x="72" y="369" font-size="25" font-weight="400" font-family="BIZ UDPGothic, sans-serif" letter-spacing="0" text-anchor="start" fill="#213E34" stroke="none" stroke-width="0"><tspan x="72" dy="0">中学生にもわかる言葉で</tspan></text></g><g><text x="488" y="299" font-size="44" font-weight="700" font-family="BIZ UDPGothic, sans-serif" letter-spacing="0" text-anchor="start" fill="#285A4A" stroke="none" stroke-width="0"><tspan x="488" dy="0">目的</tspan></text></g><g><text x="488" y="369" font-size="25" font-weight="400" font-family="BIZ UDPGothic, sans-serif" letter-spacing="0" text-anchor="start" fill="#213E34" stroke="none" stroke-width="0"><tspan x="488" dy="0">文章生成のしくみを説明</tspan></text></g><g><text x="931" y="299" font-size="44" font-weight="700" font-family="BIZ UDPGothic, sans-serif" letter-spacing="0" text-anchor="start" fill="#285A4A" stroke="none" stroke-width="0"><tspan x="931" dy="0">形</tspan></text></g><g><text x="931" y="369" font-size="25" font-weight="400" font-family="BIZ UDPGothic, sans-serif" letter-spacing="0" text-anchor