<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="自然な文章でも、確認は必要"><title>自然な文章でも、確認は必要</title><rect width="1280" height="720" fill="#ECF4E9"/><g><text x="72" y="72" font-size="18" font-weight="700" font-family="BIZ UDPGothic, sans-serif" letter-spacing="2" text-anchor="start" fill="#285A4A" stroke="none" stroke-width="0"><tspan x="72" dy="0">CHECK</tspan></text></g><g><text x="72" y="157" font-size="48" font-weight="700" font-family="BIZ UDPGothic, sans-serif" letter-spacing="0" text-anchor="start" fill="#213E34" stroke="none" stroke-width="0"><tspan x="72" dy="0">自然な文章でも、確認は必要</tspan></text></g><g><line x1="72" y1="195" x2="1208" y2="195" fill="none" stroke="#285A4A" stroke-width="1"/></g><g><text x="72" y="316" font-size="52" font-weight="700" font-family="BIZ UDPGothic, sans-serif" letter-spacing="0" text-anchor="start" fill="#285A4A" stroke="none" stroke-width="0"><tspan x="72" dy="0">文章が自然</tspan></text></g><g><text x="628" y="316" font-size="52" font-weight="700" font-family="BIZ UDPGothic, sans-serif" letter-spacing="0" text-anchor="start" fill="#213E34" stroke="none" stroke-width="0"><tspan x="628" dy="0">内容が正しい</tspan></text></g><g><text x="517" y="319" font-size="64" font-weight="700" font-family="BIZ UDPGothic, sans-serif" letter-spacing="0" text-anchor="start" fill="#C77444" stroke="none" stroke-width="0"><tspan x="517" dy="0">≠</tspan></text></g><g><text x="72" y="452" font-size="36" font-weight="700" font-family="BIZ UDPGothic, sans-serif" letter-spacing="0" text-anchor="start" fill="#213E34" stroke="none" stroke-width="0"><tspan x="72" dy="0">人名、数字、引用、出典は</tspan><tspan x="72" dy="60">元の資料に戻って確認する。</tspan></text></g><g><text x="72" y="592" font-size="26" font-weight="700" font-family="BIZ UDPGothic, sans-serif" letter-spacing="0" text-anchor="start" fill="#285A4A" stroke="none" stroke-width="0"><tspan x="72" dy="0">もっともらしさと正確さを、分けて考える。</tspan></text></g><g><text x="72" y="678" font-size="16" font-weight="400" font-family="BIZ UDPGothic, sans-serif" letter-spacing="0" text-anchor="start" fill="#213E34" stroke="none" stroke-width="0"><tspan x="72" dy="0">Studio Yebisu · オリジナル作例</tspan></text></g><g><text x="1208" y="678" font-size="16" font-weight="400" font-family="BIZ UDPGothic, sans-serif" letter-spacing="0" text-anchor="end" fill="#213E34" stroke="none" stroke-width="0"><tspan x="1208" dy="0">03 / 04</tspan></text></g></svg>