<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" lang="ja" font-family="Noto Sans JP" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" width="1280" height="720" fill="#F7F5EE" /><g id="heading" data-pptx-bounds="64 48 1150 112" font-weight="700"><text x="64" y="71" font-size="16" fill="#1F5780">EC / MONTHLY REPORT</text><text x="64" y="135" font-size="42" fill="#202C29">課題は、仮説と確認を対にする</text></g><g id="content" data-pptx-bounds="64 190 1150 426"><rect x="64" y="205" width="342" height="3" fill="#21654C" /><text x="64" y="258" font-size="30" fill="#21654C" font-weight="700">返品の増加</text><text x="64" y="319" font-size="23" fill="#202C29" font-weight="400">仮説：説明と実物の差。</text><text x="64" y="364" font-size="23" fill="#202C29" font-weight="400">確認：返品理由を分類。</text><rect x="454" y="205" width="342" height="3" fill="#21654C" /><text x="454" y="258" font-size="30" fill="#21654C" font-weight="700">粗利率の低下</text><text x="454" y="319" font-size="23" fill="#202C29" font-weight="400">仮説：値引きと商品構成。</text><text x="454" y="364" font-size="23" fill="#202C29" font-weight="400">確認：商品別に利益を分解。</text><rect x="844" y="205" width="342" height="3" fill="#21654C" /><text x="844" y="258" font-size="30" fill="#21654C" font-weight="700">次の判断</text><text x="844" y="319" font-size="23" fill="#202C29" font-weight="400">広告増額は保留。</text><text x="844" y="364" font-size="23" fill="#202C29" font-weight="400">原因の確認後に配分を決める。</text></g><g id="footer" data-pptx-bounds="64 659 1150 28" fill="#53675E" font-weight="400"><text x="64" y="679" font-size="14">架空の組織・数値による制作サンプル / STUDIO YEBISU</text><text x="1115" y="679" font-size="16">05 / 07</text></g></svg>
