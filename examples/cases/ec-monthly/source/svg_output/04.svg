<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" lang="ja" font-family="Noto Sans JP" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" width="1280" height="720" fill="#F7F5EE" /><g id="heading" data-pptx-bounds="64 48 1150 112" font-weight="700"><text x="64" y="71" font-size="16" fill="#1F5780">EC / MONTHLY REPORT</text><text x="64" y="135" font-size="42" fill="#202C29">粗利は52万円増、率は2pt低下</text></g><g id="content" data-pptx-bounds="64 190 1150 426"><text x="64" y="281" font-size="78" fill="#1F5780" font-weight="700">432</text><text x="282" y="280" font-size="27" fill="#202C29" font-weight="400">万円 / 当月粗利</text><text x="68" y="357" font-size="25" fill="#202C29" font-weight="400">前年：1,000万円 × 38% = 380万円</text><text x="68" y="420" font-size="25" fill="#202C29" font-weight="400">当月：1,200万円 × 36% = 432万円</text><text x="715" y="277" font-size="28" fill="#202C29" font-weight="400">増えた粗利：52万円</text><text x="715" y="353" font-size="28" fill="#202C29" font-weight="400">売上の増加が率低下を補った</text><text x="715" y="429" font-size="28" fill="#202C29" font-weight="400">値引き・商品構成を分解する</text><text x="64" y="571" font-size="24" fill="#1F5780" font-weight="700">粗利額の増加と、粗利率の改善は別の判断。</text></g><g id="footer" data-pptx-bounds="64 659 1150 28" fill="#53675E" font-weight="400"><text x="64" y="679" font-size="14">架空の組織・数値による制作サンプル / STUDIO YEBISU</text><text x="1115" y="679" font-size="16">04 / 07</text></g></svg>
