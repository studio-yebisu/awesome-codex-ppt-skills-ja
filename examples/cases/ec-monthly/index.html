<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>くらし便 EC事業 9月報告</title><style>body{margin:0;background:#182119;color:#fff;font-family:sans-serif}img{width:100vw;height:calc(100dvh - 50px);object-fit:contain}nav{height:40px;display:flex;gap:14px;align-items:center;justify-content:center}button,a{color:white;background:#283929;border:1px solid #666;padding:8px;text-decoration:none}</style><img id="page" alt=""><nav><button id="prev">←</button><span id="counter"></span><button id="next">→</button><a href="deck.pptx" download>PPTX ↓</a><a href="render/deck.pdf" download>PDF ↓</a></nav><script>const pages=[{"image": "render/slide-01.png", "title": "売上は前年比20%増、粗利率は低下"}, {"image": "render/slide-02.png", "title": "KPI：売上だけで判断しない"}, {"image": "render/slide-03.png", "title": "売上増200万円を、チャネルで分解"}, {"image": "render/slide-04.png", "title": "粗利は52万円増、率は2pt低下"}, {"image": "render/slide-05.png", "title": "課題は、仮説と確認を対にする"}, {"image": "render/slide-06.png", "title": "10月の施策と、担当・期限"}, {"image": "render/slide-07.png", "title": "次月判断：説明修正と分析を先行"}];let n=0;function show(i){n=Math.max(0,Math.min(i,pages.length-1));document.getElementById("page").src=pages[n].image;document.getElementById("page").alt=pages[n].title;document.getElementById("counter").textContent=(n+1)+" / "+pages.length;}document.getElementById("prev").onclick=()=>show(n-1);document.getElementById("next").onclick=()=>show(n+1);document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")show(n+1);if(e.key==="ArrowLeft")show(n-1)});show(0);</script></html>
