<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" lang="ja" font-family="BIZ UDPGothic" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" width="1280" height="720" fill="#F7F5EE" /><g id="heading" data-pptx-bounds="64 48 1150 112" font-weight="700"><text x="64" y="71" font-size="16" fill="#21654C">CAFE / PROPOSAL</text><text x="64" y="135" font-size="42" fill="#202C29">新店の顧客と、既存店との役割</text></g><g id="content" data-pptx-bounds="64 190 1150 450"><rect x="64" y="217" width="550" height="90" fill="#E5EEE7" /><text x="86" y="253" font-size="27" fill="#21654C" font-weight="700">平日の近隣客</text><text x="86" y="286" font-size="21" fill="#202C29" font-weight="400">仕事の合間の滞在</text><text x="304" y="346" font-size="33" fill="#21654C" font-weight="700">↓</text><rect x="654" y="217" width="550" height="90" fill="#E5EEE7" /><text x="676" y="253" font-size="27" fill="#21654C" font-weight="700">週末の来訪者</text><text x="676" y="286" font-size="21" fill="#202C29" font-weight="400">散歩・買い物の途中</text><text x="894" y="346" font-size="33" fill="#21654C" font-weight="700">↓</text><rect x="64" y="367" width="1150" height="109" fill="#21654C" /><text x="88" y="412" font-size="29" fill="#FFFFFF" font-weight="700">新店：落ち着いて滞在する場所</text><text x="88" y="450" font-size="22" fill="#FFFFFF" font-weight="400">32席の計画。利用場面を調査して確かめる。</text><text x="64" y="531" font-size="25" fill="#202C29" font-weight="700">既存店：24席の日常使い</text><text x="64" y="574" font-size="22" fill="#202C29" font-weight="400">新店との役割が重なるだけにならないか、来店理由を聞く。</text></g><g id="footer" data-pptx-bounds="64 659 1150 28" fill="#53675E" font-weight="400"><text x="64" y="679" font-size="14">架空の組織・数値による制作サンプル / STUDIO YEBISU</text><text x="1115" y="679" font-size="16">02 / 08</text></g></svg>
