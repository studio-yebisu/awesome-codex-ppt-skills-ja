<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" lang="ja" font-family="Noto Sans JP" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" width="1280" height="720" fill="#F7F5EE" /><g id="heading" data-pptx-bounds="64 48 1150 112" font-weight="700"><text x="64" y="71" font-size="16" fill="#21654C">CAFE / PROPOSAL</text><text x="64" y="135" font-size="42" fill="#202C29">仕込みと購買を共通化する</text></g><g id="content" data-pptx-bounds="64 190 1150 426"><rect x="64" y="205" width="342" height="3" fill="#21654C" /><text x="64" y="258" font-size="30" fill="#21654C" font-weight="700">新店</text><text x="64" y="319" font-size="23" fill="#202C29" font-weight="400">32席の滞在型店舗。</text><text x="64" y="364" font-size="23" fill="#202C29" font-weight="400">店長候補の配置を先行。</text><rect x="454" y="205" width="342" height="3" fill="#21654C" /><text x="454" y="258" font-size="30" fill="#21654C" font-weight="700">既存店</text><text x="454" y="319" font-size="23" fill="#202C29" font-weight="400">仕込みの一部を支える。</text><text x="454" y="364" font-size="23" fill="#202C29" font-weight="400">繁忙時間の負荷を確認。</text><rect x="844" y="205" width="342" height="3" fill="#21654C" /><text x="844" y="258" font-size="30" fill="#21654C" font-weight="700">共通化</text><text x="844" y="319" font-size="23" fill="#202C29" font-weight="400">材料の購買をまとめる。</text><text x="844" y="364" font-size="23" fill="#202C29" font-weight="400">品質基準と日報を揃える。</text></g><g id="footer" data-pptx-bounds="64 659 1150 28" fill="#53675E" font-weight="400"><text x="64" y="679" font-size="14">架空の組織・数値による制作サンプル / STUDIO YEBISU</text><text x="1115" y="679" font-size="16">05 / 08</text></g></svg>
