<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小さな道案内</title><style>body{margin:0;background:#102a43;color:white;font:16px sans-serif}header{padding:14px;position:sticky;top:0;background:#102a43}button{padding:8px 15px;margin:0 5px}img{display:block;max-width:100%;width:1100px;margin:auto}p{padding:0 16px}</style><header><button onclick="go(-1)">前へ</button><button onclick="go(1)">次へ</button><button onclick="play()">再生 / 停止</button><span id="n"></span></header><img id="slide" alt="スライド"><p>完成PPTXの実描画。架空・未実施の研究計画。</p><script>const pages=["render/slide-01.png", "render/slide-02.png", "render/slide-03.png", "render/slide-04.png", "render/slide-05.png", "render/slide-06.png", "render/slide-07.png", "render/slide-08.png"];let i=0,t;function show(){document.getElementById('slide').src=pages[i];document.getElementById('n').textContent=(i+1)+' / '+pages.length}function go(d){i=(i+d+pages.length)%pages.length;show()}function play(){if(t){clearInterval(t);t=null}else t=setInterval(()=>go(1),4000)}document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});show()</script></html>
