requires_api_keys: false
platforms:
  - Codex with image generation and local file tools (recommended with GPT Image 2.5)
  - Other agents with document reading, vision, native or connected image generation, and Python
security_notes: >-
  Local scripts do not make network requests or handle API keys.
  Host vision/image services may upload supplied content and require separate credentials.
  Page Spec image paths and Scene assets are confined to their specification directories.
  Exported PPTX embeds referenced assets.
