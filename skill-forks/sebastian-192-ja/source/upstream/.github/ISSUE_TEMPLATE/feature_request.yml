name: Feature request / 功能建议
description: Describe a concrete presentation workflow improvement / 描述具体使用场景
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Use case and problem / 使用场景与问题
      description: Who needs this, and what is difficult in the current workflow?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired result / 期望交付
      description: Provide a before/after example or a measurable acceptance criterion.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and examples / 替代方案与示例
      description: Existing workaround, relevant projects, or sanitized reference slides.
