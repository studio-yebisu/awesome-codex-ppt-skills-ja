name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - manifest.yaml
      - .github/workflows/release.yml
      - scripts/**
      - references/**
      - examples/**
      - docs/**
      - showcase/**
      - install.py
      - SKILL.md
      - agents/**
      - requirements.txt
      - requirements-dev.txt
      - README.md
      - README.en.md
      - CONTRIBUTING.md
      - CHANGELOG.md
      - LICENSE

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m pytest tests/ -q
      - run: python scripts/validate_page_spec.py examples/page-spec.example.json --strict

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: slidemuse-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install PyYAML
      - name: Package manifest files and release notes
        run: |
          python - <<'PY'
          import hashlib, os, re, zipfile
          from pathlib import Path
          import yaml
          root = Path.cwd()
          manifest = yaml.safe_load(Path('manifest.yaml').read_text())
          version = manifest['version']
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise ValueError('Invalid release version')
          out = Path('dist')
          out.mkdir()
          archive = out / f'slidemuse-v{version}.zip'
          with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as z:
              for name in manifest['files']:
                  source = (root / name).resolve()
                  if not source.is_relative_to(root) or not source.is_file():
                      raise ValueError(f'Invalid manifest file: {name}')
                  z.write(source, 'slidemuse/' + name)
          (out / 'SHA256SUMS.txt').write_text(hashlib.sha256(archive.read_bytes()).hexdigest() + '  ' + archive.name + '\n')
          changelog = Path('CHANGELOG.md').read_text()
          section = changelog.split(f'## [{version}]', 1)[1].split('\n## [', 1)[0]
          notes = '\n'.join(section.splitlines()[1:]).strip()
          if not notes:
              raise ValueError('Missing release notes')
          (out / 'release-notes.md').write_text(notes + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'RELEASE_TAG=v{version}\n')
          PY
      - name: Publish version once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            python - <<'PY'
          import os, subprocess
          from pathlib import Path
          import yaml
          files = yaml.safe_load(Path('manifest.yaml').read_text())['files']
          result = subprocess.run(
              ['git', 'diff', '--quiet', os.environ['RELEASE_TAG'], 'HEAD', '--', *files],
              check=False,
          )
          if result.returncode:
              raise SystemExit('Packaged files changed since existing release; bump manifest version')
          PY
            echo "Release already exists with identical packaged files."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "SlideMuse $RELEASE_TAG" \
            --notes-file dist/release-notes.md \
            "dist/slidemuse-$RELEASE_TAG.zip" dist/SHA256SUMS.txt
