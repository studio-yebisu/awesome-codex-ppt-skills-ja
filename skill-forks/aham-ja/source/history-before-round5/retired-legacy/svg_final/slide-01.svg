<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"><rect width="1280" height="720" fill="#3156C5"/><rect x="40" y="60" width="12" height="12" fill="#F5DC49"/><text x="62" y="76" text-anchor="start" font-family="Zen Kaku Gothic New" font-size="19" fill="#F5DC49" font-weight="700">MORNING / WORKSHOP</text><text x="40" y="312" text-anchor="start" font-family="Zen Kaku Gothic New" font-size="46" fill="#F5DC49" font-weight="700">朝の20分を、組み直す。</text><text x="40" y="374" text-anchor="start" font-family="Zen Kaku Gothic New" font-size="19" fill="#F3F0E3">ひとつ選ぶ。取り組む。次を残す。</text><rect x="42" y="398" width="116" height="4" fill="#F5DC49"/><line x1="856" y1="276" x2="856" y2="496" stroke="#F5DC49" stroke-width="1"/><text x="892" y="296" text-anchor="start" font-family="Zen Kaku Gothic New" font-size="16" fill="#F5DC49" letter-spacing="2">この案で試すこと</text><text x="892" y="344" text-anchor="start" font-family="Manrope" font-size="16" fill="#F5DC49">01</text><text x="936" y="344" text-anchor="start" font-family="Zen Kaku Gothic New" font-size="17" fill="#F5DC49">時間を並べる</text><text x="892" y="386" text-anchor="start" font-family="Manrope" font-size="16" fill="#F5DC49">02</text><text x="936" y="386" text-anchor="start" font-family="Zen Kaku Gothic New" font-size="17" fill="#F5DC49">作業を置く</text><text x="892" y="428" text-anchor="start" font-family="Manrope" font-size="16" fill="#F5DC49">03</text><text x="936" y="428" text-anchor="start" font-family="Zen Kaku Gothic New" font-size="17" fill="#F5DC49">四週間で試す</text><line x1="40" y1="648" x2="1240" y2="648" stroke="#F5DC49" stroke-width="1"/><text x="40" y="682" text-anchor="start" font-family="Zen Kaku Gothic New" font-size="16" fill="#F5DC49">架空のワークショップ案。実績・健康効果の主張なし。</text><text x="1240" y="682" text-anchor="end" font-family="Zen Kaku Gothic New" font-size="16" fill="#F5DC49">01 / 04</text></svg>