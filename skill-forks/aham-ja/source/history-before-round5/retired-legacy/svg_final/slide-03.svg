<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"><rect width="1280" height="720" fill="#F5DC49"/><text x="40" y="24" text-anchor="start" font-family="Zen Kaku Gothic New" font-size="16" fill="#3156C5" letter-spacing="1">E-04</text><rect x="1188" y="16" width="9" height="9" fill="#3156C5"/><text x="1240" y="24" text-anchor="end" font-family="Zen Kaku Gothic New" font-size="16" fill="#151B1D" font-weight="600">MORNING / WORKSHOP</text><line x1="40" y1="32" x2="1240" y2="32" stroke="#151B1D" stroke-width="1"/><text x="40" y="78" text-anchor="start" font-family="Zen Kaku Gothic New" font-size="38" fill="#151B1D" font-weight="700">作業を始める前に、入口を用意する。</text><line x1="40" y1="94" x2="1240" y2="94" stroke="#151B1D" stroke-width="1"/><rect x="240" y="140" width="800" height="110" fill="#151B1D"/><text x="640" y="178" text-anchor="middle" font-family="Zen Kaku Gothic New" font-size="16" fill="#F3F0E3" letter-spacing="3">前日</text><text x="640" y="212" text-anchor="middle" font-family="Zen Kaku Gothic New" font-size="22" fill="#F5DC49" font-weight="700">手をつける場所を、一つ決める</text><line x1="640" y1="250" x2="640" y2="295" stroke="#9B9B9B" stroke-width="2"/><polygon points="634,295 640,307 646,295" fill="#151B1D"/><rect x="240" y="307" width="800" height="110" fill="#3156C5"/><text x="640" y="345" text-anchor="middle" font-family="Zen Kaku Gothic New" font-size="16" fill="#F3F0E3" letter-spacing="3">朝</text><text x="640" y="379" text-anchor="middle" font-family="Zen Kaku Gothic New" font-size="22" fill="#F5DC49" font-weight="700">その一つから、始めてみる</text><line x1="640" y1="417" x2="640" y2="462" stroke="#9B9B9B" stroke-width="2"/><polygon points="634,462 640,474 646,462" fill="#9B9B9B"/><rect x="240" y="474" width="800" height="110" fill="#F1EACF"/><text x="640" y="512" text-anchor="middle" font-family="Zen Kaku Gothic New" font-size="16" fill="#3156C5" letter-spacing="3">最後</text><text x="640" y="546" text-anchor="middle" font-family="Zen Kaku Gothic New" font-size="22" fill="#151B1D" font-weight="700">続きがわかる一言を、残す</text><line x1="40" y1="690" x2="1240" y2="690" stroke="#151B1D" stroke-width="1"/><text x="40" y="709" text-anchor="start" font-family="Zen Kaku Gothic New" font-size="16" fill="#3156C5">来源：架空企画 / 試行のための提案</text><text x="1240" y="709" text-anchor="end" font-family="Manrope" font-size="16" fill="#3156C5">3 / 4</text></svg>