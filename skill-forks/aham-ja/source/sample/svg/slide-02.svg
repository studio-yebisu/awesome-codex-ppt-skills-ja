ku Gothic New', sans-serif" font-size="16" fill="#262626">12</text><line x1="905.5" y1="154" x2="905.5" y2="546" stroke="#E7E7E7" stroke-width="0.5" stroke-dasharray="2,2"/><text x="905.5" y="150" text-anchor="middle" font-family="Manrope, 'Zen Kaku Gothic New', sans-serif" font-size="16" fill="#262626">15</text><line x1="1048.6" y1="154" x2="1048.6" y2="546" stroke="#E7E7E7" stroke-width="0.5" stroke-dasharray="2,2"/><text x="1048.6" y="150" text-anchor="middle" font-family="Manrope, 'Zen Kaku Gothic New', sans-serif" font-size="16" fill="#262626">18</text><text x="178" y="210.5" text-anchor="end" font-family="Manrope, 'Zen Kaku Gothic New', sans-serif" font-size="16" fill="#262626">作業を選ぶ</text><rect x="190.0" y="195.5" width="143.1" height="22.0" rx="3" fill="#9B9B9B" stroke="#6E6E6E" stroke-width="1"/><text x="339.1" y="210.5" text-anchor="start" font-family="Manrope, 'Zen Kaku Gothic New', sans-serif" font-size="16" fill="#262626">3分</text><text x="178" y="307.5" text-anchor="end" font-family="Manrope, 'Zen Kaku Gothic New', sans-serif" font-size="16" fill="#262626">作業に取り組む</text><rect x="333.1" y="292.5" width="477.0" height="22.0" rx="3" fill="#336EE8" stroke="#6E6E6E" stroke-width="1"/><text x="816.1" y="307.5" text-anchor="start" font-family="Manrope, 'Zen Kaku Gothic New', sans-serif" font-size="16" fill="#262626">10分</text><text x="178" y="404.5" text-anchor="end" font-family="Manrope, 'Zen Kaku Gothic New', sans-serif" font-size="16" fill="#262626">進み具合をメモ</text><rect x="810.1" y="389.5" width="238.5" height="22.0" rx="3" fill="#9B9B9B" stroke="#6E6E6E" stroke-width="1"/><text x="1054.6" y="404.5" text-anchor="start" font-family="Manrope, 'Zen Kaku Gothic New', sans-serif" font-size="16" fill="#262626">5分</text><text x="178" y="501.5" text-anchor="end" font-family="Manrope, 'Zen Kaku Gothic New', sans-serif" font-size="16" fill="#262626">次の手順を書く</text><rect x="1048.6" y="486.5" width="95.4" height="22.0" rx="3" fill="#9B9B9B" stroke="#6E6E6E" stroke-width="1"/><text x="1150.0" y="501.5" text-anchor="start" font-family="Manrope, 'Zen Kaku Gothic New', sans-serif" font-size="16" fill="#262626">2分</text><line x1="1144" y1="154" x2="1144" y2="546" stroke="#E7E7E7" stroke-width="0.5" stroke-dasharray="2,2"/><text x="1144" y="150" text-anchor="middle" font-family="Manrope, 'Zen Kaku Gothic New', sans-serif" font-size="16" fill="#262626">20</text><text x="56" y="656" text-anchor="start" font-family="Manrope, 'Zen Kaku Gothic New', sans-serif" font-size="15" fill="#262626">合計20分（3＋10＋5＋2分）。時間配分は例示値</text><line x1="40" y1="690" x2="1240" y2="690" stroke="#E7E7E7" stroke-width="1"/><text x="40" y="709" text-anchor="start" font-family="Manrope, 'Zen Kaku Gothic New', sans-serif" font-size="11" fill="#6E6E6E">出典：架空のワークショップ案。時間配分は例示で効果は未測定</text><text x="1240" y="709" text-anchor="end" font-family="Manrope, 'Zen Kaku Gothic New', sans-serif" font-size="11" fill="#6E6E6E">2 / 4</text></svg>