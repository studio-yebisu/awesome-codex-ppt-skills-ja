<!doctype html><html lang="ja"><meta charset="utf-8"><title>地域カフェの朝営業を試す</title><style>html,body{margin:0;background:#142032;height:100%}img{display:block;width:100%;height:100%;object-fit:contain}</style><img alt="完成PowerPointの描画"><script>let n=1;function go(i){n=Math.max(1,Math.min(5,i));document.querySelector('img').src='render/slide-'+String(n).padStart(2,'0')+'.png';if(parent!==window)parent.postMessage({type:'yebisu-page',index:n-1,total:5},location.origin)}addEventListener('message',e=>{if(e.source!==parent||e.origin!==location.origin)return;if(e.data?.type==='yebisu-slide'&&Number.isInteger(e.data.index))go(e.data.index+1)});addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(n+1);if(e.key==='ArrowLeft')go(n-1)});go(1)</script></html>
