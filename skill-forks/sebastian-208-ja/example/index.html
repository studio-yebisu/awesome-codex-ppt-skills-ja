<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>雨の図書室</title><style>body{margin:0;background:#14283d;color:#f5f2e9;font:16px sans-serif}header,nav{padding:14px 24px;display:flex;gap:12px;align-items:center;justify-content:center}a{color:inherit}main{max-width:1400px;margin:auto}img{display:block;width:100%;aspect-ratio:16/9}button{padding:10px 20px;border:0;border-radius:4px;cursor:pointer}p{padding:0 24px;text-align:center}</style><header>雨の図書室 · 架空の空間デザイン研究提案 <a href="deck.pptx">PPTX</a></header><main><img id="slide" src="image_pages/slide_01.png" alt="雨の図書室 第1頁"></main><nav><button id="prev">前へ</button><span id="counter">1 / 11</span><button id="next">次へ</button><button id="play">再生</button></nav><p>稿を章と頁へ整理し、選んだ書式を全11頁へ適用した画像版の作例です。<a href="README.md">スキルの用途・手順・制約</a></p><p>本文・図は画像です。PPTXではページ画像差替えと話者ノートを編集できます。</p><script>let n=1,t=null;function show(){document.querySelector('#slide').src='image_pages/slide_'+String(n).padStart(2,'0')+'.png';document.querySelector('#slide').alt='雨の図書室 第'+n+'頁';document.querySelector('#counter').textContent=n+' / 11'}document.querySelector('#prev').onclick=()=>{n=n===1?11:n-1;show()};document.querySelector('#next').onclick=()=>{n=n===11?1:n+1;show()};document.querySelector('#play').onclick=()=>{if(t){clearInterval(t);t=null;document.querySelector('#play').textContent='再生'}else{t=setInterval(()=>{n=n===11?1:n+1;show()},4500);document.querySelector('#play').textContent='停止'}};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')document.querySelector('#next').click();if(e.key==='ArrowLeft')document.querySelector('#prev').click()});</script></html>
