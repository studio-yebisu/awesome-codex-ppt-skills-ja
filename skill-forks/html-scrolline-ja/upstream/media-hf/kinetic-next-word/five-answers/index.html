<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Five answers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Pretendard";
        src: local("Pretendard Variable"), local("Pretendard");
        font-weight: 100 900;
        font-display: block;
      }
      :root { background: #0C0B0A; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0C0B0A; }
      body { color: #F3EFE6; font-family: "Pretendard", system-ui, sans-serif; }
      #five-answers { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0C0B0A; }
      .clip { position: absolute; inset: 0; }
      .answers { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 34px; padding: 0 9.6%; }
      .answer-line { display: grid; grid-template-columns: 42px minmax(0, 1fr); align-items: baseline; column-gap: 42px; min-height: 78px; }
      .number { color: #7D786F; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 22px; font-weight: 500; line-height: 1; letter-spacing: .02em; }
      .sentence { color: #F3EFE6; font-size: 56px; font-weight: 500; letter-spacing: -0.042em; line-height: 1.4; white-space: nowrap; }
      .word, .shared, .suffix { display: inline-block; }
      .word { margin-right: .12em; transform-origin: left center; }
      .word.last { margin-right: 0; }
      .shared { margin-right: 0; transform-origin: left center; }
      .suffix { margin-right: .12em; color: #FF4A1C; transform-origin: left center; }
      .accent-shared { color: #F3EFE6; }
      .motion { display: inline-block; opacity: 0; will-change: transform, opacity; }
      .render-tick { position: absolute; width: 1px; height: 1px; left: 0; top: 0; background: #0C0B0A; }
    </style>
  </head>
  <body>
    <div id="five-answers" data-composition-id="five-answers" data-start="0" data-width="1920" data-height="1080" data-duration="6" data-fps="30">
      <main id="five-answer-scene" class="clip" data-start="0" data-duration="6" aria-label="다섯 번의 실제 답">
        <i class="render-tick" aria-hidden="true"></i>
        <div class="answers">
          <div class="answer-line"><span class="number">1</span><div class="sentence" id="line-1"></div></div>
          <div class="answer-line"><span class="number">2</span><div class="sentence" id="line-2"></div></div>
          <div class="answer-line"><span class="number">3</span><div class="sentence" id="line-3"></div></div>
          <div class="answer-line"><span class="number">4</span><div class="sentence" id="line-4"></div></div>
          <div class="answer-line"><span class="number">5</span><div class="sentence" id="line-5"></div></div>
        </div>
      </main>
    </div>
    <script>
      const answers = [
        "새로운 동료가 되신 것을 진심으로 환영합니다, 함께 일하게 되어 기쁩니다.",
        "안녕하세요, 입사를 축하합니다! 오늘부터 함께 일하게 된 여러분을 진심으로 환영합니다.",
        "새로운 동료가 되어 주셔서 진심으로 환영합니다, 앞으로 함께 성장해 나갈 여정이 기대됩니다.",
        "새로운 동료가 되어 주셔서 진심으로 환영합니다. 오늘부터 함께 성장해 갈 여정이 설레고 기대됩니다.",
        "여러분의 입사를 진심으로 환영하며, 오늘부터 함께 성장해 갈 새로운 동료가 되어 주셔서 기쁩니다."
      ];
      const common = ["새로운", "동료가"];
      const splitRows = new Map([
        [0, { suffix: "신", rest: ["것을", "진심으로", "환영합니다,", "함께", "일하게", "되어", "기쁩니다."] }],
        [2, { suffix: "어", rest: ["주셔서", "진심으로", "환영합니다,", "앞으로", "함께", "성장해", "나갈", "여정이", "기대됩니다."] }],
        [3, { suffix: "어", rest: ["주셔서", "진심으로", "환영합니다.", "오늘부터", "함께", "성장해", "갈", "여정이", "설레고", "기대됩니다."] }]
      ]);
      const otherRows = new Map([
        [1, answers[1].split(" ")],
        [4, answers[4].split(" ")]
      ]);
      const span = (text, className, host) => {
        const el = document.createElement("span");
        el.className = className;
        const motion = document.createElement("span");
        motion.className = "motion";
        motion.textContent = text;
        el.appendChild(motion);
        el.motion = motion;
        host.appendChild(el);
        return el;
      };
      document.fonts.ready.then(() => {
        const tl = gsap.timeline({ paused: true, defaults: { ease: "power1.out" } });
        tl.to(".render-tick", { backgroundColor: "#0D0B0A", duration: 6, ease: "none" }, 0);
        const compact = (el) => {
          const naturalWidth = el.getBoundingClientRect().width;
          const scaleX = 0.52;
          el.style.width = `${naturalWidth * scaleX}px`;
          el.style.transform = `scaleX(${scaleX})`;
          return el;
        };
        const reveal = (el, at) => {
          compact(el);
          tl.fromTo(el.motion, { opacity: 0, y: 2 }, { opacity: 1, y: 0, duration: 0.15 }, at);
        };
        splitRows.forEach((row, index) => {
          const host = document.getElementById(`line-${index + 1}`);
          common.forEach((word, wordIndex) => reveal(span(word, "word", host), 0.30 + wordIndex * 0.46));
          const shared = span("되", "shared accent-shared", host);
          reveal(shared, 1.22);
          const suffix = span(row.suffix, "suffix", host);
          reveal(suffix, 2.60);
          tl.to(shared, { color: "#FF4A1C", duration: 0.12, ease: "none" }, 2.60);
          const restInterval = index === 3 ? 0.27 : 0.30;
          row.rest.forEach((word, wordIndex) => reveal(span(word, wordIndex === row.rest.length - 1 ? "word last" : "word", host), 2.94 + wordIndex * restInterval));
        });
        otherRows.forEach((words, index) => {
          const host = document.getElementById(`line-${index + 1}`);
          const interval = index === 1 ? 0.50 : 0.44;
          words.forEach((word, wordIndex) => reveal(span(word, wordIndex === words.length - 1 ? "word last" : "word", host), 0.30 + wordIndex * interval));
        });
        window.__timelines["five-answers"] = tl;
        window.__hfForceTimelineRebind?.();
      });
    </script>
  </body>
</html>
