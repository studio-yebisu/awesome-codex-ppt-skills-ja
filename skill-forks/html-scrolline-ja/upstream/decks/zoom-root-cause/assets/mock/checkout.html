<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <title>누리살림 결제</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; background: #f7f8fa; }
    body { font-family: "IBM Plex Sans KR", Arial, sans-serif; color: #171a1e; }
    .app { width: 360px; height: 640px; overflow: hidden; position: relative; background: #f7f8fa; }
    .bar { height: 64px; background: #ffffff; border-bottom: 1px solid #e7e9ed; display: flex; align-items: center; padding: 0 18px; font-size: 19px; font-weight: 700; letter-spacing: -.04em; }
    .scroll { height: 576px; overflow: auto; scrollbar-width: none; padding: 16px; padding-bottom: 32px; }
    .scroll::-webkit-scrollbar { display: none; }
    .card { background: #fff; border: 1px solid #e3e6ea; border-radius: 2px; }
    .address { height: 96px; padding: 15px 14px; }
    .eyebrow { color: #6c737d; font-size: 11px; line-height: 16px; font-weight: 500; }
    .address strong { display: block; margin-top: 2px; font-size: 14px; line-height: 21px; }
    .address small { display: block; color: #68717c; font-size: 11px; line-height: 16px; }
    .summary { height: 76px; margin-top: 12px; padding: 11px 14px; }
    .line { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; line-height: 25px; }
    .line span:last-child { color: #4d5560; white-space: nowrap; }
    .delivery { height: 56px; margin-top: 12px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; }
    .delivery b { font-size: 14px; letter-spacing: -.035em; }
    .delivery .chosen { font-size: 11px; color: #606873; }
    .chevron { width: 7px; height: 7px; border-right: 1.5px solid #434a53; border-bottom: 1.5px solid #434a53; transform: rotate(45deg) translateY(-2px); }
    .slots { display: none; margin-top: 8px; grid-template-columns: 1fr 1fr; gap: 4px; }
    .slot { height: 51px; background: #fff; border: 1px solid #e1e5e9; border-radius: 2px; display: flex; align-items: center; padding: 0 11px; font-size: 11px; color: #363c44; }
    .slot:first-child { border-color: #fb6847; color: #c1452a; background: #fff8f6; font-weight: 700; }
    .expanded .slots { display: grid; }
    .pay { margin-top: 76px; width: 100%; height: 48px; border: 0; border-radius: 2px; background: #fb5b3d; color: #171a1e; font: 700 15px "IBM Plex Sans KR", Arial, sans-serif; letter-spacing: -.03em; }
    .expanded .pay { margin-top: 76px; }
    .sticky .scroll { padding-bottom: 92px; }
    .sticky .pay { position: sticky; bottom: 0; margin-top: 24px; z-index: 2; box-shadow: 0 -10px 18px #f7f8faa8; }
    .capture .app { height: 820px; }
    .capture .scroll { height: 756px; }
  </style>
</head>
<body>
  <main class="app" id="app" aria-label="누리살림 결제 화면">
    <header class="bar">누리살림</header>
    <section class="scroll" id="checkout-scroll">
      <article class="card address"><span class="eyebrow">배송지</span><strong>집 · 서울시 마포구 성산로</strong><small>문 앞에 놓아 주세요</small></article>
      <article class="card summary"><div class="line"><span>저자극 생활세제</span><span>1개 · 18,900원</span></div><div class="line"><span>주방 소모품 세트</span><span>1개 · 12,400원</span></div></article>
      <section class="card delivery"><b>새벽배송 시간 선택</b><span class="chosen">오전 1시~2시</span><i class="chevron" aria-hidden="true"></i></section>
      <section class="slots" aria-label="배송 시간 목록">
        <div class="slot">오전 1시~2시</div><div class="slot">오전 2시~3시</div><div class="slot">오전 3시~4시</div><div class="slot">오전 4시~5시</div><div class="slot">오전 5시~6시</div><div class="slot">오전 6시~7시</div><div class="slot">오전 7시~8시</div><div class="slot">오전 8시~9시</div>
      </section>
      <button class="pay">결제하기</button>
    </section>
  </main>
  <script>
    const query = new URLSearchParams(location.search);
    const version = query.get('v') || '51';
    const state = query.get('state');
    const app = document.querySelector('#app');
    const expanded = state === 'expanded' || (!state && (version === '52' || version === '521'));
    app.classList.toggle('expanded', expanded);
    app.classList.toggle('sticky', version === '521');
    document.documentElement.classList.toggle('capture', query.get('capture') === '820');
    window.__checkoutMetrics = () => {
      const scroll = document.querySelector('#checkout-scroll');
      const button = document.querySelector('.pay');
      const appBox = app.getBoundingClientRect();
      const buttonBox = button.getBoundingClientRect();
      return { buttonTop: +(buttonBox.top - appBox.top).toFixed(2), firstScreen: 640, delta: +(buttonBox.top - appBox.top - 640).toFixed(2), scrollTop: scroll.scrollTop };
    };
  </script>
</body>
</html>
