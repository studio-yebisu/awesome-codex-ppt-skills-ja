# kinetic-next-word — 직장인 AI 기초 강의 오프닝 「AI는 어떻게 답을 만드나: 다음 단어 예측」
# 컨셉 kinetic(카메라 고정, 글자가 무대). 스토리보드 정본: docs/concepts.md
# 확률 값은 전부 설명용 예시(slot-pick note로 화면 표기). 실측은 b-five 하나: assets/runs/haiku-5runs.md
# 프롬프트·답 문자열은 실측 원문 그대로(글자 하나 바꾸지 않음)

id: kinetic-next-word
title: "AI는 어떻게 답을 만드나: 다음 단어 예측"
lang: ko
concept: kinetic
sample: false
sources:
  - { id: s1, title: "Brown et al., Language Models are Few-Shot Learners (GPT-3), arXiv:2005.14165", url: "https://arxiv.org/abs/2005.14165", accessed: "2026-10-08" }

beats:
  # 1. 거대한 「AI」 글자 안에서 영상 → 글자가 문처럼 양옆으로 열림 → 영상이 접혀 커서가 됨
  - id: b-ai
    type: video
    src: assets/video/typing.mp4
    poster: assets/video/typing.jpg
    alt: "노트북 자판 위에서 문장을 치는 두 손"
    mode: loop
    mask: { type: text, text: "AI" }
    place: { slot: full }
    enter: { move: glyph-rise, params: { duration: 1.4 } }
    repeat: intended
    steps:
      - { name: open, move: word-door, params: { split: 1, duration: 2.4 } }
    link: { move: caret-collapse, params: { toPart: caret } }
    exportHold: 2.4

  # 2. 실측 프롬프트가 쳐지고, 실측 답이 한 단어씩 붙음 → 답이 「것을」까지 되감겨 접힘
  - id: b-ask
    type: prompt
    label: "AI에게 보낸 글"
    text: "신입사원 환영 메일 첫 문장을 한 문장만 써 줘. 설명 없이 문장만."
    result: { type: text, text: "새로운 동료가 되신 것을 진심으로 환영합니다, 함께 일하게 되어 기쁩니다." }
    place: { slot: bottom }
    enter: { move: type-on, params: { speed: 30 } }
    repeat: intended
    steps:
      - { name: answer, move: result-stream, params: { duration: 2.2 } }
    link: { move: phrase-fold, params: { fromPart: word, toPart: word, keepFrom: 0, keepTo: 3, fold: right, caret: true } }
    exportHold: 2.8

  # 3. 되감긴 앞부분 + 커서
  - id: b-rewind
    type: text
    text: "새로운 동료가 되신 것을"
    lines: ["새로운 동료가 되신", "것을"]
    size: l
    place: { slot: left }
    enter: { move: "engine:none" }
    ambient: [ { move: caret-blink, params: { after: -1 } } ]
    exit: { move: "engine:none" }
    repeat: intended
    hold: 0.4

  # 4. 다음 칸 후보 → 「진심으로」를 고름 (같은 자리 컷: at 0)
  - id: b-pick1
    type: text
    text: "새로운 동료가 되신 것을 진심으로"
    lines: ["새로운 동료가 되신", "것을 진심으로"]
    size: l
    place: { slot: left }
    at: 0
    enter:
      move: slot-pick
      params:
        word: 4
        candidates:
          - { word: "진심으로", p: 46 }
          - { word: "환영합니다", p: 27 }
          - { word: "축하드립니다", p: 9 }
          - { word: "함께", p: 7 }
          - { word: "기타", p: 11, other: true }
        note: "확률은 설명용 예시"
    repeat: intended
    exit: { move: "engine:none" }
    exportHold: 2.2

  # 5. 한 칸 더, 이번엔 빠르게
  - id: b-pick2
    type: text
    text: "새로운 동료가 되신 것을 진심으로 환영합니다"
    lines: ["새로운 동료가 되신", "것을 진심으로 환영합니다"]
    size: l
    place: { slot: left }
    at: 0
    enter:
      move: slot-pick
      params:
        word: 5
        speed: 1.4
        candidates:
          - { word: "환영합니다", p: 71 }
          - { word: "축하드립니다", p: 13 }
          - { word: "반갑게", p: 6 }
          - { word: "기쁘게", p: 4 }
          - { word: "기타", p: 6, other: true }
        note: "확률은 설명용 예시"
    repeat: intended
    exit: { move: blur-drop }

  # 6. 원리 한 문장 → 「다음 단어」만 남기고 접힘
  - id: b-rule
    type: text
    text: "다음 단어 하나를 골라 붙이고, 다시 고른다"
    lines: ["다음 단어 하나를 골라", "붙이고, 다시 고른다"]
    emphasis: ["다음 단어"]
    size: l
    place: { slot: center }
    at: 0.6
    enter: { move: push-build, params: { accentWords: [0, 1] } }
    link: { move: phrase-fold, params: { fromPart: word, toPart: word, keepFrom: 0, keepTo: 1, fold: both, appendIn: true } }
    repeat: intended

  # 7. 강의 제목이 여기서 처음 뜸
  - id: b-name
    type: text
    text: "다음 단어 예측"
    size: xl
    place: { slot: center }
    enter: { move: "engine:none" }
    exit: { move: half-split }
    repeat: intended
    exportHold: 2.4

  - id: b-where
    type: text
    text: "이 확률은 수많은 글을 읽고 맞춰 둔 숫자들이 계산한다"
    lines: ["이 확률은 수많은 글을 읽고", "맞춰 둔 숫자들이 계산한다"]
    size: l
    place: { slot: center }
    at: 0.7
    enter: { move: tracking-close }
    exit: { move: sweep-out }
    repeat: intended

  - id: b-number
    type: number
    value: 1750
    format: { unit: "억 개" }
    from: 0
    label: "GPT-3(2020)가 다음 단어의 확률을 계산하는 데 쓰는 숫자, 파라미터"
    source: s1
    place: { slot: center }
    at: 0.75
    enter: { move: count-roll }
    exit: { move: sweep-out }
    repeat: intended

  # 10. 흔한 오해 「맞는」 → 취소선·스크램블 → 「그럴듯한」
  - id: b-plausible
    type: text
    text: "AI는 그럴듯한 단어를 고른다"
    lines: ["AI는", "그럴듯한 단어를", "고른다"]
    emphasis: ["그럴듯한"]
    size: xl
    place: { slot: center }
    at: 0.75
    enter: { move: word-slam }
    steps:
      - { name: swap, move: scramble-swap, params: { word: 1, from: "맞는" } }
    exit: { move: scramble-out }
    exportHold: 2.4

  # 11. 같은 글을 다시(빠르게) → 보내는 순간 입력창이 영상 프레임으로 열림
  - id: b-again
    type: prompt
    label: "같은 글을 다섯 번 보냈다"
    text: "신입사원 환영 메일 첫 문장을 한 문장만 써 줘. 설명 없이 문장만."
    place: { slot: bottom }
    at: 0.7
    enter: { move: type-on, params: { speed: 60 } }
    repeat: intended
    link: { move: field-burst }

  # 12. 실측 다섯 답이 동시에 써지는 스크럽 영상(HyperFrames 렌더)
  - id: b-five
    type: video
    src: assets/video/five-answers/five-answers.mp4
    poster: assets/video/five-answers/poster.webp
    frames: assets/video/five-answers/frames.json
    alt: "같은 프롬프트에 대한 다섯 개의 실제 답이 한 어절씩 동시에 써지다 중간에서 갈라지는 화면"
    caption: "같은 글, 다섯 번의 답 · claude-haiku-5-5 · 2026-10-08"
    mode: scrub
    place: { slot: full }
    enter: { move: video-scrub, params: { duration: 3.6, stops: [ { name: split, at: 0.46 } ] } }
    link: { move: into-word, params: { word: 3 } }
    exportHold: 2.6

  - id: b-differ
    type: text
    text: "1등만 고르지 않으니까 매번 답이 달라진다"
    lines: ["1등만 고르지 않으니까", "매번 답이 달라진다"]
    emphasis: ["매번"]
    size: l
    place: { slot: center }
    enter: { move: "engine:none" }
    exit: { move: blur-drop }
    repeat: intended

  - id: b-rules
    type: text
    text: "맥락을 먼저 준다 사실은 따로 확인한다 여러 번 받아 보고 고른다"
    lines: ["맥락을 먼저 준다", "사실은 따로 확인한다", "여러 번 받아 보고 고른다"]
    size: l
    place: { slot: center }
    at: 0.6
    enter: { move: line-focus, params: { perLine: 1.1 } }
    exit: { move: half-split }
    repeat: intended
    exportHold: 2.0

  # 15. 북엔드: 「다음」 글자 안에서 펜으로 쓰는 손
  - id: b-close
    type: video
    src: assets/video/writing.mp4
    poster: assets/video/writing.jpg
    alt: "종이 노트에 펜으로 글을 쓰는 손"
    caption: "다음 단어는, 여러분이 쓴 글이 정한다"
    mode: loop
    mask: { type: text, text: "다음" }
    place: { slot: full }
    at: 0.7
    enter: { move: glyph-rise, params: { duration: 1.6, maskScale: 0.6, maskY: 0.42 } }
    repeat: intended
    exportHold: 3.0
