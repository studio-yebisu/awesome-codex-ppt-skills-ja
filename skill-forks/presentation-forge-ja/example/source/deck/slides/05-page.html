<section class="slide"><h2 class="title" data-anim="rise">失敗したあとにも、進む道を残す。</h2><ol class="timeline" data-stagger="rise"><li><p class="timeline__date">RETRY</p><h3>もう一度試す</h3><p>同じ入力で続ける</p></li><li><p class="timeline__date">CHANGE</p><h3>選び直す</h3><p>入力を変えて始める</p></li><li><p class="timeline__date">CLOSE</p><h3>いったん閉じる</h3><p>ここで中止する</p></li></ol><p class="muted">実装で用意した行動だけを、画面に置く。</p><aside class="notes"><p>三つの行動は同時に選べる候補。再試行は入力を保つ場合、選び直しは入力を変える場合、閉じるは中止する場合に使う。</p><p>進行：どれかが現在選ばれている印ではない。実装で用意できる行動だけを残す。</p></aside></section>
