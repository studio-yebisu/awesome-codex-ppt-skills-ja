<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[必填] 替换为PPT标题</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ===== 主题色 (靛蓝瓷 默认) ===== */
  /* 如需切换主题，整体替换以下6行 + accent色 */
  :root {
    --ink: #0a1f3d;    --ink-rgb: 10,31,61;
    --paper: #f1f3f5;  --paper-rgb: 241,243,245;
    --paper-tint: #e4e8ec;
    --ink-tint: #152a4a;
    --accent: #3b82f6; --accent-rgb: 59,130,246;
    --success: #16a34a; --warning: #d97706; --danger: #dc2626;
    /* 字体 */
    --serif-zh: 'Noto Serif SC','Source Han Serif SC',serif;
    --sans-zh: 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
    --sans-en: 'Inter',-apple-system,sans-serif;
    --mono: 'IBM Plex Mono','Cascadia Code',monospace;
  }

  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
  html { font-size:16px; }
  body {
    font-family: var(--sans-zh); color: var(--ink); background: var(--paper);
    overflow: hidden; height: 100vh; width: 100vw;
  }

  .deck-wrapper {
    display: flex; height: 100vh; width: 100%;
    overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory; scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }
  .deck-wrapper::-webkit-scrollbar { display: none; }

  .slide {
    flex: 0 0 100vw; height: 100vh; scroll-snap-align: start;
    display: grid; grid-template-rows: auto 1fr auto;
    padding: 3vh 5vw; position: relative; overflow: hidden;
  }
  .light { background: var(--paper); color: var(--ink); }
  .dark  { background: var(--ink); color: var(--paper); }
  .hero.light { background: linear-gradient(135deg,var(--paper),var(--paper-tint)); }
  .hero.dark  { background: linear-gradient(135deg,var(--ink),var(--ink-tint)); }

  .chrome {
    display: flex; justify-content: space-between; align-items: center;
    padding: 1vh 0 2vh;
    font-family: var(--mono); font-size: clamp(10px,0.7vw,14px);
    letter-spacing: .05em; opacity: .5; border-bottom: 1px solid;
  }
  .foot {
    display: flex; justify-content: space-between; align-items: center;
    padding: 2vh 0 1vh;
    font-family: var(--mono); font-size: clamp(10px,0.65vw,13px); opacity: .4;
    border-top: 1px solid;
  }
  .frame { display: flex; flex-direction: column; justify-content: center; padding: 2vh 0; height: 100%; }

  .kicker { font-family:var(--mono); font-size:clamp(11px,0.8vw,15px); font-weight:500; letter-spacing:.15em; opacity:.6; text-transform:uppercase; margin-bottom:1.5vh; }
  .h-hero { font-family:var(--serif-zh); font-weight:900; font-size:clamp(36px,6vw,80px); line-height:1.15; letter-spacing:-.02em; }
  .h-xl { font-family:var(--serif-zh); font-weight:700; font-size:clamp(28px,3.5vw,52px); line-height:1.2; letter-spacing:-.01em; }
  .h-sub { font-family:var(--serif-zh); font-weight:600; font-size:clamp(20px,2vw,32px); line-height:1.3; opacity:.8; margin-top:.5vh; }
  .lead { font-family:var(--sans-zh); font-weight:300; font-size:clamp(15px,1.15vw,20px); line-height:1.7; opacity:.75; max-width:55vw; margin-top:2vh; }
  .meta-row { display:flex; gap:.8vw; align-items:center; font-family:var(--mono); font-size:clamp(11px,0.7vw,14px); opacity:.55; margin-top:2vh; }

  .grid-6 { display:grid; grid-template-columns:repeat(3,1fr); gap:2vw 3vh; margin-top:3vh; }
  .grid-4 { display:grid; grid-template-columns:repeat(4,1fr); gap:2vw 3vh; margin-top:3vh; }
  .grid-3-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:2vw 2vh; margin-top:3vh; }
  .grid-2-7-5 { display:grid; grid-template-columns:7fr 5fr; gap:3vw; align-items:start; }
  .grid-2-6-6 { display:grid; grid-template-columns:1fr 1fr; gap:3vw; align-items:start; }

  .stat-card { padding:2.5vh 1.5vw; border-left:3px solid var(--accent); background:rgba(var(--ink-rgb),.03); }
  .dark .stat-card { background:rgba(255,255,255,.05); }
  .stat-label { font-family:var(--mono); font-size:clamp(10px,.7vw,13px); letter-spacing:.1em; opacity:.5; margin-bottom:.8vh; }
  .stat-nb { font-family:var(--sans-en); font-weight:700; font-size:clamp(32px,3.5vw,56px); line-height:1; letter-spacing:-.03em; }
  .stat-unit { font-family:var(--serif-zh); font-size:.5em; opacity:.6; margin-left:.15em; }
  .stat-note { font-size:clamp(12px,.8vw,15px); opacity:.5; margin-top:.5vh; }

  .frame-img { width:100%; border-radius:4px; overflow:hidden; position:relative; }
  .frame-img.r-16x10 { aspect-ratio:16/10; }
  .frame-img.r-3x4 { aspect-ratio:3/4; max-height:60vh; }
  .frame-img img { width:100%; height:100%; object-fit:cover; object-position:top center; }
  .img-cap { position:absolute; bottom:0; left:0; right:0; padding:.8vh 1vw; background:linear-gradient(transparent,rgba(0,0,0,.6)); font-family:var(--mono); font-size:clamp(9px,.6vw,12px); color:#fff; opacity:.8; }

  .pipeline-section { margin-top:3vh; }
  .pipeline-label { font-family:var(--mono); font-size:clamp(10px,.7vw,13px); letter-spacing:.1em; opacity:.5; margin-bottom:1.5vh; }
  .pipeline { display:flex; gap:1.5vw; }
  .step { flex:1; padding:2vh 1.2vw; border:1px solid; opacity:.35; }
  .step.active { opacity:1; border-color:var(--accent); }
  .step-nb { font-family:var(--mono); font-size:clamp(12px,.8vw,15px); opacity:.4; }
  .step-title { font-weight:600; font-size:clamp(14px,1vw,18px); margin:.5vh 0; }
  .step-desc { font-size:clamp(11px,.7vw,14px); opacity:.6; }

  .callout { border-left:3px solid; padding:1.5vh 1.5vw; margin-top:2vh; font-family:var(--serif-zh); font-weight:600; font-size:clamp(14px,1.1vw,20px); opacity:.85; max-width:40vw; }
  .callout-src { font-family:var(--mono); font-size:clamp(10px,.65vw,13px); opacity:.5; margin-top:.8vh; }

  blockquote.bq { font-family:var(--serif-zh); font-weight:700; font-size:clamp(28px,4vw,64px); line-height:1.2; letter-spacing:-.01em; max-width:65vw; }

  .col-header { font-family:var(--mono); font-size:clamp(10px,.7vw,13px); letter-spacing:.15em; opacity:.5; margin-bottom:1.5vh; }
  .col-list { list-style:none; margin-top:2vh; }
  .col-list li { font-size:clamp(13px,.95vw,17px); line-height:1.6; padding:.6vh 0; border-bottom:1px solid; opacity:.4; }
  .before-col { opacity:.5; }
  .after-col .col-list li { opacity:.7; }

  .bg-ornament { position:absolute; font-family:var(--serif-zh); font-size:clamp(120px,20vw,300px); font-weight:900; opacity:.03; right:-2vw; bottom:-5vh; line-height:1; pointer-events:none; user-select:none; }

  @keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
  .anim { animation:fadeUp .6s ease-out both; }
  .anim-d1 { animation-delay:.1s; } .anim-d2 { animation-delay:.2s; }
  .anim-d3 { animation-delay:.3s; } .anim-d4 { animation-delay:.4s; }
  .anim-d5 { animation-delay:.5s; } .anim-d6 { animation-delay:.6s; }

  .progress-bar { height:3px; background:var(--accent); width:0; transition:width .3s; position:fixed; top:0; left:0; z-index:200; }
  #nav { position:fixed; bottom:3vh; left:50%; transform:translateX(-50%); display:flex; gap:.8vw; z-index:100; }
  #nav .dot { width:8px; height:8px; border-radius:50%; background:currentColor; opacity:.25; cursor:pointer; transition:opacity .2s,transform .2s; }
  #nav .dot.active { opacity:.8; transform:scale(1.4); }

  @media (max-width:768px) {
    .slide { padding:2vh 4vw; }
    .h-hero { font-size:clamp(28px,8vw,42px); }
    .lead { max-width:85vw; }
    .grid-2-7-5, .grid-2-6-6 { grid-template-columns:1fr; }
    .grid-6 { grid-template-columns:repeat(2,1fr); }
    .pipeline { flex-direction:column; }
    .callout, blockquote.bq { max-width:85vw; }
  }
</style>
</head>
<body>
<div class="progress-bar" id="progressBar"></div>
<div class="deck-wrapper" id="deck">

  <!-- ======== SLIDE 1: 封面 (示例) ======== -->
  <section class="slide hero dark">
    <div class="chrome"><div>标签</div><div>Vol.01</div></div>
    <div class="frame" style="align-content:center;gap:2vh">
      <div class="kicker anim anim-d1">引导语</div>
      <h1 class="h-hero anim anim-d2">主标题</h1>
      <h2 class="h-sub anim anim-d3">副标题</h2>
      <p class="lead anim anim-d4" style="max-width:48vw">简介内容。</p>
      <div class="meta-row anim anim-d5"><span>汇报人</span><span>·</span><span>日期</span></div>
    </div>
    <div class="foot"><div>项目信息</div><div>— 年份 —</div></div>
  </section>

  <!-- ======== SLIDE 2: 数据页 (示例) ======== -->
  <section class="slide light">
    <div class="chrome"><div>模块名</div><div>02 / N</div></div>
    <div class="frame" style="padding-top:3vh">
      <div class="kicker anim anim-d1">指标</div>
      <h2 class="h-xl anim anim-d2">数据标题</h2>
      <div class="grid-6" style="margin-top:2vh">
        <div class="stat-card anim anim-d1"><div class="stat-label">指标A</div><div class="stat-nb">100<span class="stat-unit">%</span></div><div class="stat-note">说明</div></div>
        <div class="stat-card anim anim-d2"><div class="stat-label">指标B</div><div class="stat-nb">200<span class="stat-unit">万</span></div><div class="stat-note">说明</div></div>
        <div class="stat-card anim anim-d3"><div class="stat-label">指标C</div><div class="stat-nb">98.6<span class="stat-unit">%</span></div><div class="stat-note">说明</div></div>
        <div class="stat-card anim anim-d4"><div class="stat-label">指标D</div><div class="stat-nb">300</div><div class="stat-note">说明</div></div>
        <div class="stat-card anim anim-d5"><div class="stat-label">指标E</div><div class="stat-nb">94.2<span class="stat-unit">%</span></div><div class="stat-note">说明</div></div>
        <div class="stat-card anim anim-d6"><div class="stat-label">指标F</div><div class="stat-nb">500<span class="stat-unit">人</span></div><div class="stat-note">说明</div></div>
      </div>
    </div>
    <div class="foot"><div>数据来源</div><div>页码</div></div>
  </section>

  <!-- ======== SLIDE 3: 内容页 (示例) ======== -->
  <section class="slide light">
    <div class="chrome"><div>模块名</div><div>03 / N</div></div>
    <div class="frame" style="padding-top:3vh">
      <div class="kicker anim anim-d1">标签</div>
      <h2 class="h-xl anim anim-d2">页面标题</h2>
      <p class="lead anim anim-d3">正文第一段，描述核心内容。</p>
      <p class="lead anim anim-d4" style="margin-top:1vh">正文第二段，补充说明。</p>
      <div class="callout anim anim-d5" style="margin-top:3vh">
        "引用金句"
        <div class="callout-src">— 出处</div>
      </div>
    </div>
    <div class="foot"><div>页脚</div><div>— · —</div></div>
  </section>

</div>
<div id="nav"></div>

<script>
(function(){
  const deck=document.getElementById('deck'), slides=document.querySelectorAll('.slide'), nav=document.getElementById('nav'), progress=document.getElementById('progressBar');
  slides.forEach((_,i)=>{const d=document.createElement('span');d.className='dot'+(i===0?' active':'');d.addEventListener('click',()=>slides[i].scrollIntoView({behavior:'smooth'}));nav.appendChild(d);});
  function onScroll(){
    const r=deck.scrollLeft/(deck.scrollWidth-deck.clientWidth);
    progress.style.width=(r*100)+'%';
    let ai=0; slides.forEach((s,i)=>{const b=s.getBoundingClientRect(),m=b.left+b.width/2;if(m>0&&m<window.innerWidth)ai=i;});
    document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===ai));
  }
  deck.addEventListener('scroll',onScroll);
  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();const n=slides[Math.min(currentSlide()+1,slides.length-1)];n.scrollIntoView({behavior:'smooth'});}
    if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();const p=slides[Math.max(currentSlide()-1,0)];p.scrollIntoView({behavior:'smooth'});}
  });
  function currentSlide(){let i=0;slides.forEach((s,idx)=>{const r=s.getBoundingClientRect();if(r.left<window.innerWidth/2)i=idx;});return i;}
  onScroll();
})();
</script>
</body>
</html>
