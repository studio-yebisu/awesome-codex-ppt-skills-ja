<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"/><text x="100" y="90" style="font-family:Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif;font-size:24px;font-weight:700;" fill="#000000">02 / PURPOSE + AUDIENCE</text><text x="100" y="1016" style="font-family:Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif;font-size:20px;font-weight:400;" fill="#000000">STUDIO YEBISU / FICTIONAL BRIEF EXAMPLES</text><text x="1710" y="1016" style="font-family:Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif;font-size:24px;font-weight:700;" fill="#000000">03 / 07</text><rect x="0" y="170" width="860" height="780" fill="#000000"/><text x="100" y="330" style="font-family:Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif;font-size:106px;font-weight:900;" fill="#FFFFFF">同じ展示会。</text><text x="100" y="470" style="font-family:Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif;font-size:106px;font-weight:900;" fill="#FFFFFF">違う、</text><text x="100" y="610" style="font-family:Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif;font-size:106px;font-weight:900;" fill="#FFFFFF">伝え方。</text><text x="100" y="865" style="font-family:Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif;font-size:28px;font-weight:700;" fill="#FFFFFF">EXAMPLE A / 招待メール</text><text x="960" y="240.0" style="font-family:Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif;font-size:62px;font-weight:900;" fill="#000000">目的を、行動まで書く。</text><text x="960" y="350" style="font-family:Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif;font-size:30px;font-weight:400;" fill="#000000">「魅力的に紹介して」から一歩具体的に。</text><text x="960" y="470" style="font-family:Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif;font-size:28px;font-weight:700;" fill="#E2001A">目的</text><text x="960" y="535.0" style="font-family:Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif;font-size:36px;font-weight:400;" fill="#000000">来場候補日を返信してもらう。</text><text x="960" y="589.0" style="font-family:Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif;font-size:36px;font-weight:400;" fill="#000000">展示の詳説より、返信しやすさを優先。</text><text x="960" y="700" style="font-family:Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif;font-size:28px;font-weight:700;" fill="#E2001A">読み手</text><text x="960" y="765.0" style="font-family:Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif;font-size:36px;font-weight:400;" fill="#000000">初めて来る近隣の店舗担当者。</text><text x="960" y="819.0" style="font-family:Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif;font-size:36px;font-weight:400;" fill="#000000">専門用語を避け、所要時間を明記。</text><text x="960" y="920" style="font-family:Noto Sans CJK JP,Noto Sans JP,Arial,sans-serif;font-size:30px;font-weight:700;" fill="#000000">依頼文：来場候補日を聞く、短い招待メールを。</text></svg>