<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"/><text x="100" y="90" style="font-family:Microsoft YaHei,Noto Sans CJK JP,SimHei,PingFang SC,sans-serif;font-size:24px;font-weight:700;" fill="#000000">01 / THE FIVE QUESTIONS</text><text x="100" y="1016" style="font-family:Microsoft YaHei,Noto Sans CJK JP,SimHei,PingFang SC,sans-serif;font-size:20px;font-weight:400;" fill="#000000">STUDIO YEBISU / FICTIONAL BRIEF EXAMPLES</text><text x="1710" y="1016" style="font-family:Microsoft YaHei,Noto Sans CJK JP,SimHei,PingFang SC,sans-serif;font-size:24px;font-weight:700;" fill="#000000">02 / 07</text><text x="100" y="250" style="font-family:Microsoft YaHei,Noto Sans CJK JP,SimHei,PingFang SC,sans-serif;font-size:74px;font-weight:900;" fill="#000000">依頼は、五つの問いで組み立てる。</text><line x1="100" y1="322" x2="1810" y2="322" stroke="#000000" stroke-width="2"/><text x="100" y="382" style="font-family:Microsoft YaHei,Noto Sans CJK JP,SimHei,PingFang SC,sans-serif;font-size:64px;font-weight:900;" fill="#E2001A">01</text><text x="330" y="376" style="font-family:Microsoft YaHei,Noto Sans CJK JP,SimHei,PingFang SC,sans-serif;font-size:42px;font-weight:700;" fill="#000000">目的</text><text x="650" y="370" style="font-family:Microsoft YaHei,Noto Sans CJK JP,SimHei,PingFang SC,sans-serif;font-size:36px;font-weight:400;" fill="#000000">読んだ後、何を判断・行動してほしい？</text><line x1="100" y1="435" x2="1810" y2="435" stroke="#000000" stroke-width="2"/><text x="100" y="495" style="font-family:Microsoft YaHei,Noto Sans CJK JP,SimHei,PingFang SC,sans-serif;font-size:64px;font-weight:900;" fill="#E2001A">02</text><text x="330" y="489" style="font-family:Microsoft YaHei,Noto Sans CJK JP,SimHei,PingFang SC,sans-serif;font-size:42px;font-weight:700;" fill="#000000">読み手</text><text x="650" y="483" style="font-family:Microsoft YaHei,Noto Sans CJK JP,SimHei,PingFang SC,sans-serif;font-size:36px;font-weight:400;" fill="#000000">誰が読む？ 何を知っている？</text><line x1="100" y1="548" x2="1810" y2="548" stroke="#000000" stroke-width="2"/><text x="100" y="608" style="font-family:Microsoft YaHei,Noto Sans CJK JP,SimHei,PingFang SC,sans-serif;font-size:64px;font-weight:900;" fill="#E2001A">03</text><text x="330" y="602" style="font-family:Microsoft YaHei,Noto Sans CJK JP,SimHei,PingFang SC,sans-serif;font-size:42px;font-weight:700;" fill="#000000">入力</text><text x="650" y="596" style="font-family:Microsoft YaHei,Noto Sans CJK JP,SimHei,PingFang SC,sans-serif;font-size:36px;font-weight:400;" fill="#000000">何を材料にする？ どれを正本にする？</text><line x1="100" y1="661" x2="1810" y2="661" stroke="#000000" stroke-width="2"/><text x="100" y="721" style="font-family:Microsoft YaHei,Noto Sans CJK JP,SimHei,PingFang SC,sans-serif;font-size:64px;font-weight:900;" fill="#E2001A">04</text><text x="330" y="715" style="font-family:Microsoft YaHei,Noto Sans CJK JP,SimHei,PingFang SC,sans-serif;font-size:42px;font-weight:700;" fill="#000000">制約</text><text x="650" y="709" style="font-family:Microsoft YaHei,Noto Sans CJK JP,SimHei,PingFang SC,sans-serif;font-size:36px;font-weight:400;" fill="#000000">長さ・語調・禁止事項・納品形式は？</text><line x1="100" y1="774" x2="1810" y2="774" stroke="#000000" stroke-width="2"/><text x="100" y="834" style="font-family:Microsoft YaHei,Noto Sans CJK JP,SimHei,PingFang SC,sans-serif;font-size:64px;font-weight:900;" fill="#E2001A">05</text><text x="330" y="828" style="font-family:Microsoft YaHei,Noto Sans CJK JP,SimHei,PingFang SC,sans-serif;font-size:42px;font-weight:700;" fill="#000000">完成条件</text><text x="650" y="822" style="font-family:Microsoft YaHei,Noto Sans CJK JP,SimHei,PingFang SC,sans-serif;font-size:36px;font-weight:400;" fill="#000000">何が揃えば、確認できる？</text></svg>