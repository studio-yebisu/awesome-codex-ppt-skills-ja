<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" lang="ja" font-family="BIZ UDPGothic" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" width="1280" height="720" fill="#F7F5EE" /><g id="heading" data-pptx-bounds="64 48 1150 112" font-weight="700"><text x="64" y="71" font-size="16" fill="#21654C">CAFE / PROPOSAL</text><text x="64" y="135" font-size="42" fill="#202C29">5週目に、投資判断を置く</text></g><g id="content" data-pptx-bounds="64 190 1150 450"><text x="64" y="213" font-size="21" fill="#53675E" font-weight="400">仮日程：各週の終わりを目盛りにする。資料が不足すれば決裁は延期。</text><text x="64" y="304" font-size="25" fill="#202C29" font-weight="700">現地調査</text><text x="64" y="334" font-size="20" fill="#53675E" font-weight="400">1〜2週</text><text x="64" y="396" font-size="25" fill="#202C29" font-weight="700">見積・条件交渉</text><text x="64" y="426" font-size="20" fill="#53675E" font-weight="400">3〜4週</text><text x="64" y="488" font-size="25" fill="#202C29" font-weight="700">投資決裁</text><text x="64" y="518" font-size="20" fill="#53675E" font-weight="400">5週</text><g id="decision-schedule"><g id="decision-schedule-chartArea"><rect x="310" y="250" width="885" height="2" fill="#53675E" /><!-- chart-plot-area: object=decision-schedule | 310,250,1195,510 --><rect x="310.0" y="250" width="1" height="260" fill="#CAD5CC" /><text x="302.0" y="240" font-size="17" fill="#53675E" font-weight="400">開始</text><rect x="487.0" y="250" width="1" height="260" fill="#CAD5CC" /><text x="465.0" y="240" font-size="17" fill="#53675E" font-weight="400">1週末</text><rect x="664.0" y="250" width="1" height="260" fill="#CAD5CC" /><text x="642.0" y="240" font-size="17" fill="#53675E" font-weight="400">2週末</text><rect x="841.0" y="250" width="1" height="260" fill="#CAD5CC" /><text x="819.0" y="240" font-size="17" fill="#53675E" font-weight="400">3週末</text><rect x="1018.0" y="250" width="1" height="260" fill="#CAD5CC" /><text x="996.0" y="240" font-size="17" fill="#53675E" font-weight="400">4週末</text><rect x="1195.0" y="250" width="1" height="260" fill="#CAD5CC" /><text x="1173.0" y="240" font-size="17" fill="#53675E" font-weight="400">5週末</text><rect x="310.0" y="290" width="354.0" height="44" fill="#21654C" /><text x="326.0" y="320" font-size="23" fill="#FFFFFF" font-weight="700">1〜2週</text><rect x="664.0" y="382" width="354.0" height="44" fill="#21654C" /><text x="680.0" y="412" font-size="23" fill="#FFFFFF" font-weight="700">3〜4週</text><rect x="1018.0" y="474" width="177.0" height="44" fill="#21654C" /><text x="1034.0" y="504" font-size="23" fill="#FFFFFF" font-weight="700">5週</text></g></g><text x="64" y="566" font-size="22" fill="#202C29" font-weight="400">担当：調査は既存店長、運営設計は新店候補店長、決裁は経営者。</text><rect x="64" y="587" width="1150" height="2" fill="#CAD5CC" /><text x="64" y="625" font-size="25" fill="#21654C" font-weight="700">決裁後：内装・採用・開業準備　／　開業日はここでは確定しない。</text></g><g id="footer" data-pptx-bounds="64 659 1150 28" fill="#53675E" font-weight="400"><text x="64" y="679" font-size="14">架空の組織・数値による制作サンプル / STUDIO YEBISU</text><text x="1115" y="679" font-size="16">07 / 08</text></g></svg>
