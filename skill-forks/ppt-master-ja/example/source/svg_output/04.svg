<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" lang="ja" font-family="BIZ UDPGothic" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" width="1280" height="720" fill="#F7F5EE" /><g id="heading" data-pptx-bounds="64 48 1150 112" font-weight="700"><text x="64" y="71" font-size="16" fill="#21654C">CAFE / PROPOSAL</text><text x="64" y="135" font-size="42" fill="#202C29">損益分岐は、一日60人</text></g><g id="content" data-pptx-bounds="64 190 1150 450"><text x="64" y="273" font-size="74" fill="#21654C" font-weight="700">42.4</text><text x="262" y="270" font-size="27" fill="#202C29" font-weight="400">万円 / 月の営業利益（仮定）</text><text x="64" y="340" font-size="26" fill="#202C29" font-weight="400">計画売上 234.52万円</text><text x="64" y="398" font-size="26" fill="#202C29" font-weight="400">変動費 82.08万円</text><text x="64" y="456" font-size="26" fill="#202C29" font-weight="400">固定費 110万円</text><text x="665" y="261" font-size="24" fill="#202C29" font-weight="400">売上 = 82人 × 1,100円 × 26日</text><text x="665" y="323" font-size="24" fill="#202C29" font-weight="400">変動費率 = 35%</text><text x="665" y="385" font-size="24" fill="#202C29" font-weight="400">損益分岐 = 110万円 ÷ 65%</text><text x="665" y="447" font-size="24" fill="#202C29" font-weight="400">必要客数 = 59.2人 / 日</text><text x="665" y="545" font-size="25" fill="#A34327" font-weight="700">55人 / 日なら -7.8万円の赤字</text><text x="64" y="608" font-size="19" fill="#53675E" font-weight="400">税・資金繰り・減価償却の別途精査が必要。初期費用880万円は仮見積。</text></g><g id="footer" data-pptx-bounds="64 659 1150 28" fill="#53675E" font-weight="400"><text x="64" y="679" font-size="14">架空の組織・数値による制作サンプル / STUDIO YEBISU</text><text x="1115" y="679" font-size="16">04 / 08</text></g></svg>
