<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" lang="ja" font-family="BIZ UDPGothic" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" width="1280" height="720" fill="#F7F5EE" /><g id="heading" data-pptx-bounds="64 48 1150 112" font-weight="700"><text x="64" y="71" font-size="16" fill="#21654C">CAFE / PROPOSAL</text><text x="64" y="135" font-size="42" fill="#202C29">契約前に、3つのリスクを確認</text></g><g id="content" data-pptx-bounds="64 190 1150 450"><g id="risk-confirmation" data-pptx-bounds="64 245 1150 346"><text x="64" y="216" font-size="21" fill="#53675E" font-weight="400">検証前の確認表。仮定が崩れた場合は計画を修正する。</text><rect x="64" y="245" width="1150" height="52" fill="#21654C" /><text x="82" y="279" font-size="24" fill="#FFFFFF" font-weight="700">リスク</text><text x="390" y="279" font-size="24" fill="#FFFFFF" font-weight="700">確認すること</text><text x="842" y="279" font-size="24" fill="#FFFFFF" font-weight="700">次の判断に出す材料</text><rect x="64" y="297" width="1150" height="98" fill="#E5EEE7" /><text x="82" y="338" font-size="25" fill="#21654C" font-weight="700">客数が不足</text><text x="390" y="332" font-size="23" fill="#202C29" font-weight="400">2週間の通行量調査</text><text x="390" y="369" font-size="23" fill="#202C29" font-weight="400">試験販売で客単価を確認</text><text x="842" y="332" font-size="23" fill="#202C29" font-weight="400">計画82人・1,100円に</text><text x="842" y="369" font-size="23" fill="#202C29" font-weight="400">根拠があるか</text><rect x="64" y="394" width="1150" height="1" fill="#CAD5CC" /><rect x="64" y="395" width="1150" height="98" fill="#F7F5EE" /><text x="82" y="436" font-size="25" fill="#21654C" font-weight="700">工事額が上振れ</text><text x="390" y="430" font-size="23" fill="#202C29" font-weight="400">同じ条件で3社へ見積</text><text x="390" y="467" font-size="23" fill="#202C29" font-weight="400">予備費と上限を確認</text><text x="842" y="430" font-size="23" fill="#202C29" font-weight="400">見積額と予備費を含む</text><text x="842" y="467" font-size="23" fill="#202C29" font-weight="400">必要資金</text><rect x="64" y="492" width="1150" height="1" fill="#CAD5CC" /><rect x="64" y="493" width="1150" height="98" fill="#E5EEE7" /><text x="82" y="534" font-size="25" fill="#21654C" font-weight="700">店長が不足</text><text x="390" y="528" font-size="23" fill="#202C29" font-weight="400">候補者の意向と配置を確認</text><text x="390" y="565" font-size="23" fill="#202C29" font-weight="400">採用・育成の日程を確定</text><text x="842" y="528" font-size="23" fill="#202C29" font-weight="400">配置の見通しと</text><text x="842" y="565" font-size="23" fill="#202C29" font-weight="400">育成に必要な期間</text><rect x="64" y="590" width="1150" height="1" fill="#CAD5CC" /><text x="64" y="628" font-size="22" fill="#53675E" font-weight="400">契約が前提ではない。確認結果と追加資金を、投資決裁へ出す。</text></g></g><g id="footer" data-pptx-bounds="64 659 1150 28" fill="#53675E" font-weight="400"><text x="64" y="679" font-size="14">架空の組織・数値による制作サンプル / STUDIO YEBISU</text><text x="1115" y="679" font-size="16">06 / 08</text></g></svg>
