<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" lang="ja" font-family="BIZ UDPGothic" data-pptx-page-role="content"><rect id="background" data-pptx-role="background" width="1280" height="720" fill="#F7F5EE" /><g id="heading" data-pptx-bounds="64 48 1150 112" font-weight="700"><text x="64" y="71" font-size="16" fill="#21654C">CAFE / PROPOSAL</text><text x="64" y="135" font-size="42" fill="#202C29">仕込みと購買を共通化する</text></g><g id="content" data-pptx-bounds="64 190 1150 450"><text x="64" y="218" font-size="21" fill="#53675E" font-weight="400">運営体制の提案。仕込みの量・移送時間・繁忙時の負荷は未確認。</text><rect x="64" y="254" width="430" height="166" fill="#E5EEE7" /><text x="88" y="294" font-size="30" fill="#21654C" font-weight="700">既存店：24席</text><text x="88" y="338" font-size="24" fill="#202C29" font-weight="400">日常使いの営業を維持</text><text x="88" y="381" font-size="24" fill="#202C29" font-weight="400">仕込みの一部を支える</text><rect x="784" y="254" width="430" height="166" fill="#E5EEE7" /><text x="808" y="294" font-size="30" fill="#21654C" font-weight="700">新店：32席</text><text x="808" y="338" font-size="24" fill="#202C29" font-weight="400">落ち着いて滞在する店舗</text><text x="808" y="381" font-size="24" fill="#202C29" font-weight="400">店長候補の配置を先行</text><text x="540" y="302" font-size="22" fill="#21654C" font-weight="700">一部の仕込み</text><rect x="516" y="333" width="239" height="3" fill="#21654C" /><text x="738" y="347" font-size="34" fill="#21654C" font-weight="700">→</text><text x="522" y="390" font-size="19" fill="#53675E" font-weight="400">支援できる量を調べる</text><rect x="277" y="420" width="3" height="46" fill="#21654C" /><rect x="997" y="420" width="3" height="46" fill="#21654C" /><rect x="64" y="466" width="1150" height="109" fill="#21654C" /><text x="88" y="503" font-size="27" fill="#FFFFFF" font-weight="700">両店でそろえるもの</text><text x="88" y="546" font-size="25" fill="#FFFFFF" font-weight="400">材料の購買　／　品質基準　／　日報</text><text x="64" y="613" font-size="22" fill="#53675E" font-weight="400">共通化の前に、既存店の営業を圧迫しないことを確かめる。</text></g><g id="footer" data-pptx-bounds="64 659 1150 28" fill="#53675E" font-weight="400"><text x="64" y="679" font-size="14">架空の組織・数値による制作サンプル / STUDIO YEBISU</text><text x="1115" y="679" font-size="16">05 / 08</text></g></svg>
