<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>喫茶つむぎ 2号店出店提案</title><style>body{margin:0;background:#182119;color:#fff;font-family:sans-serif}img{width:100vw;height:calc(100dvh - 50px);object-fit:contain}nav{height:40px;display:flex;gap:14px;align-items:center;justify-content:center}button,a{color:white;background:#283929;border:1px solid #666;padding:8px;text-decoration:none}</style><img id="page" alt=""><nav><button id="prev">←</button><span id="counter"></span><button id="next">→</button><a href="deck.pptx" download>PPTX ↓</a><a href="render/deck.pdf" download>PDF ↓</a></nav><script>const pages=[{"image": "render/slide-01.png", "title": "運河沿いB案を、調査・交渉へ"}, {"image": "render/slide-02.png", "title": "新店の顧客と、既存店との役割"}, {"image": "render/slide-03.png", "title": "候補地の比較：B案は82点"}, {"image": "render/slide-04.png", "title": "損益分岐は、一日60人"}, {"image": "render/slide-05.png", "title": "仕込みと購買を共通化する"}, {"image": "render/slide-06.png", "title": "契約前に、3つのリスクを確認"}, {"image": "render/slide-07.png", "title": "5週目に、投資判断を置く"}, {"image": "render/slide-08.png", "title": "今日の決裁：B案の調査を進める"}];let n=0;function show(i){n=Math.max(0,Math.min(i,pages.length-1));document.getElementById("page").src=pages[n].image;document.getElementById("page").alt=pages[n].title;document.getElementById("counter").textContent=(n+1)+" / "+pages.length;}document.getElementById("prev").onclick=()=>show(n-1);document.getElementById("next").onclick=()=>show(n+1);document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")show(n+1);if(e.key==="ArrowLeft")show(n-1)});show(0);</script></html>
