name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install repository dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Agent Skills reference validator
        if: matrix.python-version == '3.12'
        run: pip install "git+https://github.com/agentskills/agentskills.git#subdirectory=skills-ref"

      - name: Validate repository
        run: |
          python scripts/sync_plugin.py --check
          python scripts/validate_repo.py

      - name: Validate Agent Skills packages
        if: matrix.python-version == '3.12'
        run: |
          ln -s "$PWD" "$RUNNER_TEMP/paper2ppt"
          skills-ref validate "$RUNNER_TEMP/paper2ppt"
          skills-ref validate plugins/paper2ppt/skills/paper2ppt

      - name: Run tests
        run: pytest -q
