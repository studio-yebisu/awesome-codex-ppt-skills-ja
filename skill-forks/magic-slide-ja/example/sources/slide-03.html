<section class="slide " data-id="morning-3" data-transition="fade" data-stagger="cascade" data-bg="light" data-speaker-notes="前夜の準備は服・鍵・バッグの3つに限定します。カードの内容が次のページへ移動し、夜と朝の役割分担につながります。"><div class="slide-content"><div class="stage"><h2>前夜に、3つだけ。</h2><div class="items"><article class="prep"><h3><span class="object" data-magic-id="object-0" data-magic-line="nowrap">服</span></h3><p class="verb">明日着る1組を選ぶ</p><p class="detail">天気を見て、上から下までまとめる。</p><p class="time">朝の短縮候補：4分（仮定）</p></article><article class="prep"><h3><span class="object" data-magic-id="object-1" data-magic-line="nowrap">鍵</span></h3><p class="verb">置き場所を1か所に</p><p class="detail">帰宅したら玄関のトレーへ戻す。</p><p class="time">朝の短縮候補：3分（仮定）</p></article><article class="prep"><h3><span class="object" data-magic-id="object-2" data-magic-line="nowrap">バッグ</span></h3><p class="verb">必要な物を詰める</p><p class="detail">翌日の予定を見て、中身を確認する。</p><p class="time">朝の短縮候補：3分（仮定）</p></article></div><p class="foot">準備品は同じ場所へ。前夜の作業時間も、別に記録する。</p></div></div></section>
