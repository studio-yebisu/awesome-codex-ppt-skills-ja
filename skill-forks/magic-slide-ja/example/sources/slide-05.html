<section class="slide " data-id="morning-5" data-transition="fade" data-stagger="cascade" data-bg="light" data-speaker-notes="5日間、起床から出発までの時間と前夜の準備時間、忘れ物、負担感を記録します。記録はまだありません。朝の短縮と一日の負担の両方を見て継続・変更を決めます。"><div class="slide-content"><div class="stage"><h2>5日間、測って決める。</h2><div class="decision"><div><span class="test-days" data-magic-id="days" data-magic-line="nowrap">5日間</span><p class="lead">朝の目標は <span class="number" data-magic-id="target" data-magic-line="nowrap">30分</span>。</p><p class="small">記録はまだありません。</p></div><div><div class="measure"><div><h3>朝の時間</h3><p>起床 → 出発を計測</p></div><div><h3>前夜の時間</h3><p>追加準備にかかった時間</p></div><div><h3>忘れ物</h3><p>有無と、何を忘れたか</p></div><div><h3>負担感</h3><p>続けやすさを一言で</p></div></div><p class="finish">朝の短縮と一日の負担を比べて、<br>続ける・変えるを決める。</p></div></div><p class="foot">仮定を実績として扱わず、自分の記録で判断する。</p></div></div></section>
